<?xml version="1.0" encoding="UTF-8"?><!--*-nxml-*-->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  System-bus policy for `brain serve - -dbus-system` (com.swedishembedded.Brain1).

  Installed by the deb to /usr/share/dbus-1/system.d/ (see
  scripts/build/build-deb.sh). Deliberately restrictive: on the system bus,
  "callable" means ANY local user can run models, trigger auto-fetch (disk
  fill), and feed the fd-blob surface - so calls are limited to root and the
  `brain` group instead of the everyone-may-send policy an operator would
  otherwise improvise. Add operators with:  usermod -aG brain <user>
  (create the user and group first: useradd - -system - -no-create-home - -user-group brain).

  Referenced by `brain serve` help (- -dbus-system).
-->
<busconfig>
  <!-- The service runs as the unprivileged system user `brain`
       (useradd - -system - -no-create-home brain), never as root: the server
       parses media and model files from clients and the network, and must
       not do it with root's rights. Root keeps the right to call it. -->
  <policy user="brain">
    <allow own="com.swedishembedded.Brain1"/>
    <allow send_destination="com.swedishembedded.Brain1"/>
  </policy>
  <policy user="root">
    <allow send_destination="com.swedishembedded.Brain1"/>
  </policy>

  <!-- Everyone else: no calls to the service by default... -->
  <policy context="default">
    <deny send_destination="com.swedishembedded.Brain1"/>
  </policy>

  <!-- ...except members of the `brain` operator group. -->
  <policy group="brain">
    <allow send_destination="com.swedishembedded.Brain1"/>
  </policy>
</busconfig>
