default_install_hook_types: [pre-commit, commit-msg, pre-push]
repos:
  - repo: local
    hooks:
      - id: spdx-license-headers
        name: SPDX license headers (Apache-2.0)
        description: >-
          Every Rust/C/Python/shell/Makefile/WGSL/... source file must start
          with "SPDX-License-Identifier: Apache-2.0" plus the project
          copyright line right after it. See scripts/spdx/check.py.
        entry: python3 scripts/spdx/check.py
        language: system
        pass_filenames: true
        stages: [pre-commit]
      - id: no-doc-citations-in-code
        name: "No docs/ or .agents/ file-path citations in code"
        description: >-
          crates/, scripts/, tools/, and examples/ must never cite a docs/ or
          .agents/ file path (a comment, a doc-string, a user-facing error
          message) — those trees move and get rewritten, and a citation to
          them is a cross-reference nothing keeps in sync. State the fact or
          reasoning inline instead. See scripts/gates/check-no-doc-citations.sh.
          Diff-scoped (staged files only) at this stage; scripts/hooks/pre-push
          re-runs it as a full-tree scan so a commit that slipped past this
          hook (e.g. one a rebase replayed without firing it) still gets
          caught before anything is shared.
        entry: bash scripts/gates/check-no-doc-citations.sh
        language: system
        pass_filenames: true
        stages: [pre-commit]
      - id: workspace-members-parse
        name: "Every crates/* manifest parses"
        description: >-
          The workspace globs crates/*, so ONE unparseable Cargo.toml (most
          often unresolved conflict markers) makes every crate unresolvable at
          manifest-parse time, and cargo's own error names whichever member it
          was resolving rather than the broken file. Names the file and line
          instead. See scripts/gates/check-workspace-members.sh.
        entry: bash scripts/gates/check-workspace-members.sh
        language: system
        pass_filenames: false
        files: (^|/)Cargo\.toml$
        stages: [pre-commit]
      - id: no-large-or-binary-files
        name: "No video, model weights, or oversized files"
        description: >-
          Refuses video containers and model weights at ANY size, and anything
          else over 6 MiB. A generated clip or checkpoint differs byte-for-byte
          on every regeneration, so each re-run adds a fresh copy that no later
          commit can remove - by the time it is noticed the fix is a history
          rewrite rather than a revert. .gitignore lists the weight extensions
          already, but `git add -f` walks straight past it. Documentation
          screenshots stay allowed; the ceiling sits above the largest one
          already tracked. See scripts/gates/check-large-files.sh.
        entry: bash scripts/gates/check-large-files.sh
        language: system
        pass_filenames: true
        stages: [pre-commit]
      - id: no-machine-paths-in-crates
        name: "No baked-in absolute machine paths under crates/"
        description: >-
          crates/ must resolve weights and fixtures from an env var or a CLI
          flag, never a literal like "/data/workspace/resources/...". Such a
          path resolves on one machine; everywhere else the .exists() check
          fails and the test skips itself, so a misconfigured run is
          indistinguishable from a missing fixture - and a skipped test is
          green. AGENTS.md has stated this rule, and quoted the grep for it,
          since long before anything ran it. See
          scripts/gates/check-no-machine-paths.sh. Diff-scoped here; the same
          script scans the whole tree under make check/paths.
        entry: bash scripts/gates/check-no-machine-paths.sh
        language: system
        pass_filenames: true
        stages: [pre-commit]
      - id: no-em-dash
        name: "No new em dashes (U+2014)"
        description: >-
          Refuses a commit that ADDS a new em dash (U+2014) -- diff-scoped,
          so the ~12k pre-existing occurrences across the repo's prose are
          grandfathered in. See scripts/hooks/no-em-dash.
        entry: python3 scripts/hooks/no-em-dash
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: strip-commit-trailers
        name: "Strip Co-Authored-By:/Claude-Session: trailers"
        description: >-
          Silently removes these trailer lines from the commit message —
          never fails the commit. See scripts/hooks/commit-msg.
        entry: python3 scripts/hooks/commit-msg
        language: system
        stages: [commit-msg]
      - id: no-commit-trailers-on-push
        name: "Pre-push backstop: trailers + doc citations"
        description: >-
          Fails the push if a Co-Authored-By:/Claude-Session: trailer
          survived (should only happen for a commit that bypassed the
          commit-msg hook), OR if the full working tree being pushed still
          cites a docs/ or .agents/ file path anywhere in crates/, scripts/,
          tools/, or examples/ (a full-tree, not diff-scoped, re-run of
          no-doc-citations-in-code -- the deterministic backstop for
          whatever got the diff-scoped commit-time check bypassed). See
          scripts/hooks/pre-push.
        entry: python3 scripts/hooks/pre-push
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
        verbose: true
