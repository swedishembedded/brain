default_install_hook_types: [pre-commit, commit-msg, pre-push]
repos:
  - repo: local
    hooks:
      - id: spdx-license-headers
        name: SPDX license headers (Apache-2.0)
        description: >-
          Every Rust/C/Python/shell/Makefile/WGSL/... source file must start
          with "SPDX-License-Identifier: Apache-2.0" plus the project
          copyright line right after it. See scripts/spdx/check.py.
        entry: python3 scripts/spdx/check.py
        language: system
        pass_filenames: true
        stages: [pre-commit]
      - id: no-doc-citations-in-code
        name: "No docs/ or .agents/ file-path citations in code"
        description: >-
          crates/, scripts/, tools/, and samples/ must never cite a docs/ or
          .agents/ file path (a comment, a doc-string, a user-facing error
          message) — those trees move and get rewritten, and a citation to
          them is a cross-reference nothing keeps in sync. State the fact or
          reasoning inline instead. See scripts/gates/check-no-doc-citations.sh.
          Diff-scoped (staged files only) at this stage; scripts/hooks/pre-push
          re-runs it as a full-tree scan so a commit that slipped past this
          hook (e.g. one a rebase replayed without firing it) still gets
          caught before anything is shared.
        entry: bash scripts/gates/check-no-doc-citations.sh
        language: system
        pass_filenames: true
        stages: [pre-commit]
      - id: workspace-members-parse
        name: "Every crates/* manifest parses"
        description: >-
          The workspace globs crates/*, so ONE unparseable Cargo.toml (most
          often unresolved conflict markers) makes every crate unresolvable at
          manifest-parse time, and cargo's own error names whichever member it
          was resolving rather than the broken file. Names the file and line
          instead. See scripts/gates/check-workspace-members.sh.
        entry: bash scripts/gates/check-workspace-members.sh
        language: system
        pass_filenames: false
        files: (^|/)Cargo\.toml$
        stages: [pre-commit]
      - id: no-large-or-binary-files
        name: "No video, model weights, or oversized files"
        description: >-
          Refuses video containers and model weights at ANY size, and anything
          else over 6 MiB. A generated clip or checkpoint differs byte-for-byte
          on every regeneration, so each re-run adds a fresh copy that no later
          commit can remove - by the time it is noticed the fix is a history
          rewrite rather than a revert. .gitignore lists the weight extensions
          already, but `git add -f` walks straight past it. Documentation
          screenshots stay allowed; the ceiling sits above the largest one
          already tracked. See scripts/gates/check-large-files.sh.
        entry: bash scripts/gates/check-large-files.sh
        language: system
        pass_filenames: true
        stages: [pre-commit]
      - id: no-machine-paths-in-crates
        name: "No baked-in absolute machine paths; /data banned repo-wide"
        description: >-
          crates/ must resolve weights and fixtures from an env var or a CLI
          flag, never a literal like "/abs/workspace/resources/...". Such a
          path resolves on one machine; everywhere else the .exists() check
          fails and the test skips itself, so a misconfigured run is
          indistinguishable from a missing fixture - and a skipped test is
          green. AGENTS.md has stated this rule, and quoted the grep for it,
          since long before anything ran it. The dev box's /data mount is the
          stricter case: banned in ANY staged file, in any form. See
          scripts/gates/check-no-machine-paths.sh. Diff-scoped here; the same
          script scans the whole tree under make check/paths.
        entry: bash scripts/gates/check-no-machine-paths.sh
        language: system
        pass_filenames: true
        stages: [pre-commit]
      - id: repo-scope
        name: "No tracked file names a project brain does not depend on"
        description: >-
          brain is the model engine and depends on no agent runtime or
          orchestration service, so no tracked file names one; a caller is
          described generically ("an agent runtime", "an orchestrator").
          CHANGELOG.md is history and exempt. See AGENTS.md "Repository
          scope" and scripts/gates/check-repo-scope.sh. Diff-scoped here;
          the same script scans the whole tree under make check/scope.
        entry: bash scripts/gates/check-repo-scope.sh
        language: system
        pass_filenames: true
        stages: [pre-commit]
      - id: agents-md
        name: "AGENTS.md stays a short routing guide whose paths exist"
        description: >-
          AGENTS.md routes to the files that own a subject and holds no
          status; scripts/gates/check-agents-md.sh enforces its line budget
          and that every repository path it names exists.
        entry: bash scripts/gates/check-agents-md.sh
        language: system
        files: ^AGENTS\.md$
        pass_filenames: false
        stages: [pre-commit]
      - id: make-targets
        name: "Make targets are a documented concept/subconcept/action tree"
        description: >-
          Every public make target is <concept>/<subconcept>/.../<action>,
          every prefix is itself a target, and every target has a
          "## name - description" line under a "##@ Section" line, so that
          `make help` and tab completion can descend the tree. See AGENTS.md
          "Make targets" and scripts/gates/check-make-targets.sh. Also run
          by `make check/make-targets`.
        entry: bash scripts/gates/check-make-targets.sh
        language: system
        files: '(^|/)Makefile$'
        pass_filenames: false
        stages: [pre-commit]
      - id: saved-policy
        name: "Every backward takes the saved-activation policy (or states why it needs none)"
        description: >-
          A crate that defines a backward lets its training run choose what the
          backward keeps (model::saved), or is listed in
          scripts/gates/saved-policy.allow with the reason it needs none. See
          scripts/gates/check-saved-policy.sh. Also run by
          `make check/saved-policy`.
        entry: bash scripts/gates/check-saved-policy.sh
        language: system
        files: '(^crates/.*\.rs$|^scripts/gates/saved-policy\.allow$)'
        pass_filenames: false
        stages: [pre-commit]
      - id: env-reads
        name: "No new environment reads under crates/ (add a flag, not a variable)"
        description: >-
          Environment variables are being phased out in favour of CLI flags.
          Every env read under crates/ is on scripts/gates/env-reads.allow and
          the list only shrinks: a new read, or an entry whose read is gone,
          fails. See scripts/gates/check-env-reads.sh. Also run by
          `make check/env-reads`.
        entry: bash scripts/gates/check-env-reads.sh
        language: system
        files: '(^crates/.*\.rs$|^scripts/gates/env-reads\.(allow|py)$)'
        pass_filenames: false
        stages: [pre-commit]
      - id: env-writes
        name: "No environment writes (set_var/remove_var) in library code"
        description: >-
          The process environment is shared by every thread, so library code
          must pass a value down or scope it to its thread. Writes outside test
          code are listed with a reason in scripts/gates/env-writes.allow and
          the list only shrinks. See scripts/gates/check-env-writes.sh. Also run
          by `make check/env-writes`.
        entry: bash scripts/gates/check-env-writes.sh
        language: system
        files: '(^crates/.*\.rs$|^scripts/gates/env-writes\.(allow|py)$)'
        pass_filenames: false
        stages: [pre-commit]
      - id: crate-layers
        name: "Every workspace crate is on a layer and no crate depends upward"
        description: >-
          scripts/gates/crate-layers.map assigns EVERY workspace package a
          layer (1-6); a normal dependency on a higher-numbered layer fails
          unless listed with a reason in scripts/gates/crate-layers.allow
          (shrink-only), and the crate table in .agents/rules/architecture.md
          must match the map. See scripts/gates/check-crate-layers.sh. Also run
          by `make check/scripts`.
        entry: bash scripts/gates/check-crate-layers.sh
        language: system
        files: '(^crates/.*Cargo\.toml$|^Cargo\.toml$|^scripts/gates/(crate-layers\.|check-crate-layers\.sh)|^\.agents/rules/architecture\.md$)'
        pass_filenames: false
        stages: [pre-commit]
      - id: whole-tensor-loads
        name: "No new whole-tensor fp32 loads in production loaders"
        description: >-
          the whole-tensor load ratchet fails on a new whole-tensor call and on a stale entry, ignores bounded readers, tests and checkpoint internals. Allowlist: scripts/gates/whole-tensor-loads.allow (path, count, reason;
          shrink-only). See scripts/gates/check-whole-tensor-loads.sh. Also run by
          `make check/scripts`.
        entry: bash scripts/gates/check-whole-tensor-loads.sh
        language: system
        files: '(^crates/.*\.rs$|^scripts/gates/(whole-tensor-loads\.|check-whole-tensor-loads\.sh|ratchet\.py))'
        pass_filenames: false
        stages: [pre-commit]
      - id: format-logic
        name: "No format-specific kernel or codec logic in model crates"
        description: >-
          the format-logic ratchet fails on Weight-variant, kernel-lookup and codec calls in a layer-4 crate and on a stale entry, ignores layer 3, tests and comments. Allowlist: scripts/gates/format-logic.allow (path, count, reason;
          shrink-only). See scripts/gates/check-format-logic.sh. Also run by
          `make check/scripts`.
        entry: bash scripts/gates/check-format-logic.sh
        language: system
        files: '(^crates/.*\.rs$|^scripts/gates/(format-logic\.|check-format-logic\.sh|ratchet\.py))'
        pass_filenames: false
        stages: [pre-commit]
      - id: adapter-naming
        name: "Adapter parameter naming lives only in model::adapter"
        description: >-
          the adapter-naming ratchet fails on a .lora_a/.lora_b string outside model::adapter and on a stale entry, ignores comments and tests. Allowlist: scripts/gates/adapter-naming.allow (path, count, reason;
          shrink-only). See scripts/gates/check-adapter-naming.sh. Also run by
          `make check/scripts`.
        entry: bash scripts/gates/check-adapter-naming.sh
        language: system
        files: '(^crates/.*\.rs$|^scripts/gates/(adapter-naming\.|check-adapter-naming\.sh|ratchet\.py))'
        pass_filenames: false
        stages: [pre-commit]
      - id: placement-accounting
        name: "Placement charges physical bytes, not fp32 element counts"
        description: >-
          the placement-accounting ratchet fails on a new caller of an fp32-element sizing helper and on a stale entry, ignores the helper's own file, comments and tests. Allowlist: scripts/gates/placement-accounting.allow (path, count, reason;
          shrink-only). See scripts/gates/check-placement-accounting.sh. Also run by
          `make check/scripts`.
        entry: bash scripts/gates/check-placement-accounting.sh
        language: system
        files: '(^crates/.*\.rs$|^scripts/gates/(placement-accounting\.|check-placement-accounting\.sh|ratchet\.py))'
        pass_filenames: false
        stages: [pre-commit]
      - id: training-capabilities
        name: "The capability matrix page matches its declaration and the tests it names exist"
        description: >-
          docs/reference/training-capabilities.md is generated from
          scripts/gates/training-capabilities.tsv; the gate fails on drift, on a
          named test that is missing, not a #[test] or #[ignore]d without a
          (real)/(cuda) flag, and on a conformance tier or SDK fine-tuner
          declaration with no row. Regenerate with
          scripts/gates/training-capabilities.py --write. Also run by
          `make check/scripts`.
        entry: bash scripts/gates/check-training-capabilities.sh
        language: system
        files: '(^crates/.*\.rs$|^docs/reference/training-capabilities\.md$|^scripts/gates/(training-capabilities\.|check-training-capabilities\.sh))'
        pass_filenames: false
        stages: [pre-commit]
      - id: model-flags
        name: "No architecture-prefixed command-line flags"
        description: >-
          A flag spelled --<architecture>-<option> (--qwen-ctx, --kronos-decoder,
          ...) is refused in production code: options are model-agnostic
          (model::policy) or derived from the memory plan. Deprecated aliases are
          listed with a reason in scripts/gates/model-flags.allow (shrink-only).
          See scripts/gates/check-model-flags.sh. Also run by `make check/scripts`.
        entry: bash scripts/gates/check-model-flags.sh
        language: system
        files: '(^crates/.*\.rs$|^scripts/gates/(model-flags\.|check-model-flags\.sh|ratchet\.py))'
        pass_filenames: false
        stages: [pre-commit]
      - id: seed-literals
        name: "No new literal seeds in production code (every default seed is random)"
        description: >-
          A literal seed in production code (Rust, Python, shell, a Makefile
          recipe or default, a command line in a Markdown code block) must be on a per-crate file under
          scripts/gates/seed-literals.allow.d/ with a reason, and the list only
          shrinks: a new literal, or an entry whose literal is gone, fails. See
          scripts/gates/check-seed-literals.sh. Also run by
          `make check/seed-literals`.
        entry: bash scripts/gates/check-seed-literals.sh
        language: system
        files: '(\.(rs|py|sh|bats|md|mk)$|(^|/)Makefile$|^scripts/gates/(seed-literals\.|check-seed-literals\.sh)|^scripts/gates/seed-literals\.allow\.d/)'
        pass_filenames: false
        stages: [pre-commit]
      - id: no-em-dash
        name: "No new em dashes (U+2014)"
        description: >-
          Refuses a commit that ADDS a new em dash (U+2014) -- diff-scoped,
          so the ~12k pre-existing occurrences across the repo's prose are
          grandfathered in. See scripts/hooks/no-em-dash.
        entry: python3 scripts/hooks/no-em-dash
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: strip-commit-trailers
        name: "Strip Co-Authored-By:/Claude-Session: trailers"
        description: >-
          Silently removes these trailer lines from the commit message —
          never fails the commit. See scripts/hooks/commit-msg.
        entry: python3 scripts/hooks/commit-msg
        language: system
        stages: [commit-msg]
      - id: no-commit-trailers-on-push
        name: "Pre-push backstop: trailers + doc citations"
        description: >-
          Fails the push if a Co-Authored-By:/Claude-Session: trailer
          survived (should only happen for a commit that bypassed the
          commit-msg hook), OR if the full working tree being pushed still
          cites a docs/ or .agents/ file path anywhere in crates/, scripts/,
          tools/, or samples/ (a full-tree, not diff-scoped, re-run of
          no-doc-citations-in-code -- the deterministic backstop for
          whatever got the diff-scoped commit-time check bypassed). See
          scripts/hooks/pre-push.
        entry: python3 scripts/hooks/pre-push
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
        verbose: true
