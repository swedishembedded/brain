[package]
# Package names under samples/ are derived from the path:
# `samples/learning/reader` -> `sample-learning-reader`.
name = "sample-learning-reader"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sample application: a model that reads a directory continually, refuses what is not worth learning, and can say what it gained."
publish = false

[dependencies]
# The ONLY brain dependency a sample may have is the SDK facade, and it must
# NAME the surfaces it uses. `reader` is the continual reader; `text` is the
# generation the distil stage drives (`brain::qa`) - the step that turns the
# corpus into question/answer pairs before anything is trained on it.
brain = { workspace = true, features = ["reader", "text"] }

[package.metadata.brain]
# `make check/samples` fails if the real `cargo tree` closure exceeds this.
# The reader builds on the study's architecture registry, so it carries that
# closure plus the model-free reader policy.
# 52 -> 53: the SDK links brain-seed (the shared draw and parser for an unset seed). The closure had already outgrown the earlier budget before this; that growth is not attributed here.
# 53 -> 56, attributed by bisecting `cargo tree`: dee1333a3 (survival benchmarks) put brain-horizon and brain-survival in the SDK's
# closure (+2, the closure was 54 from then; the budget of 53 only had brain-seed's +1 raised) and 0bd516395 (llmserve, the continuous-batching glue every LLM resident uses) added brain-llmserve (+1).
max-brain-crates = 56
