[package]
# Package names under samples/ are derived from the path:
# `samples/models/glmdsa` -> `sample-models-glmdsa`.
name = "sample-models-glmdsa"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sample application: the GLM-5.2 decoder from the command line - train, finetune, eval, generate and import with every parameter, plus the ONNX export and greedy decoding on the Intel NPU through OpenVINO."
publish = false

[dependencies]
# A per-model program links the model it drives and the shared action runner
# directly (samples/README.md rule 1).
brain-glmdsa.workspace = true
brain-invoke.workspace = true
brain-capability.workspace = true
brain-data.workspace = true
# The NPU route: the ONNX writer and the OpenVINO decoder session.
brain-npu.workspace = true
serde_json.workspace = true

[package.metadata.brain]
# `make check/samples` fails if the real `cargo tree` closure exceeds this.
max-brain-crates = 72
