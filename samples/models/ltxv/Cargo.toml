[package]
# Package names under samples/ are derived from the path:
# `samples/models/ltxv` -> `sample-models-ltxv`.
name = "sample-models-ltxv"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sample application: LTX-2.5 text-, image- and audio-to-video, masked editing, upscaling, extension and person replacement from the command line, every served action with every parameter, plus chaining stills into one clip."
publish = false

[dependencies]
# A per-model program links the model it drives and the shared action runner
# directly (samples/README.md rule 1).
brain-ltxv.workspace = true
brain-invoke.workspace = true
brain-loader.workspace = true
brain-capability.workspace = true
brain-audio.workspace = true
serde_json.workspace = true

[package.metadata.brain]
# `make check/samples` fails if the real `cargo tree` closure exceeds this.
max-brain-crates = 60
