[package]
# Package names under samples/ are derived from the path:
# `samples/tts/clone` -> `sample-tts-clone`. The Makefile's
# `samples/%/{build,run}` rules depend on that mapping; `make check/samples`
# enforces it.
name = "sample-tts-clone"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sample application: clone a voice from a reference clip and speak new text in it, through the public brain SDK."
publish = false

[dependencies]
# The ONLY brain dependency a sample may have is the SDK facade, and it must
# NAME the surfaces it uses - see samples/README.md rules 1 and 2. This one
# uses `audio` (TtsPipeline) and nothing else.
brain = { workspace = true, features = ["audio"] }
# Third-party, freely allowed by samples/README.md rule 1 - this sample's one
# dependency the SDK itself deliberately does not carry: playing PCM samples
# through the default output device when `--out` is omitted. Pure Rust, no
# `default-features` decoders needed since `TtsPipeline`'s `Audio` is already
# decoded f32 PCM (`rodio::buffer::SamplesBuffer` plays it directly, no WAV
# parse round-trip).
rodio = { version = "0.22", default-features = false, features = ["playback"] }

[package.metadata.brain]
# `make check/samples` fails if the real `cargo tree` closure exceeds this.
# A budget that has to be raised in the same commit as a new dependency is the
# point: closure growth becomes a decision instead of a drift. `audio` pulls
# in BOTH qwen3tts and cosyvoice (`TtsPipeline` dispatches between them at
# resolve time - see crates/sdk/src/tts.rs), which is why this is much
# higher than a single-architecture sample's budget.
#
# 67 -> 68: `brain-recon` joined, and not through anything audio - it arrives
# `recon <- worldmirror2 <- npu <- qwen3tts`, so the crate that added recon to
# worldmirror2 added it to every consumer of the audio surface at the same
# time. Recorded rather than absorbed silently, which is what the budget is
# for.
#
# 68 -> 69: `brain-rlcd` joined, by the same shape one level along - it
# arrives `rlcd <- eval <- npu <- qwen3tts`, so re-exporting `rlcd::metrics`
# from `eval` added it to every consumer of the audio surface.
# 69 -> 70: `brain-sfm` joined, by the same shape again - it arrives
# `sfm <- recon <- worldmirror2 <- npu <- qwen3tts`, so adding structure from
# motion to recon added it to every consumer of the audio surface. Measured
# via scripts/gates/check-samples.sh against the actual current closure.
# 70 -> 71: the SDK links brain-seed (the shared draw and parser for an unset seed). The closure had already outgrown the earlier budget before this; that growth is not attributed here.
# 71 -> 76, attributed by bisecting `cargo tree` from the 70 of 3e5167dd6: brain-camera (472c764a5, ray-evaluated renderer), brain-mvs (85906799a),
# brain-lpips (430596e1f), brain-nemotronasr (c6c8e49c5, one-shot Nemotron ASR) and brain-seed (24d9aeaf8) were each added to the SDK's closure; brain-llmserve (0bd516395) is the sixth.
# The earlier raise to 71 covered brain-seed only; the other four were never recorded.
max-brain-crates = 76
