[package]
name = "sample-fly-interactive"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sample application: drive a fruit fly's connectome in a MuJoCo body and watch it in a window, through the public brain SDK."
publish = false

[dependencies]
# The ONLY brain dependency a sample may have is the SDK facade, and it must
# NAME the surfaces it uses - see samples/README.md rules 1 and 2. This sample
# uses `creature` and nothing else, so it never compiles the image stack.
brain = { workspace = true, features = ["creature"] }

[package.metadata.brain]
# `make check/samples` fails if the real `cargo tree` closure exceeds this.
# A budget that has to be raised in the same commit as a new dependency is the
# point: closure growth becomes a decision instead of a drift.
max-brain-crates = 36
