[package]
# `samples/vision/fishtank` -> `sample-vision-fishtank`; see samples/README.md rule 4.
name = "sample-vision-fishtank"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sample application: head-coupled perspective (fish tank VR) - a shader-rendered scene that stays fixed behind and in front of the laptop screen while the viewer moves."
publish = false

[dependencies]
# The geometry this sample demonstrates: the off-axis projection through the
# display, the calibration profile, the eye estimator. Not an SDK surface yet
# (samples/README.md rule 1: an engine mechanism the SDK does not wrap).
brain-headpose.workspace = true
serde_json.workspace = true
# The renderer: a raster pipeline presented to a window surface. The engine's
# own GPU seam (`gpu-core`) is compute-only, so the sample talks to wgpu
# directly, at the version the workspace already pins.
wgpu.workspace = true
winit = "0.30"
pollster.workspace = true
bytemuck.workspace = true
# The HUD's bitmap font, the headless PNG writer, YUYV to RGB.
brain-imaging.workspace = true
# Webcam head tracking: V4L2 frames with their capture time, the OpenSeeFace
# landmark tracker on brain's own kernels and the device it runs on, and the
# model store the weights are found in.
brain-capture.workspace = true
brain-openseeface.workspace = true
# The OpenVINO runtime the tracker compiles for the NPU or GPU (its library
# directory is named explicitly; see `--openvino-libs`).
brain-openvino-rt.workspace = true
brain-gpu-core.workspace = true
brain-modelstore.workspace = true
brain-modelref.workspace = true

[package.metadata.brain]
# `make samples/vision/fishtank/build` also runs fetch-data.sh (the pinned
# face tracker and OpenVINO runtime), so `.../run` works right after it.
fetch-on-build = true
# `make check/samples` fails if the real `cargo tree` closure exceeds this.
# 28 -> 34: webcam tracking (capture, openseeface, its vision blocks, the model store).
max-brain-crates = 34
