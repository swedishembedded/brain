[package]
# Package names under samples/ are derived from the path:
# `samples/decision/triage` -> `sample-decision-triage`. The Makefile's
# `samples/%/{build,run}` rules depend on that mapping; `make check/samples`
# enforces it.
name = "sample-decision-triage"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sample application: train a decision model on BANKING77 and then answer questions about new messages, through the public brain SDK."
publish = false

[dependencies]
# The ONLY brain dependency a sample may have is the SDK facade, and it must
# NAME the surfaces it uses - see samples/README.md rules 1 and 2. This one
# uses `decision` and nothing else.
brain = { workspace = true, features = ["decision"] }

[package.metadata.brain]
# `make check/samples` fails if the real `cargo tree` closure exceeds this.
# 30 -> 31: the "decision" surface gained brain-decisions, the one engine
# over both decision architectures that the SDK and the served `decide`
# capability now share (it used to be private to the SDK).
max-brain-crates = 31
