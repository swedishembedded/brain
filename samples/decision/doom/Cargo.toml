[package]
# Package names under samples/ are derived from the path:
# `samples/decision/doom` -> `sample-decision-doom`. The Makefile's
# `samples/%/{build,run}` rules depend on that mapping; `make check/samples`
# enforces it.
name = "sample-decision-doom"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sample application: a decision model learning to play DOOM from the game's own structured state, with the decisions visible while it plays."
publish = false

[dependencies]
# The ONLY brain dependency a sample may have is the SDK facade, and it must
# NAME the surfaces it uses - see samples/README.md rules 1 and 2.
#   decision  ControlPipeline / Env: the policy and its training loop
#   viewport  the window, the in-frame inspector UI, and writing it to a PNG
#
# Not `image`: the PNG comes out of `viewport`, and naming the image surface
# to get an encoder would link the whole diffusion stack for it.
brain = { workspace = true, features = ["decision", "viewport"] }
# The game speaks JSON over a socket. Everything else here is std: the HTTP
# client is ~60 lines against one keep-alive connection, which is less than
# the configuration an HTTP crate would need.
serde = { workspace = true }
serde_json = { workspace = true }
# Only for PR_SET_PDEATHSIG: the kernel has to reap the engine when a training
# run is killed, and a Rust destructor cannot run on SIGKILL.
[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }

[package.metadata.brain]
# `make check/samples` fails if the real `cargo tree` closure exceeds this.
# 33 -> 34: the "decision" surface's dependency closure grew by exactly one
# crate (brain-rlcd, a new leaf under brain-decide with no transitive
# dependency of its own beyond brain-data, which brain-decide already
# pulled) when RLCD's calibrated-decision objective moved out of
# brain-decide into its own reusable crate.
# 34 -> 36: the measured closure was already 35 against this 34 - a drift
# that had never been reconciled - and `doom gate` adds brain-promote, which
# is the 36th. The promote/reject decision is a leaf in the training-
# substrate layer (a paired sign test and four bars over already-scored
# episodes) and a sample that trains itself in a loop needs one, because a
# loop with no gate adopts a worse generation exactly as readily as a better
# one. brain-promote's own dependencies were all in the closure already.
max-brain-crates = 36
