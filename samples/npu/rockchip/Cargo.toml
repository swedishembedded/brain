[package]
name = "sample-npu-rockchip"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sample application: real-time object detection on a Rockchip RV1103/RV1106 board through brain's DetectionPipeline on the NPU, streamed over RTSP."
publish = false

[dependencies]
# The only brain dependency: the SDK facade, naming the one surface it uses.
brain = { workspace = true, features = ["vision"] }
# Signals, clock_gettime and poll for the camera/RTSP pipeline.
libc = { workspace = true }

[package.metadata.brain]
# `make check/samples` fails if the real `cargo tree` closure exceeds this.
# 37 -> 39: the vision surface now carries YOLOv5 and brain's NPU compiler.
max-brain-crates = 39
