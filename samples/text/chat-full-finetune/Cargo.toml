[package]
# Package names under samples/ are derived from the path:
# `samples/text/chat-full-finetune` -> `sample-text-chat-full-finetune`. The
# Makefile's `samples/%/{build,run}` rules depend on that mapping;
# `make check/samples` enforces it.
name = "sample-text-chat-full-finetune"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sample application: full-parameter fine-tuning of a chat model on a chat dataset with brain::ChatFullFineTune, reporting the run's losses, footprint and checkpoint."
publish = false

[dependencies]
# The ONLY brain dependency a sample may have is the SDK facade, and it must
# NAME the surfaces it uses - see samples/README.md rules 1 and 2.
brain = { workspace = true, features = ["text", "study"] }

[package.metadata.brain]
# `make check/samples` fails if the real `cargo tree` closure exceeds this.
# `study` links the trainer of every chat-trainable architecture (qwen3,
# qwen35, qwen35moe, ...) beside the `text` stack.
max-brain-crates = 56
