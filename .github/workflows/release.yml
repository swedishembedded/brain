#
# Builds the `brain` executable for every supported system from a release
# tag and publishes them as the tag's GitHub release, with the tag's own
# CHANGELOG section as its notes. Two ways in, both ending in the same jobs:
#
#   * a pushed tag v<version> (`make release/publish` pushes main and the tag):
#     the CI gates run again on the tagged commit;
#   * a green CI run on a push to main whose workspace version has no tag yet
#     (the commit `make release/{patch,minor,major}` made): CI is already green
#     for that exact commit, so the release builds it and creates the tag
#     itself. A green main whose version is already released does nothing.
#
# No release build runs on a developer's machine.
#
#   Linux   x86_64, aarch64   brain-linux-<arch>, brain-gpu-worker-linux-<arch>,
#                             brain-linux-<arch>.deb (both programs)
#   macOS   universal         brain-darwin-universal (x86_64 + Apple silicon)
#   Windows x86_64            brain-windows-x86_64.exe
#
# Every platform is required: a release missing one is not published. So is
# every gate a hosted runner can run: the static and CPU gates of ci.yml on the
# tagged commit and a dependency audit. Every job runs on GitHub's hosted
# runners; the accelerated parity tier needs GPUs, so the maintainer runs it
# (`make ci/gpu`, part of `make test/full`) before tagging. The release
# carries a CycloneDX SBOM and a build provenance attestation for every
# binary. Linux builds link glibc, not musl: brain loads the GPU driver (Vulkan) at run
# time, which a static musl binary cannot. `brain-gpu-worker` is the
# supervised device worker `brain serve` probes a quarantined card in; it is
# found beside `brain` under that exact name, and is Linux-only (it relies on
# process groups and a parent-death signal).
name: Release
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && (github.event.inputs.dry_run == 'true'
          && format('Release dry-run ({0})', github.ref_name)
          || format('Release manual ({0})', github.ref_name))
      || format('Release {0}', github.ref_name) }}

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: >
          When true, builds every platform but does not create a GitHub
          Release. Turn off only if you intend to publish from this ref.
        type: boolean
        default: true

# Read-only for every job: only `publish`, which creates the release, may
# write. Third-party actions are pinned to commits.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # What is being released, and whether anything is. A tag push and a manual
  # run always release; a CI run on main releases only when that CI run
  # succeeded for a push (not a pull request) of this repository and the
  # workspace version has no tag yet. `sha` is the commit every job builds:
  # the one CI tested, not whatever main has moved on to since.
  plan:
    name: Plan the release
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CI_EVENT: ${{ github.event.workflow_run.event }}
          CI_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          THIS_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          [ -n "$version" ] || { echo "no workspace version in Cargo.toml" >&2; exit 1; }
          release=true
          tag="v$version"
          case "$EVENT" in
            push) tag="$REF_NAME" ;;
            workflow_run)
              if [ "$CI_CONCLUSION" != success ] || [ "$CI_EVENT" != push ] || [ "$CI_REPO" != "$THIS_REPO" ]; then
                release=false
                echo "CI did not succeed for a push to this repository: nothing to release."
              elif git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
                release=false
                echo "$tag is already released: nothing to release."
              fi ;;
          esac
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "event=$EVENT release=$release tag=$tag sha=$(git rev-parse HEAD)"

  # ── Gates: nothing is published unless these pass on the tagged commit ──────
  # A release started by a green CI run on main skips them: CI just passed for that commit.
  gates:
    name: CI gates (static, clippy, CPU)
    needs: plan
    if: ${{ needs.plan.outputs.release == 'true' && github.event_name != 'workflow_run' }}
    uses: ./.github/workflows/ci.yml

  # Known-vulnerable or yanked dependencies and unexpected sources (deny.toml).
  audit:
    name: Dependency audit
    needs: plan
    if: ${{ needs.plan.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: audit
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2
      - run: cargo deny --locked check advisories sources

  # The software bill of materials of the `brain` executable, from the lockfile's resolved graph.
  sbom:
    name: SBOM (CycloneDX)
    needs: plan
    if: ${{ needs.plan.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: sbom
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked --version 0.5.7
      - name: Generate
        run: |
          cargo cyclonedx --manifest-path crates/cli/Cargo.toml --format json --override-filename brain.cdx
          mkdir -p sbom
          mv crates/cli/brain.cdx.json sbom/brain.cdx.json
          test -s sbom/brain.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom/

  # ── Linux: x86_64 and aarch64, each on its own architecture's runner ────────
  build-linux:
    name: Linux ${{ matrix.arch }}
    needs: plan
    if: ${{ needs.plan.outputs.release == 'true' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            deb_arch: amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            deb_arch: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: release-linux-${{ matrix.arch }}

      # mold: .cargo/config.toml links x86_64 Linux builds with it.
      - name: Install the build dependencies (cmake for libopus, mold, dpkg-dev for the package)
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends cmake mold dpkg-dev

      - name: Release build
        run: cargo build --release --locked -p brain-cli -p brain-gpu-worker

      - name: It runs
        run: target/release/brain --version

      - name: Debian package
        run: bash scripts/build/build-deb.sh --binary target/release/brain --worker target/release/brain-gpu-worker --arch ${{ matrix.deb_arch }} --out-dir target/debian

      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp target/release/brain dist/brain-linux-${{ matrix.arch }}
          cp target/release/brain-gpu-worker dist/brain-gpu-worker-linux-${{ matrix.arch }}
          cp target/debian/brain_*_${{ matrix.deb_arch }}.deb dist/brain-linux-${{ matrix.arch }}.deb

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/

  # ── macOS: one universal binary, Intel and Apple silicon ────────────────────
  build-macos:
    name: macOS (universal)
    needs: plan
    if: ${{ needs.plan.outputs.release == 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: release-macos

      - name: Install cmake (libopus)
        run: command -v cmake || brew install cmake

      - name: Build x86_64
        run: cargo build --release --locked -p brain-cli --target x86_64-apple-darwin

      - name: Build aarch64
        run: cargo build --release --locked -p brain-cli --target aarch64-apple-darwin

      - name: Create the universal binary
        run: |
          mkdir -p dist
          lipo -create \
            target/x86_64-apple-darwin/release/brain \
            target/aarch64-apple-darwin/release/brain \
            -output dist/brain-darwin-universal
          lipo -info dist/brain-darwin-universal
          dist/brain-darwin-universal --version

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos
          path: dist/

  # ── Windows x86_64 ──────────────────────────────────────────────────────────
  build-windows:
    name: Windows x86_64
    needs: plan
    if: ${{ needs.plan.outputs.release == 'true' }}
    runs-on: windows-latest
    steps:
      # Some .agents/knowledge file names put the checkout path past Windows'
      # 260-character limit; without long paths the checkout itself fails.
      - name: Allow long paths
        run: git config --system core.longpaths true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: release-windows

      - name: Release build
        run: cargo build --release --locked -p brain-cli

      - name: It runs
        run: target\release\brain.exe --version

      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/brain.exe dist/brain-windows-x86_64.exe

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: dist/

  # ── GitHub Release ──────────────────────────────────────────────────────────
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [plan, gates, audit, sbom, build-linux, build-macos, build-windows]
    # `gates` is skipped, not green, when CI had already passed on main.
    if: ${{ !cancelled() && needs.plan.outputs.release == 'true' && (needs.gates.result == 'success' || needs.gates.result == 'skipped') && needs.audit.result == 'success' && needs.sbom.result == 'success' && needs.build-linux.result == 'success' && needs.build-macos.result == 'success' && needs.build-windows.result == 'success' }}
    permissions:
      contents: write
      id-token: write # the provenance attestation is signed with the run's OIDC identity
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - name: Download every platform's artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Download the SBOM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sbom
          path: dist

      - name: Checksums
        run: |
          cd dist
          sha256sum brain-* brain.cdx.json > checksums.txt
          cat checksums.txt

      # Pinned by version tag: the commit behind the tag could not be looked up where this was written;
      # replace it with the commit, as the actions above, when it is.
      - name: Attest build provenance
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true') }}
        uses: actions/attest-build-provenance@v2.4.0
        with:
          subject-path: |
            dist/brain-*
            dist/brain.cdx.json

      - name: Release notes (the tag's CHANGELOG section)
        run: make release/notes

      - name: Dry run - skip GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
        run: |
          ls -lh dist/
          echo "Dry run: every platform built; no release created."

      - name: Create GitHub Release
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true') }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          # Creates the tag on the tested commit when the release started from main.
          tag_name: ${{ needs.plan.outputs.tag }}
          target_commitish: ${{ needs.plan.outputs.sha }}
          body_path: target/release-notes-${{ needs.plan.outputs.tag }}.md
          fail_on_unmatched_files: true
