#
# Builds the `brain` executable for every supported system from a release
# tag and publishes them as the tag's GitHub release, with the tag's own
# CHANGELOG section as its notes. Started by `make release/publish`, which
# only pushes main and the tag: no release build runs on a developer's
# machine.
#
#   Linux   x86_64, aarch64   brain-linux-<arch>, brain-gpu-worker-linux-<arch>,
#                             brain-linux-<arch>.deb (both programs)
#   macOS   universal         brain-darwin-universal (x86_64 + Apple silicon)
#   Windows x86_64            brain-windows-x86_64.exe
#
# Every platform is required: a release missing one is not published. So is
# every gate: the static and CPU gates of ci.yml on the tagged commit, the
# accelerated parity tier on a self-hosted runner labelled `gpu`, and a
# dependency audit. A release with no such runner online waits; it is not
# published without the accelerated tier. The release carries a CycloneDX
# SBOM and a build provenance attestation for every binary. Linux
# builds link glibc, not musl: brain loads the GPU driver (Vulkan) at run
# time, which a static musl binary cannot. `brain-gpu-worker` is the
# supervised device worker `brain serve` probes a quarantined card in; it is
# found beside `brain` under that exact name, and is Linux-only (it relies on
# process groups and a parent-death signal).
name: Release
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && (github.event.inputs.dry_run == 'true'
          && format('Release dry-run ({0})', github.ref_name)
          || format('Release manual ({0})', github.ref_name))
      || format('Release {0}', github.ref_name) }}

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: >
          When true, builds every platform but does not create a GitHub
          Release. Turn off only if you intend to publish from this ref.
        type: boolean
        default: true

# Read-only for every job: only `publish`, which creates the release, may
# write. Third-party actions are pinned to commits.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # ── Gates: nothing is published unless these pass on the tagged commit ──────
  gates:
    name: CI gates (static, clippy, CPU)
    uses: ./.github/workflows/ci.yml

  # Tier 3, accelerated correctness: CPU == Vulkan == CUDA on the machine's own devices.
  gpu-parity:
    name: Accelerated parity (self-hosted GPU)
    runs-on: [self-hosted, gpu]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Parity on every device
        run: make ci/gpu/parity
      - name: Matrix
        if: always()
        run: make ci/matrix CI_REQUIRED=ci-gpu-parity SUMMARY="$GITHUB_STEP_SUMMARY"

  # Known-vulnerable or yanked dependencies and unexpected sources (deny.toml).
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: audit
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2
      - run: cargo deny --locked check advisories sources

  # The software bill of materials of the `brain` executable, from the lockfile's resolved graph.
  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: sbom
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked --version 0.5.7
      - name: Generate
        run: |
          cargo cyclonedx --manifest-path crates/cli/Cargo.toml --format json --override-filename brain.cdx
          mkdir -p sbom
          mv crates/cli/brain.cdx.json sbom/brain.cdx.json
          test -s sbom/brain.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom/

  # ── Linux: x86_64 and aarch64, each on its own architecture's runner ────────
  build-linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            deb_arch: amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            deb_arch: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: release-linux-${{ matrix.arch }}

      # mold: .cargo/config.toml links x86_64 Linux builds with it.
      - name: Install the build dependencies (cmake for libopus, mold, dpkg-dev for the package)
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends cmake mold dpkg-dev

      - name: Release build
        run: cargo build --release --locked -p brain-cli -p brain-gpu-worker

      - name: It runs
        run: target/release/brain --version

      - name: Debian package
        run: bash scripts/build/build-deb.sh --binary target/release/brain --worker target/release/brain-gpu-worker --arch ${{ matrix.deb_arch }} --out-dir target/debian

      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp target/release/brain dist/brain-linux-${{ matrix.arch }}
          cp target/release/brain-gpu-worker dist/brain-gpu-worker-linux-${{ matrix.arch }}
          cp target/debian/brain_*_${{ matrix.deb_arch }}.deb dist/brain-linux-${{ matrix.arch }}.deb

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/

  # ── macOS: one universal binary, Intel and Apple silicon ────────────────────
  build-macos:
    name: macOS (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: release-macos

      - name: Install cmake (libopus)
        run: command -v cmake || brew install cmake

      - name: Build x86_64
        run: cargo build --release --locked -p brain-cli --target x86_64-apple-darwin

      - name: Build aarch64
        run: cargo build --release --locked -p brain-cli --target aarch64-apple-darwin

      - name: Create the universal binary
        run: |
          mkdir -p dist
          lipo -create \
            target/x86_64-apple-darwin/release/brain \
            target/aarch64-apple-darwin/release/brain \
            -output dist/brain-darwin-universal
          lipo -info dist/brain-darwin-universal
          dist/brain-darwin-universal --version

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos
          path: dist/

  # ── Windows x86_64 ──────────────────────────────────────────────────────────
  build-windows:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      # Some .agents/knowledge file names put the checkout path past Windows'
      # 260-character limit; without long paths the checkout itself fails.
      - name: Allow long paths
        run: git config --system core.longpaths true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: release-windows

      - name: Release build
        run: cargo build --release --locked -p brain-cli

      - name: It runs
        run: target\release\brain.exe --version

      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/brain.exe dist/brain-windows-x86_64.exe

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: dist/

  # ── GitHub Release ──────────────────────────────────────────────────────────
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [gates, gpu-parity, audit, sbom, build-linux, build-macos, build-windows]
    permissions:
      contents: write
      id-token: write # the provenance attestation is signed with the run's OIDC identity
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download every platform's artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Download the SBOM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sbom
          path: dist

      - name: Checksums
        run: |
          cd dist
          sha256sum brain-* brain.cdx.json > checksums.txt
          cat checksums.txt

      # Pinned by version tag: the commit behind the tag could not be looked up where this was written;
      # replace it with the commit, as the actions above, when it is.
      - name: Attest build provenance
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true') }}
        uses: actions/attest-build-provenance@v2.4.0
        with:
          subject-path: |
            dist/brain-*
            dist/brain.cdx.json

      - name: Release notes (the tag's CHANGELOG section)
        run: make release/notes

      - name: Dry run - skip GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
        run: |
          ls -lh dist/
          echo "Dry run: every platform built; no release created."

      - name: Create GitHub Release
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true') }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          body_path: target/release-notes-${{ github.ref_name }}.md
          fail_on_unmatched_files: true
