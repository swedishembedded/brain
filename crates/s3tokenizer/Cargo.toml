[package]
name = "brain-s3tokenizer"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "S3Tokenizer: the FSQ (finite scalar quantization) supervised-semantic speech tokenizer CosyVoice conditions on (v2: SenseVoice-Large encoder, v3: MinMo encoder, both 6561-entry codebooks)."

[lib]
name = "s3tokenizer"
path = "src/lib.rs"

[dependencies]
# Pure host math (`AGENTS.md`): the encoder runs once per reference clip at a
# few hundred frames, so a device round trip buys nothing to parallelise
# across, and exact-integer FSQ parity is easiest to hold when the whole
# forward is one deterministic f32 code path (see `model` module doc).
brain-audio.workspace = true
brain-model.workspace = true
brain-onnx.workspace = true

[dev-dependencies]
brain-testutil.workspace = true
