[package]
name = "brain-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Brain runtime: event-driven HSM controller wiring inference/detection models to the JSONL event protocol."

[lib]
name = "runtime"
path = "src/lib.rs"

[features]
# The real Qwen3-TTS `SynthModel` adapter (`runtime::tts::Qwen3TtsSynthModel`).
# OFF by default: `brain-qwen3tts` drags in the entire voice stack (the Mimi-style
# codec, the ECAPA speaker encoder, the Talker/MTP decoders and their tokenizer),
# and this crate's default build is deliberately the light one - the JSONL codec,
# the HSM engine and the two small model adapters. Same shape as `brain-cli`'s
# `vulkan-coopmat = ["dep:brain-vulkan"]`: one optional workspace dependency,
# named by the feature that turns it on, nothing else changed by enabling it.
qwen3tts = ["dep:brain-qwen3tts"]

[dependencies]
# Minimal deps: the JSONL codec, the generic HSM engine, the GPT model + its
# checkpoint loader. A real YOLO `DetectModel` adapter (brain-yolo) wires in
# later behind the object-safe trait; tests use `FakeDetectModel`.
brain-capability.workspace = true
brain-events.workspace = true
brain-hfsm.workspace = true
brain-gpt2.workspace = true
brain-yolov8.workspace = true
brain-checkpoint.workspace = true
brain-forecast.workspace = true
brain-fcbench.workspace = true
serde_json.workspace = true
# Opt-in only (feature `qwen3tts`) - see the [features] note above.
brain-qwen3tts = { workspace = true, optional = true }

[dev-dependencies]
# Integration tests drive the controller with a real tiny GPT, a real tiny YOLO,
# and the codec helpers (base64/PPM) for synthetic frames.
brain-gpt2.workspace = true
brain-yolov8.workspace = true
brain-capability.workspace = true
brain-events.workspace = true
