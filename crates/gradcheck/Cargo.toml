[package]
name = "brain-gradcheck"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Numerical (finite-difference) gradient checker - the backprop correctness gate, replacing the PyTorch oracle."

[lib]
name = "gradcheck"
path = "src/lib.rs"

[dependencies]
brain-model.workspace = true
brain-gpt2.workspace = true
brain-qwen3.workspace = true
# `check_qwen35moe` (src/lib.rs) - the Qwen3.5-35B-A3B hybrid GDN/GQA/MoE decoder.
brain-qwen35moe.workspace = true
# `check_qwen35` (src/lib.rs) - qwen35moe's dense sibling (same hybrid GDN/GQA
# mixers, no MoE).
brain-qwen35.workspace = true
brain-lfm2.workspace = true
brain-glmdsa.workspace = true
brain-toymoe.workspace = true
brain-toypid.workspace = true
brain-toyseq2seq.workspace = true
brain-toyautoencoder.workspace = true
brain-flux2.workspace = true
# `check_wan` / `check_wan_conditioning` (src/lib.rs) - the Wan video DiT's host
# training reference.
brain-wan.workspace = true
# `check_ltxv` / `check_ltxv_conditioning` (src/lib.rs) - the LTX-2.5
# video-only DiT's host training reference.
brain-ltxv.workspace = true
brain-sam2.workspace = true
brain-vqgan.workspace = true
brain-vae.workspace = true
# `check_unet` (src/unet.rs) - the SDXL UNet2DConditionModel training graph.
brain-sdxlunet.workspace = true
# `check_supir` / `check_supir_elementwise` (src/supir.rs) - the SUPIR control
# trunk + adaptors training graph.
brain-supir.workspace = true
brain-gpu-core.workspace = true
# `check_arcface` (src/arcface.rs) - the ArcFace/IResNet training graph.
brain-arcface.workspace = true
# `check_clip` (src/clip.rs) - the CLIP text-tower training graph.
brain-clip.workspace = true
# `check_t5` (src/t5.rs) - the T5 encoder training graph.
brain-t5encoder.workspace = true
# `check_codeformer` (src/restore.rs) - CodeFormer's code-prediction Transformer.
brain-codeformer.workspace = true
brain-data.workspace = true
# `check_deepseekocr_relpos` (src/deepseekocr.rs) - the SAM rel-pos kernels have
# no model crate yet, so this check registers their WGSL directly.
brain-kernels.workspace = true
# `check_vocoder` (src/minimaxmusic3.rs) - MiniMax Music 3's DAC-style vocoder.
brain-minimaxmusic3.workspace = true
# `check_cosyvoice_lm_block` / `check_cosyvoice_lm` (src/lib.rs) - CosyVoice's
# Qwen2-style speech-token LM host training reference.
brain-cosyvoice.workspace = true

[dev-dependencies]
brain-testutil.workspace = true
