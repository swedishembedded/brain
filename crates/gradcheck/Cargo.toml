[package]
name = "brain-gradcheck"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Numerical (finite-difference) gradient checker — the backprop correctness gate, replacing the PyTorch oracle."

[lib]
name = "gradcheck"
path = "src/lib.rs"

[dependencies]
brain-model.workspace = true
brain-gpt.workspace = true
brain-qwen3.workspace = true
# `check_qwen35` (src/lib.rs) — the Qwen3.5-35B-A3B hybrid GDN/GQA/MoE decoder.
brain-qwen35moe.workspace = true
brain-lfm.workspace = true
brain-glm.workspace = true
brain-moe.workspace = true
brain-pid.workspace = true
brain-seq2seq.workspace = true
brain-autoencoder.workspace = true
brain-flux2.workspace = true
brain-sam2.workspace = true
brain-vqgan.workspace = true
brain-vae.workspace = true
brain-gpu-core.workspace = true
# `check_arcface` (src/facenet.rs) — the ArcFace/IResNet training graph.
brain-facenet.workspace = true
# `check_clip` (src/clip.rs) — the CLIP text-tower training graph.
brain-clip.workspace = true
# `check_t5` (src/t5.rs) — the T5 encoder training graph.
brain-t5.workspace = true
# `check_codeformer` (src/restore.rs) — CodeFormer's code-prediction Transformer.
brain-restore.workspace = true
brain-data.workspace = true

[dev-dependencies]
brain-kernels.workspace = true
