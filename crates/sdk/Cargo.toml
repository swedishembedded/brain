[package]
# `brain` (never `brain-sdk`) is a DELIBERATE, SOLE exception to this
# workspace's `brain-<short>` package-naming convention: this crate is the
# public embeddable SDK facade, and `use brain::ImagePipeline;` is the whole
# point of it -- see this crate's own `src/lib.rs` module doc. The name was
# free to take: the `brain` CLI binary is produced by the `brain-cli`
# package, not by any library crate.
name = "brain"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The public brain SDK: a small, stable, embeddable facade (ImagePipeline and friends) over brain's model backends, with no CLI binary and no capability-dispatch machinery in the loop."

[lib]
name = "brain"
path = "src/lib.rs"

[features]
# The SDK is this workspace's feature vocabulary: a consumer names the
# SURFACES it uses and gets their dependencies and nothing else. Features
# SELECT code; they never carry a value and never change behaviour (see
# samples/README.md). Value-like configuration is a builder argument.
#
# `default = ["full"]` so `cargo add brain` just works, and so `cargo test -p
# brain` keeps running every surface's tests -- a `default = []` here would
# silently stop testing `pipeline.rs`, which is the audit-F37 failure mode the
# workspace's own `default-members` comment was written about. The WORKSPACE
# baseline (`Cargo.toml`'s `brain = { default-features = false }`) is what
# makes a consumer name its surfaces explicitly.
default = ["full"]
# `viewport` is in here despite being a tier rather than a surface, for the
# reason the comment above gives: `cargo test -p brain` runs whatever `full`
# selects, and a feature nobody builds is a feature whose tests never run.
full = ["image", "creature", "forecast", "text", "vision", "audio", "decision", "study", "video", "viewport"]

# --- presentation tier, not a surface. `brain::viewport`: a window and an RGB8
#     canvas with the drawing an instrument panel needs, or the same canvas with
#     no window on a machine that has no display. It is a TIER rather than a
#     surface because it is not a `brain_arch::Domain` - nothing here is a model
#     - and it is separate from any surface because showing a system's state is
#     orthogonal to which model produced it. Samples may name it; the `brain`
#     CLI does not select it and does not link it.
viewport = ["dep:brain-viewport"]

# --- surfaces: one per brain_arch::Domain the SDK has a public type for.
#     A surface is the only thing a consumer names.
# `brain::ImagePipeline` (flux2/s3dit text-to-image), `brain::
# UpscalePipeline` (RRDBNet super-resolution) and `brain::RestorePipeline`
# (CodeFormer face restoration) - three public types under one feature, since
# all three architectures are registered `Domain::Image` and all three
# return `brain::Image`. Generation, upscaling and restoration are different
# capabilities ("one pipeline type per capability"), not backends of one
# pipeline.
image = ["resolve", "imagetype", "dep:brain-flux2", "dep:brain-s3dit", "dep:brain-rrdbnet", "dep:brain-codeformer"]
# `brain::ForecastPipeline`. Covers kronos and timesfm3 - the two forecasting
# architectures with a real model-store `ArchSpec` today
# (`kronos::spec::KronosSpec`, `timesfm3::spec::Timesfm3Spec`); chronos2 and
# fincast have neither a `default_ref` nor any resolver wiring registered
# anywhere yet, so they are a tracked gap, not silently unsupported.
forecast = ["resolve", "dep:brain-forecast", "dep:brain-kronos", "dep:brain-timesfm3"]
# `brain::Creature`, `brain::View` -- a connectome running a body, and a window
# onto it. Selects `device` for the GPU the spiking network runs on. It does
# NOT select `resolve`: a connectome is a published scientific dataset, not a
# `<vendor>/<repo>` checkpoint, so it is loaded from a path rather than through
# the model store. When that changes this feature gains `resolve`, not a
# parallel resolver.
creature = ["device", "dep:brain-fly", "dep:brain-connectome", "dep:brain-flybody", "dep:brain-mujoco", "dep:brain-neuro", "dep:brain-wm-display", "dep:tempfile"]
# `brain::TextGenerationPipeline`. Covers qwen3 only, and from a literal local
# checkpoint path, not a `<vendor>/<repo>` hub id: `crates/qwen3` has no
# model-store `ArchSpec` at all yet (unlike kronos/timesfm3 above), so there
# is nothing for a resolver to resolve a hub id against - the same reason
# `creature` selects no resolver. Selects `device` only, not `resolve` - no
# loader/model-store dependency belongs here until an `ArchSpec` exists to
# use it.
text = ["device", "dep:brain-qwen3", "dep:brain-data", "dep:brain-checkpoint", "dep:serde_json"]
# `brain::EmbeddingPipeline` (CLIP text embedding), `brain::
# DetectionPipeline` (YOLOv8 object detection) and `brain::SegmentPipeline`
# (SAM 2.1 promptable segmentation) - three public types under one feature.
# Named `vision`, not `embedding`/`detection`/`segmentation` -
# `brain_arch::Domain` has no variant for any of those (CLIP's own `arch!`
# row is registered `Vision` since the same released checkpoint also holds
# an image tower; YOLOv8's and SAM2's are `Vision` too), and this
# workspace's rule is that a surface name is a `Domain` variant, full stop -
# inventing a second word for the same modality is exactly what that rule
# exists to prevent. `brain::DepthPipeline` (ZipDepth monocular depth) joins
# this SAME feature for the same reason, rather than getting its own.
vision = ["resolve", "imagetype", "dep:brain-clip", "dep:brain-yolov8", "dep:brain-sam2", "dep:brain-zipdepth"]
# `brain::DecisionPipeline`. Selects `device` only, not `resolve`: like `text`,
# this architecture has no model-store `ArchSpec`, so there is nothing for a
# resolver to resolve a hub id against - and a decision model is two artifacts
# (an imported encoder, a trained head) where a hub id names only the first.
decision = ["device", "dep:brain-decide", "dep:brain-data", "dep:brain-checkpoint"]
# `brain::DocumentStudy` - teach a model a batch of documents and gate whether
# it learned them. Architecture-agnostic machinery (`brain-rl` is generic over
# `model::Model`), so the decoder crates it monomorphises for come with it.
study = ["device", "dep:brain-rl", "dep:brain-data", "dep:brain-checkpoint", "dep:brain-model", "dep:brain-loader", "dep:brain-qwen3", "dep:brain-qwen35", "dep:brain-qwen35moe", "dep:serde_json", "dep:serde"]
# `brain::TranscribePipeline` (qwen3-asr, offline, fixed window; nemotronasr's
# streaming path needs a genuinely different call shape, a tracked future
# extension, not folded in here) and `brain::TtsPipeline` (Qwen3-TTS
# speak/clone_voice/design - one capability, three voice-selection call
# shapes, not three pipeline types). `dep:brain-data` is qwen3tts's own
# `data::rng::random_seed` for an unset seed, the same "explicit unset stays
# unset, resolved from the checkpoint" contract `qwen3tts::caps::
# gen_opts_from` already established for the wire path.
audio = ["resolve", "dep:brain-qwen3asr", "dep:brain-audio", "dep:brain-qwen3tts", "dep:brain-data"]
# `brain::VideoPipeline` (Wan2.1 text-to-video). Selects `imagetype` for
# `imaging::video`'s encode helper `Video::save` writes through - the same
# "cheap to select twice" reasoning `vision` already uses for `Image`.
# `dep:brain-data` is wan's own `data::rng::random_seed` for an unset seed,
# the same contract `audio` above already needs it for. ltxv (this bucket's
# other served architecture) is a tracked future extension, not folded in
# here - see the roadmap for why.
video = ["resolve", "imagetype", "dep:brain-wan", "dep:brain-data"]

# --- infrastructure: selected BY a surface, never named by a consumer.
# `brain::Device`.
device = ["dep:brain-gpu-core"]
# Model-store resolution + `brain::DType`.
resolve = ["device", "dep:brain-loader", "dep:brain-model"]
# `brain::Image`, the pixel-in/pixel-out domain type. Split out from `image`
# (which also carries flux2/s3dit/rrdbnet/codeformer, the actual generation
# backends) because `vision`'s detection/segmentation/depth pipelines all
# take or return an `Image` too but must not drag in a text-to-image engine
# to do it -- `image.rs` itself depends on nothing but `brain-imaging`, so
# this is genuinely cheap to select twice. A real gap this milestone found
# and fixed: `vision` alone (`--no-default-features --features vision`) has
# never actually compiled standalone since `DetectionPipeline`/
# `SegmentPipeline` were added (Phase 3.1/3.2) -- `check-sdk-features.sh`'s
# own per-surface compile sweep would have caught it, but every verification
# pass since used `--features vision` WITHOUT `--no-default-features`, which
# `default = ["full"]` silently backfills with `image` anyway.
imagetype = ["dep:brain-imaging"]

[dependencies]
# Unconditional: `Error` is one shape in every configuration. It carries the
# resolver's own structured `Ambiguity`/`Missing` and converts `PlanError`, so
# capability/modelref/modelstore are core, not a surface. An error enum that
# changed shape with a feature would be exactly the behaviour-by-feature this
# design forbids.
brain-capability.workspace = true
brain-arch.workspace = true
brain-modelref.workspace = true
brain-modelstore.workspace = true
brain-audio = { workspace = true, optional = true }
brain-checkpoint = { workspace = true, optional = true }
brain-clip = { workspace = true, optional = true }
brain-codeformer = { workspace = true, optional = true }
brain-connectome = { workspace = true, optional = true }
brain-data = { workspace = true, optional = true }
brain-decide = { workspace = true, optional = true }
brain-fly = { workspace = true, optional = true }
brain-flybody = { workspace = true, optional = true }
brain-flux2 = { workspace = true, optional = true }
brain-forecast = { workspace = true, optional = true }
brain-gpu-core = { workspace = true, optional = true }
brain-imaging = { workspace = true, optional = true }
brain-kronos = { workspace = true, optional = true }
brain-loader = { workspace = true, optional = true }
brain-model = { workspace = true, optional = true }
brain-mujoco = { workspace = true, optional = true }
brain-neuro = { workspace = true, optional = true }
brain-qwen3 = { workspace = true, optional = true }
brain-qwen35 = { workspace = true, optional = true }
brain-qwen35moe = { workspace = true, optional = true }
brain-rl = { workspace = true, optional = true }
brain-qwen3asr = { workspace = true, optional = true }
brain-qwen3tts = { workspace = true, optional = true }
brain-rrdbnet = { workspace = true, optional = true }
brain-sam2 = { workspace = true, optional = true }
brain-timesfm3 = { workspace = true, optional = true }
brain-s3dit = { workspace = true, optional = true }
brain-wan = { workspace = true, optional = true }
brain-wm-display = { workspace = true, optional = true }
brain-viewport = { workspace = true, optional = true }
# Not optional: the option grammar is the one thing every consumer of this
# crate has, whichever surfaces it names.
brain-appopts.workspace = true
brain-yolov8 = { workspace = true, optional = true }
brain-zipdepth = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }

[dev-dependencies]
brain-checkpoint.workspace = true
brain-testutil.workspace = true
serde_json.workspace = true
