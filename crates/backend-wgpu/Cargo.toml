[package]
name = "brain-backend-wgpu"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "wgpu (Vulkan/Metal/DX12/GL/WebGPU) eager Backend implementation for brain."

[lib]
name = "backend_wgpu"
path = "src/lib.rs"

[dependencies]
brain-backend-api.workspace = true
bytemuck.workspace = true
# The `tracing` FACADE only - never a subscriber. `--trace-gpu <0-5>` (the
# `brain` CLI installs the one subscriber) turns these events on; with none
# installed every macro below is a predictable-branch no-op. Targets default
# to this crate's module path (`backend_wgpu`), which is what labels each
# line with the component it came from.
tracing.workspace = true

# Native GPU stack: full wgpu (desktop backends) + a blocking executor. `ash`
# (same 0.38 as wgpu-hal's) is for the `Adapter::as_hal` identity queries —
# PCI bus id / deviceUUID off the raw Vulkan physical device, which
# `wgpu::AdapterInfo` does not expose.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu.workspace = true
pollster.workspace = true
ash.workspace = true
# `flock(2)` for `cross_process_gpu_lock` - the cross-PROCESS half of
# `init_lock`'s device create/destroy serialisation (see that function's doc).
libc.workspace = true

# Browser GPU stack: wgpu's WebGPU backend only, plus async-readback glue.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "29", default-features = false, features = ["webgpu", "wgsl"] }
futures-channel = "0.3"
web-sys = { version = "0.3", features = ["console"] }

[dev-dependencies]
brain-testutil.workspace = true
brain-kernels.workspace = true
# B11 native-f16 tests: an independent host reference for the correctness
# check (`half::f16`) and a real compile attempt against the CPU JIT's own
# `Ty` lattice, to CONFIRM (not assume) it has no f16 lowering. Test-only -
# `wgsl-cpu` has no dependency back on this crate, so this is a leaf edge,
# not a cycle.
half.workspace = true
brain-wgsl-cpu.workspace = true
# B11: proves `NumericSupport.f16` never entangles across backends (CPU stays
# `false` regardless of what this backend measures) - test-only, no
# dependency back onto this crate.
brain-backend-cpu.workspace = true
