[package]
name = "brain-cosyvoice"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CosyVoice 2 / CosyVoice 3 (FunAudioLLM): LLM-based streaming zero-shot TTS - Qwen2.5-0.5B speech-token LM, causal flow-matching mel decoder (UNet for CV2, DiT for CV3), and an ISTFT/NSF-source-filter HiFT vocoder."

[lib]
name = "cosyvoice"
path = "src/lib.rs"

[dependencies]
