[package]
name = "brain-audit"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The model-free core of a continual reader: the episode stream it reads, the probe bank it freezes, the bounded retention audit it runs against that bank, and the ledger it writes down. A LEAF crate by design - its whole closure is brain-data and below, so the model-driven loop in brain-rl can drive it without any model crate appearing in its dependencies."

[lib]
name = "audit"
path = "src/lib.rs"

[dependencies]
# `data::rng::Rng` - the workspace's one SplitMix64 generator. The document
# order this crate draws is seeded from it rather than from a fresh local
# copy, per that module's own rule.
brain-data.workspace = true
# `promote::document::normalize` - the ONE definition of how much latitude an
# exact match gets. The containment check here compares normalised text, and a
# second normaliser in this crate would be a second answer to that question
# that drifts from the gate's. `brain-promote` is itself a leaf, so depending
# on it keeps this crate's closure below the model layer; the layering gate
# permits leaf-on-leaf for exactly that reason.
brain-promote.workspace = true
# The T-A screen measures whether an episode compresses at all. Text that
# does not is text with no structure to learn, and catching it here costs no
# model time at all.
flate2.workspace = true
serde.workspace = true
serde_json.workspace = true
# Episode identity is a digest of the episode's own bytes.
sha2.workspace = true
# Named, `Display`-able variants for the stream's preconditions, matching
# `promote::document::DocumentError`'s established convention.
thiserror.workspace = true
