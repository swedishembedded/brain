[package]
name = "brain-s3dit"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Z-Image (Tongyi) text-to-image: the S³-DiT single-stream diffusion transformer, assembled from the shared dit/vae/diffusion crates + the Qwen3-4B encoder. Forward-first (inference); training (backward + Shardable + LoRA) builds on it."

[lib]
name = "s3dit"
path = "src/lib.rs"

[dependencies]
brain-gpu-core.workspace = true
brain-kernels.workspace = true
brain-checkpoint.workspace = true
# The model-store resolver: S3ditSpec's own ArchSpec impl (crate::spec)
# resolves the four weight roles from a scanned models directory instead of
# BRAIN_S3DIT_*.
brain-modelstore.workspace = true
brain-dit.workspace = true
brain-model.workspace = true
brain-paramstore.workspace = true
brain-capability.workspace = true
brain-qwen3.workspace = true
brain-vae.workspace = true
brain-diffusion.workspace = true
brain-data.workspace = true
brain-weightset.workspace = true
serde_json.workspace = true

[dev-dependencies]
brain-testutil.workspace = true
