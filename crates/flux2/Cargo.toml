[package]
name = "brain-flux2"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "FLUX.2 Klein (4B/9B) text-to-image + image-editing: MMDiT double/single-stream diffusion transformer over the FLUX.2 128-channel VAE latent with Qwen3 multi-layer text conditioning, assembled from the shared dit/vae/diffusion crates. Forward-first; training (backward + LoRA) builds on it."

[lib]
name = "flux2"
path = "src/lib.rs"

[dependencies]
brain-capability.workspace = true
brain-gpu-core.workspace = true
brain-kernels.workspace = true
brain-checkpoint.workspace = true
# `weights::DitWeights` requantizes rows in parallel through `par`, the
# workspace's only rayon seam.
brain-backend-cpu.workspace = true
brain-dit.workspace = true
brain-model.workspace = true
brain-vae.workspace = true
brain-qwen3.workspace = true
brain-data.workspace = true
brain-diffusion.workspace = true
# The workspace's one image front door (`imaging::{load, save_png}`) - what the
# `flux2_latent` latent laboratory reads its test images with and writes its
# decodes back through. Deliberately not a second PNG path: every other image
# read in this repo goes through this crate.
brain-imaging.workspace = true
serde_json.workspace = true
bytemuck.workspace = true

[dev-dependencies]
brain-testutil.workspace = true
