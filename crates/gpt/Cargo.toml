[package]
name = "brain-gpt"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Dense GPT decoder Transformer (nanogpt parity): forward + backprop in WGSL."

[lib]
name = "gpt"
path = "src/lib.rs"

[features]
cpu-backend = [
    "brain-gpu-core/cpu-backend",
    "brain-paramstore/cpu-backend",
    "brain-optim/cpu-backend",
]

[dependencies]
brain-gpu-core.workspace = true
brain-paramstore.workspace = true
brain-optim.workspace = true
brain-checkpoint.workspace = true
brain-kernels.workspace = true
brain-data.workspace = true
serde_json.workspace = true
bytemuck.workspace = true
wgpu = "29"
pollster = "0.4"
