[package]
name = "brain-qwen3vl"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Qwen3-VL: ViT vision encoder + PatchMerger + DeepStack over a spliced Qwen3 decoder (interleaved M-RoPE)."

[lib]
name = "qwen3vl"
path = "src/lib.rs"

[dependencies]
brain-qwen3.workspace = true
brain-model.workspace = true
brain-gpu-core.workspace = true
brain-kernels.workspace = true
brain-checkpoint.workspace = true
brain-capability.workspace = true
# `captioner::Captioner` - the model-agnostic captioning contract this crate
# satisfies. The contract crate has no model dependency; this direction is the
# only one, so any VLM can join the seam without the seam knowing about it.
brain-captioner.workspace = true
brain-data.workspace = true
brain-imaging.workspace = true
serde_json.workspace = true

[dev-dependencies]
brain-testutil.workspace = true
brain-checkpoint.workspace = true
