[package]
name = "brain-perf"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Performance benchmarking suite: how much correct work brain delivers per unit of hardware, memory, energy and time. Model-agnostic over the capability progress seam; one JSON artifact per run, comparable across models and hardware."

[lib]
name = "perf"
path = "src/lib.rs"

[dependencies]
brain-capability.workspace = true
brain-residency.workspace = true
brain-checkpoint.workspace = true
brain-data.workspace = true
brain-gpu-core.workspace = true
brain-qwen3.workspace = true
# The HTTP surface target (`HttpTarget`) drives the REAL `apiserve::router()`
# in-process via `tower::Service::oneshot` -- not a fresh dependency direction
# (`brain-apiserve` already stands only on `brain-residency`/`brain-capability`,
# never on `brain-perf`), just perf's first consumer of it.
brain-apiserve.workspace = true
axum.workspace = true
tower.workspace = true
tokio.workspace = true
futures.workspace = true
serde_json.workspace = true
