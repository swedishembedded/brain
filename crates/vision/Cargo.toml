[package]
name = "brain-vision"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared conv-net building blocks: NCHW shapes, the block-build context, and name-resolved kernel ids for every vision model (yolo, depth)."

[lib]
name = "vision"
path = "src/lib.rs"

[dependencies]
brain-gpu-core.workspace = true
brain-paramstore.workspace = true
# `model::block` ONLY, and only for the LayerNorm dispatch seam
# (`LayerNormIds` / `layernorm_fwd` / `ln_stats_fwd` / `layernorm_dx_bwd`), which
# is the single place in the workspace that chooses between the reference
# LayerNorm kernels and the coalesced `*_rows` twins. `LayerNorm2d` needs that
# choice; re-deriving it here would be a second selection site free to drift
# from `backend_api::select`. The blocks still do not implement `Model` and the
# trainer is not used. (This edge is not new in the dependency GRAPH: every
# crate that consumes `vision` — yolo, depth, mirror, fastvlm, cli — already
# depends on brain-model, and brain-npu pulls it in transitively via brain-qwen.)
brain-model.workspace = true
bytemuck.workspace = true

[dev-dependencies]
brain-kernels.workspace = true
# `data::rng::Lcg` — the one deterministic test PRNG (tests only).
brain-data.workspace = true
