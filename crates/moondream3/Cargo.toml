[package]
name = "brain-moondream3"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Moondream 3: SigLIP ViT + overlap multi-crop + a partial-RoPE/tau MoE decoder (parallel attn+MLP)."

[lib]
name = "moondream3"
path = "src/lib.rs"

[dependencies]
brain-qwen3.workspace = true
brain-model.workspace = true
# `imaging::tiling::moondream_select_tiling` - this model's crop-tile-count
# policy, hosted beside the other reference models' named policies rather than
# kept as a private copy here (see `crates/imaging/src/lib.rs`'s header).
brain-imaging.workspace = true
brain-gpu-core.workspace = true
brain-kernels.workspace = true
serde_json.workspace = true

[dev-dependencies]
brain-testutil.workspace = true
brain-data.workspace = true
brain-federated.workspace = true
brain-checkpoint.workspace = true
