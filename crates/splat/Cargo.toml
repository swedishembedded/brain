[package]
name = "brain-splat"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "3D Gaussian Splatting: PLY scene IO, generic device scan/radix-sort primitives, and the tiled fp32 WGSL rasterizer (forward + backward) shared by the mirror model demo and the standalone splat viewer."

[lib]
name = "splat"
path = "src/lib.rs"

[dependencies]
# `camera::{Intrinsics, Lens}` - the one lens model; the ray renderer images
# through it.
brain-camera.workspace = true
brain-gpu-core.workspace = true
brain-kernels.workspace = true
# `caps.rs` - the serving contract's capability surface.
brain-capability.workspace = true
serde_json.workspace = true
# `backend_cpu::par` - the workspace's one rayon seam, for the row-parallel
# SSIM window passes in `loss.rs`.
brain-backend-cpu.workspace = true

[dev-dependencies]
brain-camera.workspace = true
bytemuck.workspace = true
brain-imaging.workspace = true
# `data::rng::Lcg` - the one deterministic test PRNG (tests only).
brain-data.workspace = true
