[package]
name = "brain-ltxv"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LTX-2.5 two-stream audio+video diffusion transformer. This milestone: the causal 3D video VAE (encoder + conv decoder, crates/vae's blocks3d primitives), the video-only DiT stream (tiny-config parity), and the end-to-end t2v pipeline + serving contract (real VAE + tiny random-weight DiT + a stub text context, no real 22B DiT / Gemma-4 text encoder yet), built on brain-vae / brain-dit / brain-diffusion / brain-capability / brain-data / brain-checkpoint / brain-gpu-core / brain-kernels; the audio stack, A<->V cross-attention, real text encoder and NA diffusion decoder land in later milestones."

[lib]
name = "ltxv"
path = "src/lib.rs"

[dependencies]
# `backend_cpu::par::rows_mut` - the workspace's ONLY rayon seam. `dit.rs::linear`
# (the host GEMM behind `ada_layer_norm_single`/`output_stage`/patchify) is
# GFLOP-scale at real-checkpoint width (`ada_layer_norm_single`'s own table is
# `[t,4096]x[36864,4096]^T`) and must not run on one core - see `wan::model::
# linear`'s identical precedent, reused here rather than reimplemented.
brain-backend-cpu.workspace = true
brain-gpu-core.workspace = true
brain-kernels.workspace = true
brain-checkpoint.workspace = true
brain-vae.workspace = true
# `model::hostmath::matvec_par` (the f32 `grad::Fp` instantiation's hot
# matvec) and `model::lora::{Pair, LoraCfg, proj_step, randn}` (the shared
# host-side LoRA machinery `crate::lora` builds on, same as `wan::lora`).
brain-model.workspace = true
# `dit::adaln::add_table` (per-token adaLN table combine) and `dit::timestep::
# pixart_timestep_embed` (the PixArt sinusoid -> Linear -> SiLU -> Linear
# shape the AdaLayerNormSingle embedder shares with wan/s3dit).
brain-dit.workspace = true
# `LTX2Scheduler`'s sigma schedule + the rectified-flow ancestral Euler step
# (`crate::pipeline`'s denoise loop).
brain-diffusion.workspace = true
# The generalized capability interface (`crate::caps`) - manifest, actions,
# cancellation - per the serving contract every model ships.
brain-capability.workspace = true
# Seeded noise/weight-init RNG (`data::rng::Rng`), the same SplitMix64 +
# Box-Muller stream `wan::pipeline` uses, for reproducible `--seed` runs.
brain-data.workspace = true
serde_json.workspace = true
# Real image-conditioning input (`--image <path>`): decode + resize the
# conditioning still to the target resolution before it is encoded through
# the real video VAE. `png`/`jpeg` cover every format a real capture is
# likely to arrive in; no `pnm` (that's `brain-data`'s own synthetic-dataset
# concern, not a real photo's).
image = { workspace = true, features = ["jpeg", "png"] }
# The `tracing` FACADE only - never a subscriber. `--trace-ltxv <0-5>` (the
# `brain` CLI installs the one subscriber) turns these events on; with none
# installed every macro below is a predictable-branch no-op, so instrumenting
# a per-layer loop costs nothing on an untraced run. Targets default to this
# crate's module path (`ltxv::pipeline`, `ltxv::dit`), which is what labels
# each line with the component it came from.
tracing.workspace = true
# `audio::conv::{Conv1d, conv1d_fwd, convtr1d_fwd}` - the vocoder's 1D
# (transposed) conv `Step`-builders, reused rather than reimplemented.
brain-audio.workspace = true
# The real Gemma-4-12B text encoder (`crate::pipeline`'s real-checkpoint
# text-context path) - `Gemma4Model::forward` + `AggregateEmbed` + the
# checkpoint-embedded tokenizer, replacing `crate::pipeline::context_stub`
# when a real text-encoder checkpoint is configured.
brain-gemma4.workspace = true

[dev-dependencies]
brain-testutil.workspace = true
# `half::f16` - the independent from-spec Q8_0 dequant in
# `tests/gguf_quant_real.rs` decodes the GGUF block's f16 scale itself,
# deliberately not importing anything from `brain-checkpoint`'s own decode
# path (see that file's module doc).
half.workspace = true
