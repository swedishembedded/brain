[package]
name = "brain-vulkan"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Optional native-Vulkan (ash) execution path: VK_KHR_cooperative_matrix matmul with a naga-compiled WGSL scalar fallback."
build = "build.rs"

[lib]
name = "vulkan"
path = "src/lib.rs"

[dependencies]
brain-kernels.workspace = true
bytemuck.workspace = true
ash.workspace = true
naga.workspace = true
# The `tracing` FACADE only - never a subscriber. `--trace-gpu <0-5>` (the
# `brain` CLI installs the one subscriber) turns these events on; with none
# installed every macro below is a predictable-branch no-op. Targets default
# to this crate's module path (`vulkan`), which is what labels each line
# with the component it came from.
tracing.workspace = true

[dev-dependencies]
brain-testutil.workspace = true
