[package]
name = "brain-fly"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The composed animal: a connectome running as a spiking network, driving a MuJoCo body through its motor neurons, and reading that body back through its proprioceptors."

[lib]
name = "fly"
path = "src/lib.rs"

[dependencies]
brain-connectome.workspace = true
brain-flybody.workspace = true
brain-gpu-core.workspace = true
brain-mujoco.workspace = true
brain-neuro.workspace = true
# The sign test: 'it learned' has to be a statistic over matched pairs, and
# `promote` is a leaf crate carrying exactly that.
brain-promote.workspace = true

[dev-dependencies]
brain-testutil.workspace = true
# The flight model is GENERATED from the published walking one; it is written
# to a temp directory rather than next to a model that is not ours to modify.
tempfile.workspace = true
# The `watch` example's window. A dev-dependency, so the library itself still
# has no opinion about being looked at.
brain-wm-display.workspace = true
