[package]
name = "brain-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Browser (wasm32 + WebGPU) inference entry point for the PID transformer demo."

[lib]
name = "brain_web"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
# Browser WebGPU inference build. Enable with the wasm32 target:
#   cargo build --target wasm32-unknown-unknown -p brain-web --features webgpu
webgpu = ["dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:console_error_panic_hook"]

# Only meaningful on wasm32; on every other target this crate is empty.
[target.'cfg(target_arch = "wasm32")'.dependencies]
brain-gpu-core.workspace = true
brain-checkpoint.workspace = true
brain-optim.workspace = true
brain-paramstore.workspace = true
brain-toypid.workspace = true
serde_json.workspace = true
wgpu = { version = "29", default-features = false, features = ["webgpu", "wgsl"] }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
