[package]
name = "brain-diamond"
version.workspace = true
edition = "2021"
description = "DIAMOND EDM diffusion world model (Atari-100k): pre-recorded UNet graph, torch .pt import, playable WorldModel. Parity fixtures under tests/fixtures/ via `make wm-fixtures`."
license.workspace = true

[lib]
name = "diamond"
path = "src/lib.rs"

[dependencies]
brain-gpu-core.workspace = true
brain-model.workspace = true
brain-kernels.workspace = true
brain-vae.workspace = true
brain-checkpoint.workspace = true
brain-wm-core.workspace = true
brain-paramstore.workspace = true
brain-optim.workspace = true
brain-npu.workspace = true
brain-onnx.workspace = true
serde_json.workspace = true

[dev-dependencies]
# `testutil::skip` / `skip_unavailable` - the two skip helpers, so an
# absent fixture can be made fatal and absent hardware cannot.
brain-testutil.workspace = true
