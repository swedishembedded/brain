[package]
name = "brain-modelopt"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
description = "Model optimization: measured, budget-constrained compression of any model::Model. Ranks every quantizable linear and storage tier by its estimated loss increase, solves for the assignment that fits a byte budget, and accepts a result only on a whole-model measurement on held-out data. No architecture-specific code."

[lib]
name = "modelopt"
path = "src/lib.rs"

[dependencies]
brain-model.workspace = true
brain-gpu-core.workspace = true
serde.workspace = true
serde_json.workspace = true
brain-data.workspace = true
brain-checkpoint.workspace = true

[dev-dependencies]
# `tests/autoquant.rs` trains a tiny `qwen3::Qwen` as the model under search.
brain-qwen3.workspace = true
# `tests/it/surgery.rs` edits tiny Qwen3-TTS checkpoints and compares their predictions.
brain-qwen3tts.workspace = true
brain-testutil.workspace = true
