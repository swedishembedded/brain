[package]
name = "brain-controlnet"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Backbone-agnostic ControlNet: a ControlAdapter over named injection points, so one control-conditioning mechanism serves the UNet and the FLUX DiTs alike."

[lib]
name = "controlnet"
path = "src/lib.rs"

# Every entry here is USED by src/ or tests/ — checked by grepping for the
# crate's lib name, because cargo links each one into every test binary and
# `cargo build` does not warn about an unused dependency. `brain-vision` was on
# the skeleton and is referenced by nothing (this crate never builds an NCHW
# `Shape`); it belongs back here when a device conv path outside
# `vae::blocks` lands.
[dependencies]
brain-gpu-core.workspace = true   # Gpu, DeviceBuffer, Step
brain-kernels.workspace = true    # scale_chan — the one kernel appended to unet's set
brain-model.workspace = true      # model::hostmath::timestep_embedding
brain-checkpoint.workspace = true # safetensors reader (import + parity fixtures)
brain-sdxlunet.workspace = true       # sdxlunet::model::Rec - the trainable copy IS the UNet's blocks
brain-data.workspace = true       # data::rng::Rng for init.rs
# `imaging::pixels::{u8_to_unit, hwc_to_chw}` — the workspace's ONE home for the
# u8->[0,1] cast and the HWC->CHW permutation `src/cond.rs` needs. Hand-rolling
# that loop here is the exact duplication `crates/imaging` was created to end.
brain-imaging.workspace = true
# `caps`: the served `text2image` action, which is `sdxlunet::sampler::sample`'s
# loop with `Unet::new_controlled` + a per-step `ControlNet::run` as the
# `Denoiser`. The two CLIP towers and the discrete scheduler are reached
# through `sdxlunet::textenc`/`sdxlunet::sampler` now, not this crate's own
# `brain-clip`/`brain-diffusion` dependency - only the VAE decode is still
# driven directly from here.
brain-capability.workspace = true
brain-vae.workspace = true
serde_json.workspace = true

[dev-dependencies]
# `testutil::parity::Table` - the one implementation of the cosine/rel_l2 stage
# table the parity test gates on.
brain-testutil.workspace = true
