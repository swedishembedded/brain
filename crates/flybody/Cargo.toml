[package]
name = "brain-flybody"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The fly's body seam: which MuJoCo actuator each motor neuron drives, built from the connectome's own muscle annotations rather than a hand-written neuron list."

[lib]
name = "flybody"
path = "src/lib.rs"

[dependencies]
brain-connectome.workspace = true

[dev-dependencies]
# Only the tests need a physics engine: the map itself is built against a list
# of actuator NAMES, so it stays testable with no MuJoCo present. The one gate
# that does need it is the one that measures how the model responds.
brain-mujoco.workspace = true
brain-testutil.workspace = true
