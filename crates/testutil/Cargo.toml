[package]
name = "brain-testutil"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared dev-dependency of brain's tests: testdata fixture paths and skip rules, stage-parity reports and golden-source checks, finite-difference and round-off tolerances, and generated checkpoint and adapter fixtures."

[lib]
name = "brain_testutil"
path = "src/lib.rs"

[dependencies]
brain-modelref.workspace = true
brain-modelstore.workspace = true
# `parity::Report::against` reads goldens as `checkpoint::safetensors::StTensor`.
brain-checkpoint.workspace = true
# `golden::Source` reads the provenance block out of a dumper's manifest.json.
serde_json.workspace = true
