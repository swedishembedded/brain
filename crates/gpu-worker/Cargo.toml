[package]
name = "brain-gpu-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The supervised device worker: a child process that owns one card's device for a supervisor, opens it, probes it with a real dispatch, and answers the supervisor's line protocol, so a driver call that wedges takes down only this process."

[[bin]]
name = "brain-gpu-worker"
path = "src/main.rs"

[dependencies]
brain-backend-wgpu.workspace = true
brain-kernels.workspace = true
serde_json.workspace = true

[dev-dependencies]
brain-gpu-supervisor.workspace = true
brain-residency.workspace = true
brain-capability.workspace = true
brain-testutil.workspace = true
