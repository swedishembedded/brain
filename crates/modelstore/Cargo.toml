[package]
name = "brain-modelstore"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The on-disk model store: <vendor>/<repo> layout, local discovery, and the fetch resolution ladder (on disk -> upstream quantized artifact -> base + local quantize). No capability, no residency, no model crates -- a leaf between modelref/checkpoint and the CLI."

[lib]
name = "brain_modelstore"
path = "src/lib.rs"

[dependencies]
brain-arch.workspace = true
brain-capability.workspace = true
brain-modelref.workspace = true
brain-checkpoint.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ureq = { workspace = true, features = ["json"] }

# sha2's portable SHA-256 runs at a few hundred MB/s on aarch64; its `asm` feature selects the hardware SHA-2
# instructions there (it falls back to the portable code when the CPU lacks them). Hashing a multi-gigabyte base or
# checkpoint is otherwise the longest step of a fine-tune that is not training.
[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { workspace = true, features = ["asm"] }
