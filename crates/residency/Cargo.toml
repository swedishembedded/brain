[package]
name = "brain-residency"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "brain's automatic model residency + job scheduling layer: tiers model weights across GPU/RAM/disk by LRU within a reserved memory budget, and schedules pending jobs (batch-by-model, queue-age-aware, parallel lanes) so many models serve efficiently. The general execution layer used by the CLI, the event runtime, and the D-Bus surface."

[lib]
name = "residency"
path = "src/lib.rs"

[dependencies]
brain-capability.workspace = true
brain-memauth.workspace = true
# Supervised device workers and the per-device circuit breaker.
brain-gpu-supervisor.workspace = true
# `hardware::is_wait_timeout`: how an in-process driver wait that ran past its bound is recognised.
brain-backend-api.workspace = true
serde_json.workspace = true
