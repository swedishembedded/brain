[package]
name = "brain-yolo"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "YOLOv8-style anchor-free object detector: backbone/neck/head + DFL box decode in WGSL (skeleton — P0)."

[lib]
name = "yolo"
path = "src/lib.rs"

[dependencies]
brain-capability.workspace = true
brain-gpu-core.workspace = true
brain-vision.workspace = true
brain-model.workspace = true
brain-paramstore.workspace = true
brain-optim.workspace = true
brain-checkpoint.workspace = true
brain-kernels.workspace = true
brain-data.workspace = true
serde_json.workspace = true
bytemuck.workspace = true

[dev-dependencies]
# The P2 per-block gradient-check gate (tests/p2_blocks.rs) drives each block
# through the repo's finite-difference checker. gradcheck does not depend on
# brain-yolo, so this dev-only edge introduces no cycle.
brain-gradcheck.workspace = true
# The P7 detection capability / negative-control tests score trained models with
# the golden-tested `eval::detection::map50`. `brain-eval` depends on `brain-yolo`,
# but a DEV-dependency edge is excluded from cargo's normal dependency graph, so
# this introduces no build cycle (same pattern as `brain-gradcheck` above).
brain-eval.workspace = true
