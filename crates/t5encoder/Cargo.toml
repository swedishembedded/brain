[package]
name = "brain-t5encoder"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "T5-XXL encoder — the text conditioning FLUX.1 needs alongside CLIP-L."

[lib]
name = "t5encoder"
path = "src/lib.rs"

[dependencies]
brain-gpu-core.workspace = true
brain-kernels.workspace = true
brain-model.workspace = true
brain-paramstore.workspace = true
brain-checkpoint.workspace = true
# `train` - the workspace's only test/gradcheck PRNG (`data::rng::Rng`); the
# umT5 parity test additionally drives `data::unigram`, so the tokenizer and
# the encoder are gated against the same golden prompts. `caps` reuses the
# same tokenizer for the served `encode` action.
brain-data.workspace = true
brain-capability.workspace = true
serde_json.workspace = true

[dev-dependencies]
# The shared testdata resolution + the parity report's rel_l2.
brain-testutil.workspace = true

