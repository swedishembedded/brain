[package]
name = "brain-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The `brain` native CLI: dispatches MoE/GPT/PID/federated training, eval, and generation."

[[bin]]
name = "brain"
path = "src/main.rs"

[features]
# Optional native-Vulkan cooperative-matrix matmul path (ash + naga). OFF by
# default - the default build stays pure wgpu/WGSL.
vulkan-coopmat = ["dep:brain-vulkan"]
# Enable the engine's fault-injection points for `brain perf faults` (G).
fault-injection = ["brain-qwen3/fault-injection"]

[dependencies]
# D-Bus control surface: compiled into the default build so `brain serve --dbus`
# always works, but only served when the `--dbus` flag is passed.
brain-dbus.workspace = true
brain-shutdown.workspace = true
brain-arch.workspace = true
# `gguf::route` - the one seam that answers "which model is this GGUF", and
# the DeepSeek-OCR importers whose architecture table this crate now owns.
brain-gguf.workspace = true
brain-modelref.workspace = true
brain-modelstore.workspace = true
brain-apiserve.workspace = true
brain-residency.workspace = true
brain-memauth.workspace = true
brain-backend-api.workspace = true
brain-gpu-core.workspace = true
brain-wm-core.workspace = true
brain-diamond.workspace = true
brain-wm-display.workspace = true
brain-toymoe.workspace = true
brain-gpt2.workspace = true
brain-qwen3.workspace = true
brain-rl.workspace = true
brain-qwen35moe.workspace = true
brain-qwen35.workspace = true
brain-qwen3vl.workspace = true
# `brain label` - the model-agnostic captioning seam plus its folder labeler.
brain-captioner.workspace = true
brain-fastvlm.workspace = true
brain-llava.workspace = true
# `catalog`/`resident_moondream3` - Moondream 3's caps surface and residency adapter.
brain-moondream3.workspace = true
brain-glmdsa.workspace = true
brain-lfm2.workspace = true
brain-qwen3tts.workspace = true
brain-minimaxmusic3.workspace = true
brain-cosyvoice.workspace = true
brain-mimi.workspace = true
brain-ecapatdnn.workspace = true
brain-audio.workspace = true
brain-nemotronasr.workspace = true
brain-qwen3asr.workspace = true
brain-qwen3omnimoe.workspace = true
brain-toypid.workspace = true
brain-yolov8.workspace = true
brain-zipdepth.workspace = true
brain-sam2.workspace = true
brain-scrfd.workspace = true
brain-arcface.workspace = true
brain-vqgan.workspace = true
# `brain flops --model flux2|ltxv`: the VAE decode stage of a generation is
# priced from the decoder's own recorded step list, so the cost model needs the
# crate that builds it.
brain-vae.workspace = true
brain-codeformer.workspace = true
brain-rrdbnet.workspace = true
brain-worldmirror2.workspace = true
brain-splat.workspace = true
brain-paramstore.workspace = true
brain-vision.workspace = true
brain-imaging.workspace = true
brain-capture.workspace = true
brain-model.workspace = true
brain-data.workspace = true
brain-federated.workspace = true
brain-gradcheck.workspace = true
brain-eval.workspace = true
brain-bench.workspace = true
brain-perf.workspace = true
brain-checkpoint.workspace = true
brain-capability.workspace = true
# The served-model catalog (manifest + provider ctor per model, ~70 crates) -
# `catalog.rs` is a thin CLI-local extension over this (patches back the
# residency adapters that must stay CLI-local, see that file's module doc).
brain-catalog.workspace = true
# `--trace-<family>`/`--trace-format`/`--trace-output`: the family registry and
# the ONE global `tracing_subscriber` install. Only this binary installs one;
# every library crate emits through the plain `tracing` facade.
brain-trace.workspace = true
clap.workspace = true
brain-s3dit.workspace = true
brain-flux2.workspace = true
# `brain wan t2v`: the video pipeline (DiT + umT5 + Wan-VAE) behind wan_cli.
brain-wan.workspace = true
# `brain ltxv t2v`: the smoke-test video pipeline (tiny random-weight DiT +
# real VAE) behind ltxv_cli.
brain-ltxv.workspace = true
brain-events.workspace = true
brain-runtime.workspace = true
brain-forecast.workspace = true
brain-fcbench.workspace = true
brain-chronos2.workspace = true
brain-kronos.workspace = true
brain-fincast.workspace = true
brain-server.workspace = true
brain-onnx.workspace = true
brain-npu.workspace = true
serde_json.workspace = true
brain-vulkan = { workspace = true, optional = true }
brain-clip.workspace = true
brain-t5encoder.workspace = true
brain-sdxlunet.workspace = true
brain-controlnet.workspace = true
brain-supir.workspace = true
brain-flux1.workspace = true
brain-pulid.workspace = true
# DeepSeek-OCR: `deepseek2ocr::caps` (the manifest + the served `generate`) and
# `deepseek2ocr::import` (the checkpoint layout `resident_deepseekocr` locates).
brain-deepseek2ocr.workspace = true
brain-imgpipe.workspace = true
# `brain fetch`: a blocking, streaming HTTP client (rustls, no system OpenSSL)
# is enough for a one-shot CLI download; no need to pull tokio in for this.
ureq.workspace = true
sha2.workspace = true

[dev-dependencies]
# `testutil::skip` / `skip_unavailable` - the two skip helpers, so an
# absent fixture can be made fatal and absent hardware cannot.
brain-testutil.workspace = true
# Drive a real `apiserve::router()` in-process for the HTTP-level serving
# gates in `tests/` (concurrency/prefix-reuse) - mirrors `crates/apiserve`'s
# own test setup, which cannot depend on `brain-cli` (wrong dependency
# direction: `brain-cli` already depends on `brain-apiserve`).
axum.workspace = true
tower.workspace = true
tokio.workspace = true
