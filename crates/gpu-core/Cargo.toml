[package]
name = "brain-gpu-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GPU plumbing: device init, pipeline cache, dispatch, buffers, blocking/async readback."

[lib]
name = "gpu_core"
path = "src/lib.rs"

[features]
# Native CPU backend: compile the WGSL kernels to native code (Cranelift JIT)
# and run them across CPU cores, instead of the default wgpu backend.
cpu-backend = ["dep:brain-wgsl-cpu", "dep:rayon"]

[dependencies]
brain-kernels.workspace = true
bytemuck.workspace = true

# CPU backend (only compiled with the `cpu-backend` feature).
brain-wgsl-cpu = { workspace = true, optional = true }
rayon = { version = "1", optional = true }

# Native GPU stack: full wgpu (desktop backends) + a blocking executor.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = "29"
pollster = "0.4"

# Browser GPU stack: wgpu's WebGPU backend only, plus async-readback glue.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "29", default-features = false, features = ["webgpu", "wgsl"] }
futures-channel = "0.3"
web-sys = { version = "0.3", features = ["console"] }
