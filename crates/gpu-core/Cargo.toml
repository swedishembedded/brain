[package]
name = "brain-gpu-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Compute-device facade: selects and forwards to an eager Backend (wgpu / native CPU / native Vulkan)."

[lib]
name = "gpu_core"
path = "src/lib.rs"

[dependencies]
brain-backend-api.workspace = true
# The `tracing` FACADE only - never a subscriber. `--trace-gpu <0-5>` (the
# `brain` CLI installs the one subscriber) turns these events on; with none
# installed every macro below is a predictable-branch no-op. Targets default
# to this crate's module path (`gpu_core`), which is what labels each line
# with the component it came from.
tracing.workspace = true
# Pure string data (no deps, no GPU): the WGSL for the drop-in fast kernels the
# `upgrade` table swaps in for a model's registered one.
brain-kernels.workspace = true
# `Gpu::write_f32`'s zero-copy `&[f32] -> &[u32]` reinterpretation. The three
# spellings this replaced were two allocating `to_bits().collect()` copies and
# one `cast_slice`; the shared one keeps the cheapest of them.
bytemuck.workspace = true
# The process-wide memory ceiling (`--limit-vram-total`/`--limit-ram-total`).
# A leaf crate (std only, no GPU code), so depending on it here - at the ONE
# allocation chokepoint every model crate goes through - adds no graph weight
# and cannot cycle. With no ceiling published it costs one relaxed atomic load
# per allocation and nothing else.
brain-memauth.workspace = true

# Native builds carry all three eager backends; the active one is chosen at
# runtime per `Gpu` instance (registry lookup by name). wasm keeps only the
# wgpu/WebGPU backend (Cranelift/ash can't target the browser).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
brain-backend-wgpu.workspace = true
brain-backend-cpu.workspace = true
brain-backend-vulkan.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
brain-backend-wgpu.workspace = true

# Linux CPU affinity for `--device cpu<N>` (pure Rust; no bindgen/libclang in the
# build path, and already transitively present via cranelift-jit / wgpu-hal).
[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

[dev-dependencies]
brain-testutil.workspace = true
