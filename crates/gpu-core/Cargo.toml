[package]
name = "brain-gpu-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Compute-device facade: selects and forwards to an eager Backend (wgpu / native CPU / native Vulkan)."

[lib]
name = "gpu_core"
path = "src/lib.rs"

[dependencies]
brain-backend-api.workspace = true

# Native builds carry all three eager backends; the active one is chosen at
# runtime per `Gpu` instance (registry lookup by name). wasm keeps only the
# wgpu/WebGPU backend (Cranelift/ash can't target the browser).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
brain-backend-wgpu.workspace = true
brain-backend-cpu.workspace = true
brain-backend-vulkan.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
brain-backend-wgpu.workspace = true

[dev-dependencies]
brain-kernels.workspace = true
