[package]
name = "brain-backend-cpu"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
description = "Native CPU eager Backend: WGSL kernels JIT-compiled (Cranelift) and run across cores, with AVX2 fast paths."

[lib]
name = "backend_cpu"
path = "src/lib.rs"

# Native only: the WGSL->Cranelift JIT cannot target wasm.
[dependencies]
brain-backend-api.workspace = true
brain-wgsl-cpu.workspace = true
rayon = "1"
# Linux CPU affinity for `par::with_cores` (the same pure-Rust binding `gpu-core` pins `--device cpu<N>` with).
libc.workspace = true
# The WGSL sources a native route is matched by when a model registers the kernel under a name of its own.
brain-kernels.workspace = true

[dev-dependencies]
brain-testutil.workspace = true
brain-gpu-core.workspace = true

# `data::rng::Lcg` — the one deterministic test PRNG (tests only).
brain-data.workspace = true
