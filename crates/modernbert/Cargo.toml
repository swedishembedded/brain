[package]
name = "brain-modernbert"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ModernBERT: pre-LN bidirectional encoder with alternating full/local-window RoPE attention and a GeGLU MLP, plus Laya's decision head on top of it."

[lib]
name = "modernbert"
path = "src/lib.rs"

[dependencies]
brain-checkpoint.workspace = true
brain-gpu-core.workspace = true
brain-kernels.workspace = true
brain-model.workspace = true
brain-paramstore.workspace = true
brain-optim.workspace = true
brain-data.workspace = true
# `sequence::OrderedJson` implements `Deserialize` by hand - see its own doc
# for why parsing through `serde_json::Value` would silently reorder keys.
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# `testutil::skip` - a parity fixture absent from this checkout is a skip,
# not a failure; see `crates/diamond/tests/parity.rs` for the precedent.
brain-testutil.workspace = true
# `rlcd::reinforce` - the objective `tests/train_convergence.rs` drives
# `LayaDecision`'s loop with. A dev-dependency deliberately: `crates/rlcd` is
# a leaf below every model crate, but this crate's own datapath takes its
# objective as a caller-supplied closure and so depends on no particular one.
brain-rlcd.workspace = true
