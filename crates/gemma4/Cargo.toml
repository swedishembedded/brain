[package]
name = "brain-gemma4"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Gemma-4 (unified text tower) - the LTX-2.5 text encoder. Tiny-config layer-by-layer parity (5:1 sliding/full attention alternation, dual RoPE bases, attention_k_eq_v global layers, the 49-hidden-state aggregate-embed projection) against transformers.models.gemma4_unified; the real 12B/686-tensor checkpoint's config, two-way tensor-coverage import and embedded-tokenizer extraction, built on brain-gpu-core / brain-kernels / brain-checkpoint / brain-data."

[lib]
name = "gemma4"
path = "src/lib.rs"

[dependencies]
brain-gpu-core.workspace = true
brain-kernels.workspace = true
brain-checkpoint.workspace = true
# `data::qwen_tokenizer::QwenBpe` - the existing generic HF `tokenizer.json`
# byte-level BPE reader (`crate::tokenizer`'s doc: the real checkpoint's
# embedded tokenizer IS this format, confirmed by parsing it), reused rather
# than a new parser.
brain-data.workspace = true
# `model::int8::quantize_weight` - the shared per-output-channel symmetric
# int8 packing (4 int8 per u32) every other int8 tier in this workspace
# already uses, and the exact layout `matmul_i8_dyn.wgsl` binds. Reused
# rather than reimplemented; `brain-model` does not depend on this crate, so
# there is no cycle.
brain-model.workspace = true
# `paramstore::upload::Uploader` - the shared chunked-upload driver
# `model::int8::upload_quantized` requires, so a quantized weight streams
# through the same drain discipline every other int8 tier in this workspace
# already uses instead of bypassing it.
brain-paramstore.workspace = true
# The `tracing` FACADE only, never a subscriber - `--trace-ltxv <0-5>` (the
# family that covers this crate's caller) turns the per-layer events on; with
# no subscriber installed each macro is a predictable-branch no-op, so
# instrumenting a 48-layer loop costs nothing on an untraced run.
tracing.workspace = true

[dev-dependencies]
brain-testutil.workspace = true
