[package]
name = "brain-qwen35"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Qwen3.5/3.8-27B dense hybrid Gated-DeltaNet/GQA decoder Transformer (qwen35moe's dense sibling): forward + backprop in WGSL."

[lib]
name = "qwen35"
path = "src/lib.rs"

[dependencies]
brain-capability.workspace = true
brain-gpu-core.workspace = true
brain-model.workspace = true
brain-paramstore.workspace = true
brain-optim.workspace = true
brain-checkpoint.workspace = true
brain-residency.workspace = true
brain-llmserve.workspace = true
brain-gguf.workspace = true
brain-kernels.workspace = true
brain-data.workspace = true
brain-qwen3.workspace = true
brain-qwen3vl.workspace = true
brain-audio.workspace = true
brain-weightset.workspace = true
brain-modelref.workspace = true
brain-modelstore.workspace = true
serde_json.workspace = true
bytemuck.workspace = true
# The streamed trainer reads which card its Gpu is on, to refuse a footprint before loading.
brain-memauth.workspace = true
wgpu = "29"
pollster = "0.4"

[dev-dependencies]
brain-testutil.workspace = true
# Live-resource counters and free-memory reads for the CUDA lifetime gates.
brain-backend-cuda.workspace = true

[[test]]
name = "gguf_conformance"
harness = false

[[test]]
name = "hf_fp8_conformance"
harness = false

[[test]]
name = "gguf_score"
harness = false
