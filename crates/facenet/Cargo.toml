[package]
name = "brain-facenet"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Face recognition: SCRFD detection, 5-point similarity alignment and the ArcFace IResNet-100 embedding — the visual analogue of crates/speaker."

[lib]
name = "facenet"
path = "src/lib.rs"

[dependencies]
brain-gpu-core.workspace = true
brain-kernels.workspace = true
brain-model.workspace = true
brain-vision.workspace = true
brain-imaging.workspace = true
brain-paramstore.workspace = true
# The reference release (insightface antelopev2) ships ONNX and only ONNX, so
# import reads the protobuf. The reader lives in `crates/onnx` — a private one
# here would be a second decoder of the same wire format.
brain-onnx.workspace = true
bytemuck.workspace = true

[dev-dependencies]
brain-testutil.workspace = true
# The parity test replays goldens dumped as safetensors; nothing in the library
# reads a checkpoint (weights arrive through `import_dir`).
brain-checkpoint.workspace = true
