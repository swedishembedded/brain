[package]
name = "brain-sdxlunet"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SDXL UNet2DConditionModel: down/mid/up blocks with skip connections, ResBlocks with an additive timestep embedding, spatial transformers, and the SDXL added-conditioning embedding."

[lib]
name = "sdxlunet"
path = "src/lib.rs"

# Every entry here is USED by src/ or tests/ — checked by grepping for the
# crate's lib name, because cargo links each one into every test binary and
# `cargo build` does not warn about an unused dependency. `brain-vision`,
# `brain-imaging`, `brain-clip` and `brain-diffusion` are back: src/pipeline.rs
# is the sampler glue this comment said would need them — it encodes with both
# CLIP towers, steps a discrete scheduler and hands the decoded CHW to
# imaging::pixels.
[dependencies]
brain-gpu-core.workspace = true   # Gpu, DeviceBuffer, Step
brain-kernels.workspace = true    # the WGSL sources in model::KERNELS
brain-model.workspace = true      # model::block (layernorm, gemm, attention) + hostmath::timestep_embedding
brain-checkpoint.workspace = true # safetensors reader (import + parity fixtures)
brain-vae.workspace = true        # vae::blocks::Builder — the whole conv half
brain-data.workspace = true       # data::rng::Rng for init.rs; clip_bpe for the pipeline
brain-clip.workspace = true       # pipeline: the two SDXL text towers
brain-diffusion.workspace = true  # pipeline: the discrete schedulers
brain-imaging.workspace = true    # pipeline: CHW -> HWC on the decoded image
serde_json.workspace = true

[dev-dependencies]
# `testutil::parity::Table` - the one implementation of the cosine/rel_l2 stage
# table the parity test gates on.
brain-testutil.workspace = true
