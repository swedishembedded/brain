[package]
name = "brain-events"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "JSONL event protocol between the brain runtime and its host (text/camera/detection events) — codec skeleton (P0)."

[lib]
name = "events"
path = "src/lib.rs"

[dependencies]
serde_json.workspace = true
brain-forecast.workspace = true
# `pub use data::base64;` - the base64 codec moved here from this crate (see
# lib.rs's own doc), so every existing `events::base64::*` caller is
# unaffected. No cycle: brain-data does not depend on brain-events.
brain-data.workspace = true
