[package]
name = "brain-supir"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SUPIR photo-realistic image restoration: a frozen SDXL 1.0 base UNet, a 1.24B ControlNet-shaped trunk (GLVControl), and 12 ZeroSFT/ZeroCrossAttn adaptors that replace the UNet's skip concatenation."

[lib]
name = "supir"
path = "src/lib.rs"

[dependencies]
brain-gpu-core.workspace = true   # Gpu, DeviceBuffer, Step
brain-kernels.workspace = true    # edm_mix/scale_row - the ZeroSFT/ZeroCrossAttn control_scale lerp
brain-model.workspace = true      # model::block (cross-attn ids), model::hostmath
brain-checkpoint.workspace = true # safetensors reader (import)
brain-sdxlunet.workspace = true   # sdxlunet::model::Rec/Unet - the frozen backbone IS its blocks
brain-vae.workspace = true        # vae::blocks::{Builder, skipfuse::{Map, SkipFuse}}
brain-data.workspace = true       # data::rng::Rng for init.rs
# pipeline.rs (the restoration loop) + caps.rs (the served `restore` action):
brain-diffusion.workspace = true  # diffusion::restore - RestoreEDMSampler's scalar math
brain-imaging.workspace = true    # pipeline: resize/CHW<->HWC/wavelet+AdaIN colour fix
brain-capability.workspace = true # caps: the served restore action
serde_json.workspace = true       # caps: ActionSpec/Outcome JSON values

[dev-dependencies]
brain-testutil.workspace = true   # testutil::parity::Table, testutil::golden::Source
