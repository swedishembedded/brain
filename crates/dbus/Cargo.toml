[package]
name = "brain-dbus"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Optional D-Bus (zbus) control surface for brain: exposes the capability::Registry over com.swedishembedded.Brain1, passing images/streams/results as file descriptors (memfd/mmap + dmabuf). A thin front-end over the sync Registry — no model code here."

[lib]
name = "brain_dbus"
path = "src/lib.rs"

[dependencies]
brain-capability.workspace = true
brain-residency.workspace = true
serde_json.workspace = true
anyhow = "1"
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync"] }
nix = { version = "0.29", features = ["socket", "mman", "fs", "uio", "ioctl"] }
