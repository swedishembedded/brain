[package]
name = "brain-dbus"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Optional D-Bus (zbus) control surface for brain: exposes the capability::Registry over com.swedishembedded.Brain1, passing images/streams/results as file descriptors (memfd/mmap + dmabuf). A thin front-end over the sync Registry — no model code here."

[lib]
name = "brain_dbus"
path = "src/lib.rs"

[dependencies]
brain-capability.workspace = true
brain-residency.workspace = true
brain-stats.workspace = true
brain-shutdown.workspace = true
brain-modelref.workspace = true
serde_json.workspace = true
anyhow.workspace = true
zbus.workspace = true
tokio.workspace = true
nix = { version = "0.29", features = ["socket", "mman", "fs", "uio", "ioctl", "poll"] }

[dev-dependencies]
# `testutil::skip` / `skip_unavailable` - the two skip helpers, so an
# absent fixture can be made fatal and absent hardware cannot.
brain-testutil.workspace = true
