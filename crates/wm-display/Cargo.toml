[package]
name = "brain-wm-display"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Realtime display + input for world models: SDL2 software-blit window (hand-rolled minimal FFI, always compiled), WASD key chords, fixed-timestep pacing, and headless sinks for CI. The window opens only when a run needs it; headless runs never touch SDL."

[lib]
name = "wm_display"
path = "src/lib.rs"

[dependencies]
brain-wm-core.workspace = true
# Recording sink (`record::RecorderSink`) writes episode datasets.
brain-data.workspace = true
brain-imaging.workspace = true

[dev-dependencies]
# `testutil::skip` / `skip_unavailable` - the two skip helpers, so an
# absent fixture can be made fatal and absent hardware cannot.
brain-testutil.workspace = true
