[package]
name = "brain-wm-display"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Realtime display + input for world models: SDL2 software-blit window (hand-rolled minimal FFI), WASD key chords, fixed-timestep pacing, and headless sinks for CI."

[lib]
name = "wm_display"
path = "src/lib.rs"

[features]
# The SDL2 window links the SYSTEM libSDL2 (no bundled build, no sdl2 crate).
# Headless sinks, keymap, and pacing compile without it.
default = ["sdl"]
sdl = []

[dependencies]
brain-wm-core.workspace = true
