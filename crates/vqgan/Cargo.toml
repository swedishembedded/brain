[package]
name = "brain-vqgan"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VQ encoder/decoder/codebook shared by CodeFormer and other VQ-latent models, built on crates/vae's shared conv block builder and the vq_argmin kernel."

[lib]
name = "vqgan"
path = "src/lib.rs"

[dependencies]
brain-gpu-core.workspace = true
brain-kernels.workspace = true
brain-vae.workspace = true
brain-wm-core.workspace = true
brain-checkpoint.workspace = true
brain-data.workspace = true
brain-imaging.workspace = true
# `patchgan.rs` - the discriminator is `vision::Conv` blocks with its own AdamW (`optim`, over a `paramstore` store).
brain-vision.workspace = true
brain-paramstore.workspace = true
brain-optim.workspace = true
bytemuck.workspace = true
# `train.rs` - the perceptual term, `lpips::Lpips::distance_grad`.
brain-lpips.workspace = true
# `caps.rs` — the serving contract's capability surface.
brain-capability.workspace = true
brain-modelstore.workspace = true
serde_json.workspace = true

# Everything above is ALSO what the parity test needs, and cargo already links
# every [dependencies] entry into tests/ — so this is the one genuinely
# test-only addition, not a second [dependencies] section.
[dev-dependencies]
brain-testutil.workspace = true
