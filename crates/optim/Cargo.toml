[package]
name = "brain-optim"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AdamW optimizer + optional global grad-norm clipping, as WGSL dispatches."

[lib]
name = "optim"
path = "src/lib.rs"

[dependencies]
brain-gpu-core.workspace = true
brain-paramstore.workspace = true
brain-checkpoint.workspace = true
brain-kernels.workspace = true
bytemuck.workspace = true
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The workspace's one rayon seam: the host update of a tile (state decode and encode, the rule, copies) runs on the
# CPU scheduler's pool instead of threads spawned per call.
brain-backend-cpu.workspace = true
wgpu.workspace = true
pollster.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "29", default-features = false, features = ["webgpu", "wgsl"] }
[dev-dependencies]
brain-testutil.workspace = true
