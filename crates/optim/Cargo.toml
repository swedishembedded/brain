[package]
name = "brain-optim"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AdamW optimizer + optional global grad-norm clipping, as WGSL dispatches."

[lib]
name = "optim"
path = "src/lib.rs"

[dependencies]
brain-gpu-core.workspace = true
brain-paramstore.workspace = true
brain-kernels.workspace = true
bytemuck.workspace = true
rayon = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = "29"
pollster = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "29", default-features = false, features = ["webgpu", "wgsl"] }
[dev-dependencies]
