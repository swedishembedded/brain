[package]
name = "brain-memauth"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The process-wide memory authority: a live, injectable view of how much host RAM (and, per pool, device memory) is actually free right now -- across physically-shared pools (a unified-memory box's iGPU and CPU RAM are the SAME bytes), a cgroup limit tighter than /proc/meminfo, and another process taking RAM mid-run. A leaf crate (std only): `residency` (cross-instance placement) and `weightset` (within-instance weight residency) both depend on it without depending on each other."

[lib]
name = "memauth"
path = "src/lib.rs"

