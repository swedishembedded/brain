[package]
name = "brain-sfm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Structure from motion from photographs alone: SIFT features, mutual ratio-test matching, RANSAC essential-matrix verification, PnP registration, triangulation and Levenberg-Marquardt bundle adjustment with a self-calibrated focal length and radial distortion."

[lib]
name = "sfm"
path = "src/lib.rs"

[dependencies]
# `backend_cpu::par` - the workspace's one rayon seam: feature extraction,
# blurs and descriptor matching are data-parallel host loops.
brain-backend-cpu.workspace = true
# `data::rng::Lcg` - the deterministic PRNG, for RANSAC sampling that gives the
# same reconstruction twice.
brain-data.workspace = true
