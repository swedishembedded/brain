[package]
name = "brain-catalog"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The served-model catalog: one entry per model (manifest + provider constructor) in one place, so `brain caps`/`brain do`, the D-Bus/HTTP surfaces and any other in-process consumer discover and construct the ~70 registered model crates from a SINGLE list instead of drifting hand-maintained copies."

[lib]
name = "catalog"
path = "src/lib.rs"

[dependencies]
brain-capability.workspace = true
brain-residency.workspace = true
brain-modelstore.workspace = true
brain-modelref.workspace = true
brain-model.workspace = true
brain-loader.workspace = true
brain-gpu-core.workspace = true
brain-s3dit.workspace = true
brain-flux2.workspace = true
brain-wan.workspace = true
# `resident_minimaxh3`: the residency-scheduled MiniMax-H3 adapter, and the
# `ModelEntry` below it (`caps::manifest`/`Paths::from_assembly`/`H3Spec`).
brain-minimaxh3.workspace = true
# `resident_minimaxh3`'s per-call VAE weight map type
# (`minimaxh3::caps::VaeWeights` holds `vae::blocks::Tensors`).
brain-vae.workspace = true
brain-ltxv.workspace = true
brain-qwen3.workspace = true
brain-glmdsa.workspace = true
brain-qwen35moe.workspace = true
brain-qwen35.workspace = true
brain-llmserve.workspace = true
brain-horizon.workspace = true
brain-lfm2.workspace = true
brain-ouro.workspace = true
brain-fastvlm.workspace = true
brain-llava.workspace = true
brain-qwen3vl.workspace = true
brain-yolov8.workspace = true
brain-zipdepth.workspace = true
brain-sam2.workspace = true
brain-lpips.workspace = true
brain-scrfd.workspace = true
brain-florence2.workspace = true
brain-arcface.workspace = true
brain-vqgan.workspace = true
brain-codeformer.workspace = true
brain-rrdbnet.workspace = true
brain-clip.workspace = true
brain-decisions.workspace = true
brain-t5encoder.workspace = true
brain-sdxlunet.workspace = true
brain-controlnet.workspace = true
brain-supir.workspace = true
brain-flux1.workspace = true
brain-pulid.workspace = true
brain-deepseek2ocr.workspace = true
brain-deepseekocr2.workspace = true
brain-moondream3.workspace = true
brain-deepseekvl.workspace = true
brain-minicpmv.workspace = true
brain-januspro.workspace = true
brain-imgpipe.workspace = true
brain-qwen3tts.workspace = true
brain-minimaxmusic3.workspace = true
brain-cosyvoice.workspace = true
brain-nemotronasr.workspace = true
brain-qwen3asr.workspace = true

brain-audio.workspace = true
brain-chronos2.workspace = true
brain-data.workspace = true
brain-fincast.workspace = true
brain-forecast.workspace = true
brain-gpt2.workspace = true
brain-imaging.workspace = true
brain-kronos.workspace = true
brain-npu.workspace = true
brain-onnx.workspace = true
brain-paramstore.workspace = true
