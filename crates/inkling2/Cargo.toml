[package]
name = "brain-inkling2"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
description = "Inkling 2: a mixture-of-experts decoder with depth-attention residuals, optionally looped with messages between passes."

[lib]
name = "inkling2"
path = "src/lib.rs"

[dependencies]
brain-checkpoint.workspace = true
# The release's drafter (`mtp.safetensors`) is a DSpark block drafter.
brain-dflash2.workspace = true
# The shared operators the tower runs on: ViT blocks, the position-table taps, the MLP projector, the prompt embeds.
brain-model.workspace = true
# `serve::served_family`: the adapter-serving family the catalog's resident and the conformance suite bind adapters to.
brain-llmserve.workspace = true
brain-gpu-core.workspace = true
# The tower's tensors, with gradients where they train, and the adapters' factors.
brain-paramstore.workspace = true
brain-kernels.workspace = true
# The pad-and-tile image preprocessor.
brain-imaging.workspace = true
# `capability::failure::CANCELLED`, the answer of a cancelled export.
brain-capability.workspace = true
brain-optim.workspace = true
# The per-token document positions of packed rows and the draws of fresh weights.
brain-data.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# `testutil::skip` / `skip_unavailable` - an absent fixture can be made fatal
# and absent hardware cannot.
brain-testutil.workspace = true

