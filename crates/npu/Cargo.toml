[package]
name = "brain-npu"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "YOLO -> ONNX export + brain-native INT8 PTQ + optional OpenVINO NPU runtime."
build = "build.rs"

[lib]
name = "npu"
path = "src/lib.rs"

[dependencies]
brain-backend-api.workspace = true
brain-model.workspace = true
brain-onnx.workspace = true
brain-checkpoint.workspace = true
brain-qwen3.workspace = true
brain-glm.workspace = true
brain-qwen35moe.workspace = true
brain-chronos2.workspace = true
brain-lfm.workspace = true
brain-kronos.workspace = true
brain-fincast.workspace = true
brain-codec.workspace = true
brain-vision.workspace = true
brain-depth.workspace = true
brain-yolo.workspace = true
brain-imaging.workspace = true
brain-mirror.workspace = true
brain-data.workspace = true
brain-eval.workspace = true
brain-events.workspace = true
bytemuck.workspace = true
serde_json.workspace = true

# OpenVINO is a DEFAULT dependency on x86_64 linux/windows (the only platforms
# the NPU path targets), so `--device npu` works with no special rebuild. It is
# platform-gated here only because the crate cannot build for wasm/etc. Thanks to
# `runtime-linking` it does NOT link at build time — the OpenVINO shared library
# is loaded at run time — so `cargo build`/`make test` stay green on machines
# without OpenVINO installed; a missing runtime surfaces only when a session is
# opened. On other targets a stub with the same API reports "unsupported".
[target.'cfg(all(target_arch = "x86_64", any(target_os = "linux", target_os = "windows")))'.dependencies]
openvino.workspace = true

# Tests only: the DIAMOND ONNX export tests (tests/wm_onnx.rs) cross-check the
# exported graph against brain's own DiamondUNet forward. Dev-only, so the lib
# dependency direction stays brain-wm-diamond -> brain-npu.
[dev-dependencies]
brain-testutil.workspace = true
brain-wm-diamond.workspace = true
brain-gpu-core.workspace = true
brain-paramstore.workspace = true
brain-nemotron.workspace = true
brain-qwen-asr.workspace = true
brain-qwenvl.workspace = true
