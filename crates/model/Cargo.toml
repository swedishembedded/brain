[package]
name = "brain-model"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Architecture-agnostic Model abstraction + one generic trainer (fit/generate) over any model."

[lib]
name = "model"
path = "src/lib.rs"

[dependencies]
brain-gpu-core.workspace = true
brain-paramstore.workspace = true
brain-optim.workspace = true
brain-kernels.workspace = true
brain-checkpoint.workspace = true
brain-data.workspace = true
serde_json.workspace = true

# The CPU scheduler's parallel primitives (host reductions). Native-only:
# backend-cpu (Cranelift JIT) does not build on wasm, and the modules using it
# are the multi-GPU / offload paths that never run in a browser.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
brain-backend-cpu = { workspace = true }

# brain-gradcheck depends on brain-model (its CheckModel impl for the
# architecture-agnostic Model trait) -- this is the well-supported "tests
# depend on a crate that depends on the package itself" shape: dev-deps are
# not part of the library-target build graph, only the test-target one, so
# this is not a real cycle.
[dev-dependencies]
brain-gradcheck.workspace = true
# Test-only: `crates/model/tests/causal_conv1d_step.rs` gates
# `gdn::gdn_causal_conv1d_step` against `audio::conv::conv1d_fwd`'s
# whole-sequence causal conv (the existing oracle the porting task named).
# `brain-audio` does not depend on `brain-model`, so this is a plain
# dev-dependency, not the "test crate depends on the crate under test" cycle
# shape `brain-gradcheck` above is.
brain-audio.workspace = true
