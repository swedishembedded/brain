[package]
name = "brain-pulid"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PuLID identity conditioning: ArcFace + EVA-CLIP ID embeddings injected into the FLUX.1 backbone through additional cross-attention."

[lib]
name = "pulid"
path = "src/lib.rs"

# Every entry here is REFERENCED by src/ or tests/ — cargo links each dependency
# into every test binary and does NOT warn about an unused one, so the list has
# to be checked by grepping for the crate's lib name.
#
# `brain-arcface` is back, because `src/idcond.rs` is the image → `id_cond` path
# this comment used to say was missing: it runs the ArcFace half on a photograph
# through `arcface::caps::ArcFaceSession::embed_raw_chw` (which detects and
# aligns via `brain-scrfd`, its own dependency).
#
# `brain-clip` and `brain-imaging` are still absent and still referenced by
# nothing. The EVA-CLIP half of `id_cond` remains CALLER-supplied, because the
# reference prepares that image with facexlib RetinaFace alignment plus a BiSeNet
# face parse (background whitened, face greyscaled) — two models brain does not
# have. `IdCond::from_image` therefore takes the prepared EVA cls as an argument
# rather than pretending to reproduce that preprocessing.
[dependencies]
brain-gpu-core.workspace = true   # Gpu, DeviceBuffer, Step, testgpu, select
brain-kernels.workspace = true    # the WGSL sources registered in model::KERNELS
brain-model.workspace = true      # model::block::{gemm_variant, GemmVariants}
brain-paramstore.workspace = true # ParamStore/Role for both graphs' weights
brain-checkpoint.workspace = true # safetensors reader (import + goldens)
brain-flux1.workspace = true      # flux1::KERNELS + the inject::BlockInject seam
brain-arcface.workspace = true    # idcond: detect + align + the RAW ArcFace embedding
# `caps`: the served `text2image` action drives the EVA-CLIP half of
# `id_cond` itself (a plain resize, not the reference's RetinaFace+BiSeNet
# preprocessing - see `caps.rs`'s module docs for that honest gap) and
# `Flux1::generate_injected`'s denoise loop.
brain-clip.workspace = true
brain-imaging.workspace = true
brain-capability.workspace = true
serde_json.workspace = true

[dev-dependencies]
serde_json.workspace = true
brain-testutil.workspace = true   # testdata() + the skip()/skip_unavailable() split
