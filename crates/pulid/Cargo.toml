[package]
name = "brain-pulid"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PuLID identity conditioning: ArcFace + EVA-CLIP ID embeddings injected into the FLUX.1 backbone through additional cross-attention."

[lib]
name = "pulid"
path = "src/lib.rs"

# Every entry here is REFERENCED by src/ or tests/ — cargo links each dependency
# into every test binary and does NOT warn about an unused one, so the list has
# to be checked by grepping for the crate's lib name.
#
# `brain-facenet`, `brain-clip` and `brain-imaging` were declared here and are
# referenced by nothing: PuLID's ID *condition* (the ArcFace 512-d embedding and
# the EVA-CLIP cls + 5 tapped hidden states) is still supplied by the CALLER —
# `IdFormer::set_inputs` takes it as host slices, and the parity test replays it
# from the `face/antelopev2` and `clip/eva02_l336` fixtures. They belong back
# here the moment an image → `id_cond` path lands in this crate (which is what
# `docs/models/pulid/status.md` lists as the next step, and what the missing
# face-parse/grey-whiten preprocessing blocks).
[dependencies]
brain-gpu-core.workspace = true   # Gpu, DeviceBuffer, Step, testgpu, select
brain-kernels.workspace = true    # the WGSL sources registered in model::KERNELS
brain-model.workspace = true      # model::block::{gemm_variant, GemmVariants}
brain-paramstore.workspace = true # ParamStore/Role for both graphs' weights
brain-checkpoint.workspace = true # safetensors reader (import + goldens)
brain-flux1.workspace = true      # flux1::KERNELS + the inject::BlockInject seam

[dev-dependencies]
serde_json.workspace = true
