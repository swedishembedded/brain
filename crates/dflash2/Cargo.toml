[package]
name = "brain-dflash2"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
description = "Block-diffusion draft models, generic over the target: DFlash2 (per-layer sliding/full/NoPE attention, dynamic convolutions, the candidate selector) and DSpark (per-layer tap mixing, a learned mask row, the recurrent Markov head), loaded from Hugging Face safetensors or a GGUF, with a per-sequence serving drafter that reads the target's retained hidden states."

[lib]
name = "dflash2"
path = "src/lib.rs"

[dependencies]
brain-gpu-core.workspace = true
brain-kernels.workspace = true
brain-model.workspace = true
brain-checkpoint.workspace = true
brain-gguf.workspace = true
brain-paramstore.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
brain-testutil.workspace = true
