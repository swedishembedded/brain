[package]
name = "brain-data"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tokenizers (char + GPT-2 BPE), dataset generators, token/float loaders, masking/alignment, normalization."

[lib]
name = "data"
path = "src/lib.rs"

[dependencies]
serde_json.workspace = true
# Read the tokenizer embedded in a GGUF's `tokenizer.ggml.*` KV so a `.gguf`
# chat model can build its byte-level BPE (QwenBpe::from_gguf) with no sibling
# tokenizer.json. checkpoint does not depend on data, so this adds no cycle.
brain-checkpoint.workspace = true
# Synthetic object-detection scene rendering (gen_detect) draws shapes into
# in-memory RGB buffers; the captioned-image dataset loader (imageset, hoisted
# from zimage) additionally decodes JPEG/PNG/PPM training images — so exactly
# those three codecs are enabled and nothing else. `imageproc` supplies the
# shape-drawing primitives.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "pnm"] }
imageproc = { version = "0.25", default-features = false }
