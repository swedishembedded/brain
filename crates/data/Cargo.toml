[package]
name = "brain-data"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tokenizers (char + GPT-2 BPE), dataset generators, token/float loaders, masking/alignment, normalization."

[lib]
name = "data"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
# captions.yaml is parsed by a real YAML implementation into a typed schema
# (imageset::CaptionFile), never by a hand-rolled line scanner: the caption
# file is hand-edited, so it meets every corner of the grammar eventually.
serde_norway.workspace = true
minijinja.workspace = true
minijinja-contrib.workspace = true
# Read the tokenizer embedded in a GGUF's `tokenizer.ggml.*` KV so a `.gguf`
# chat model can build its byte-level BPE (QwenBpe::from_gguf) with no sibling
# tokenizer.json. checkpoint does not depend on data, so this adds no cycle.
brain-checkpoint.workspace = true
# Synthetic object-detection scene rendering (gen_detect) draws shapes into
# in-memory RGB buffers; the captioned-image dataset loader (imageset, hoisted
# from zimage) additionally decodes JPEG/PNG/PPM training images — so exactly
# those three codecs are enabled and nothing else. `imageproc` supplies the
# shape-drawing primitives.
image = { workspace = true, features = ["jpeg", "png", "pnm"] }
imageproc = { version = "0.25", default-features = false }

[dev-dependencies]
# The shared model-store fixture resolution, so the train/serve template
# cross-check (tests/chat_template_cross_check.rs) finds the real Qwen3
# tokenizer_config.json on any dev box instead of skipping silently behind a
# private QWEN3_DIR env var. No cycle: testutil pulls modelref/modelstore
# only, neither of which depends on brain-data.
brain-testutil.workspace = true
