[package]
name = "brain-mujoco"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A minimal hand-rolled binding to the MuJoCo physics library, dlopened at run time so the default build needs no MuJoCo installed. Loads a model, steps it, and reads or writes state through MuJoCo's own flat state API rather than by mirroring mjData."

[lib]
name = "mujoco"
path = "src/lib.rs"

[dependencies]
# Same dlopen path `backend-cuda` uses for libcuda: no build-time dependency,
# so a box with no MuJoCo still builds and tests this crate green.
libloading.workspace = true

[dev-dependencies]
# `window_with_gl` example: the minimal reproducer for a headless GL context
# and an SDL window in one process. Dev-only, so nothing that links this
# crate gains a display dependency.
brain-wm-display.workspace = true
brain-testutil.workspace = true
tempfile.workspace = true
