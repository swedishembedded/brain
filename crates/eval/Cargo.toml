[package]
name = "brain-eval"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Unified evaluation: validation perplexity + task exact-match, for apples-to-apples model comparison."

[lib]
name = "eval"
path = "src/lib.rs"

[dependencies]
brain-gpt2.workspace = true
brain-lfm2.workspace = true
brain-yolov8.workspace = true
brain-data.workspace = true
brain-checkpoint.workspace = true
brain-audio.workspace = true
brain-ecapatdnn.workspace = true
# `calibration` re-exports `rlcd::metrics` (ECE/AdaECE/classwise-ECE/NLL/
# Brier/reliability/coverage/failure-AUROC) under the name a decision
# model's evaluation metrics were originally specified as. Placed in the
# leaf layer (`crates/rlcd`), not owned here, so a sample can use the
# metrics without this crate's own heavier closure
# (gpt2/lfm2/yolov8/audio/ecapatdnn) - this re-export is free.
brain-rlcd.workspace = true
serde_json.workspace = true

[dev-dependencies]
brain-testutil.workspace = true
