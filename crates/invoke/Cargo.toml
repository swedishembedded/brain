[package]
name = "brain-invoke"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Run one model's served capability actions from a command line on the machine that holds the weights: the action's manifest becomes its flags (every param, its default and its bounds), files become input blobs, output blobs become files. The one implementation behind `brain do` and every per-model sample."

[lib]
name = "invoke"
path = "src/lib.rs"

[dependencies]
brain-appopts.workspace = true
brain-audio.workspace = true
brain-capability.workspace = true
brain-gpu-core.workspace = true
brain-imaging.workspace = true
brain-loader.workspace = true
brain-modelstore.workspace = true
clap.workspace = true
serde_json.workspace = true
