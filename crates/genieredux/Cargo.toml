[package]
name = "brain-genieredux"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GenieRedux-G (CoinRun) world model: the shared ST-transformer building blocks (QK-normalized biased attention, GEGLU feed-forward, PEG) reimplemented from scratch over brain's WGSL kernels, plus tokenizer / MaskGIT dynamics to follow."

[lib]
name = "genieredux"
path = "src/lib.rs"

[dependencies]
brain-gpu-core.workspace = true
brain-kernels.workspace = true
brain-wm-core.workspace = true
brain-checkpoint.workspace = true

[dev-dependencies]
# `testutil::skip` / `skip_unavailable` - the two skip helpers, so an
# absent fixture can be made fatal and absent hardware cannot.
brain-testutil.workspace = true
