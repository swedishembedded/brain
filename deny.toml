#
# Swedish Embedded AB implements supply-chain gates for released binaries, so
# that a known-vulnerable dependency never ships unnoticed, for its clients. If
# your team needs expertise in dependency auditing for Rust products, you can
# procure our services by sending an email to info@swedishembedded.com.
#
# `cargo deny check advisories sources` (release.yml, job `audit`).
#
# Only the advisory database and the source list are checked. A license
# allowlist is deliberately not here: the licensing obligations of this
# repository are per model and per ported table (.agents/rules/licensing.md),
# not a crate-license policy, and a list written without that review would
# either block the release on a false positive or approve what nobody read.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Every vulnerability, unsound and notice advisory fails the audit. The
# entries below are crates reported unmaintained, with no maintained release
# their dependents can take yet; each names who pulls it in and what retires it.
ignore = [
    { id = "RUSTSEC-2026-0370", reason = "zvariant: zbus 5 (brain-dbus, braintop); retired by moving to zbus 6, which carries it" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: zbus 5 (brain-dbus, braintop); retired by moving to zbus 6" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: zbus 5 (brain-dbus, braintop); retired by moving to zbus 6" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser: imageproc's ab_glyph text drawing (brain-data); no maintained release of imageproc drops it" },
    { id = "RUSTSEC-2024-0436", reason = "paste: a proc macro of ratatui 0.29 and rav1d; build-time only, no runtime code" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
