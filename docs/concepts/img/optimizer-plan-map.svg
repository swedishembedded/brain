<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="748" viewBox="0 0 1540 748" font-family="'Helvetica Neue',Helvetica,Arial,'DejaVu Sans',sans-serif">
  <desc>The accepted Qwen3-0.6B plan as a grid of 28 layers by four linear groups, int8 in blue and nf4 in orange: early layers and the last layer stay int8, later layers move to nf4. Bars compare the linears&#x27; bytes and held-out loss of the original, uniform nf4 and the plan as served.</desc>
