<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a202c"/></marker><marker id="head-c53030" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c53030"/></marker></defs><rect width="860" height="400" fill="#ffffff"/>
<rect x="16" y="14" width="828" height="112" rx="6" fill="#fbfcfe" stroke="#a0aec0" stroke-width="1"/>
<text x="30" y="36" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a202c">forward</text>
<ellipse cx="110" cy="76" rx="75" ry="28" fill="#fefcbf" stroke="#4a5568" stroke-width="1.2"/>
<text x="110" y="72.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">X</text>
<text x="110" y="88.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">[B, D] = [3, 2]</text>
<rect x="295" y="45" width="270" height="62" rx="10" fill="#e2e8f0" stroke="#4a5568" stroke-width="1.2"/>
<text x="430" y="72.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">linear: Y = X W^T + b</text>
<text x="430" y="88.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">W [O, D] = [4, 2],  b [O] = [4]</text>
<ellipse cx="750" cy="76" rx="75" ry="28" fill="#ffffff" stroke="#4a5568" stroke-width="1.2"/>
<text x="750" y="72.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">Y</text>
<text x="750" y="88.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">[B, O] = [3, 4]</text>
<line x1="188" y1="76" x2="292" y2="76" stroke="#1a202c" stroke-width="1.4" marker-end="url(#head)"/>
<line x1="568" y1="76" x2="672" y2="76" stroke="#1a202c" stroke-width="1.4" marker-end="url(#head)"/>
<rect x="16" y="142" width="828" height="246" rx="6" fill="#fbfcfe" stroke="#a0aec0" stroke-width="1"/>
<text x="30" y="164" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a202c">backward: the gradient arriving at Y is split into three</text>
<ellipse cx="110" cy="272" rx="75" ry="28" fill="#ffffff" stroke="#4a5568" stroke-width="1.2"/>
<text x="110" y="268.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">dY</text>
<text x="110" y="284.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">[B, O] = [3, 4]</text>
<rect x="295" y="175" width="270" height="62" rx="10" fill="#ebf4ff" stroke="#4a5568" stroke-width="1.2"/>
<text x="430" y="194.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">dX = dY W</text>
<text x="430" y="210.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">[B, O] x [O, D] = [B, D]</text>
<text x="430" y="226.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">reads the weight W</text>
<ellipse cx="750" cy="206" rx="75" ry="28" fill="#fefcbf" stroke="#4a5568" stroke-width="1.2"/>
<text x="750" y="202.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">dX</text>
<text x="750" y="218.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">[B, D] = [3, 2]</text>
<path d="M185,272 L240,272 Q250,272 250,262 L250,216 Q250,206 260,206 L292,206" fill="none" stroke="#c53030" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#head-c53030)"/>
<line x1="568" y1="206" x2="672" y2="206" stroke="#c53030" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#head-c53030)"/>
<rect x="295" y="241" width="270" height="62" rx="10" fill="#ebf4ff" stroke="#4a5568" stroke-width="1.2"/>
<text x="430" y="260.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">dW = dY^T X</text>
<text x="430" y="276.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">[O, B] x [B, D] = [O, D]</text>
<text x="430" y="292.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">reads the input X</text>
<ellipse cx="750" cy="272" rx="75" ry="28" fill="#fefcbf" stroke="#4a5568" stroke-width="1.2"/>
<text x="750" y="268.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">dW</text>
<text x="750" y="284.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">[O, D] = [4, 2]</text>
<line x1="188" y1="272" x2="292" y2="272" stroke="#c53030" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#head-c53030)"/>
<line x1="568" y1="272" x2="672" y2="272" stroke="#c53030" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#head-c53030)"/>
<rect x="295" y="307" width="270" height="62" rx="10" fill="#ebf4ff" stroke="#4a5568" stroke-width="1.2"/>
<text x="430" y="326.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">db = sum over b of dY</text>
<text x="430" y="342.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">[B, O] summed over B = [O]</text>
<text x="430" y="358.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">reads nothing</text>
<ellipse cx="750" cy="338" rx="75" ry="28" fill="#fefcbf" stroke="#4a5568" stroke-width="1.2"/>
<text x="750" y="334.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">db</text>
<text x="750" y="350.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">[O] = [4]</text>
<path d="M185,272 L240,272 Q250,272 250,282 L250,328 Q250,338 260,338 L292,338" fill="none" stroke="#c53030" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#head-c53030)"/>
<line x1="568" y1="338" x2="672" y2="338" stroke="#c53030" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#head-c53030)"/>
</svg>
