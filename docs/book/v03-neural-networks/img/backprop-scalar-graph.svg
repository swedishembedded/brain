<!-- source-sha256: 688e1e7dbd7f0ad847c1b7cd5ee5fe8bea77dfa601cf8146bcff9650296d85b4 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 215" width="900" height="215">
<defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a202c"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c53030"/></marker></defs>
<rect width="900" height="215" fill="#ffffff"/>
<rect x="33" y="98" width="124" height="44" rx="9" fill="#e2e8f0" stroke="#4a5568"/>
<text x="95" y="117" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1a202c" text-anchor="middle" font-weight="normal">u = w1 x</text>
<text x="95" y="134" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a202c" text-anchor="middle" font-weight="normal">= 0.6000</text>
<text x="95" y="172" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c53030" text-anchor="middle" font-weight="bold">dL/du = 1.9545</text>
<line x1="55" y1="58" x2="75" y2="97" stroke="#1a202c" marker-end="url(#af)"/>
<text x="55" y="52" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#4a5568" text-anchor="middle" font-weight="normal">w1 = 0.4</text>
<line x1="135" y1="58" x2="115" y2="97" stroke="#1a202c" marker-end="url(#af)"/>
<text x="135" y="52" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#4a5568" text-anchor="middle" font-weight="normal">x = 1.5</text>
<line x1="158" y1="114" x2="201" y2="114" stroke="#1a202c" marker-end="url(#af)"/>
<line x1="201" y1="160" x2="158" y2="160" stroke="#c53030" stroke-dasharray="5 3" marker-end="url(#ab)"/>
<rect x="203" y="98" width="124" height="44" rx="9" fill="#e2e8f0" stroke="#4a5568"/>
<text x="265" y="117" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1a202c" text-anchor="middle" font-weight="normal">h = tanh(u)</text>
<text x="265" y="134" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a202c" text-anchor="middle" font-weight="normal">= 0.5370</text>
<text x="265" y="172" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c53030" text-anchor="middle" font-weight="bold">dL/dh = 2.7467</text>
<line x1="328" y1="114" x2="371" y2="114" stroke="#1a202c" marker-end="url(#af)"/>
<line x1="371" y1="160" x2="328" y2="160" stroke="#c53030" stroke-dasharray="5 3" marker-end="url(#ab)"/>
<rect x="373" y="98" width="124" height="44" rx="9" fill="#e2e8f0" stroke="#4a5568"/>
<text x="435" y="117" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1a202c" text-anchor="middle" font-weight="normal">y = w2 h</text>
<text x="435" y="134" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a202c" text-anchor="middle" font-weight="normal">= 0.6445</text>
<text x="435" y="172" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c53030" text-anchor="middle" font-weight="bold">dL/dy = 2.2889</text>
<line x1="435" y1="58" x2="435" y2="97" stroke="#1a202c" marker-end="url(#af)"/>
<text x="435" y="52" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#4a5568" text-anchor="middle" font-weight="normal">w2 = 1.2</text>
<line x1="498" y1="114" x2="541" y2="114" stroke="#1a202c" marker-end="url(#af)"/>
<line x1="541" y1="160" x2="498" y2="160" stroke="#c53030" stroke-dasharray="5 3" marker-end="url(#ab)"/>
<rect x="543" y="98" width="124" height="44" rx="9" fill="#e2e8f0" stroke="#4a5568"/>
<text x="605" y="117" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1a202c" text-anchor="middle" font-weight="normal">e = y - t</text>
<text x="605" y="134" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a202c" text-anchor="middle" font-weight="normal">= 1.1445</text>
<text x="605" y="172" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c53030" text-anchor="middle" font-weight="bold">dL/de = 2.2889</text>
<line x1="605" y1="58" x2="605" y2="97" stroke="#1a202c" marker-end="url(#af)"/>
<text x="605" y="52" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#4a5568" text-anchor="middle" font-weight="normal">t = -0.5</text>
<line x1="668" y1="114" x2="711" y2="114" stroke="#1a202c" marker-end="url(#af)"/>
<line x1="711" y1="160" x2="668" y2="160" stroke="#c53030" stroke-dasharray="5 3" marker-end="url(#ab)"/>
<rect x="713" y="98" width="124" height="44" rx="9" fill="#e2e8f0" stroke="#4a5568"/>
<text x="775" y="117" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1a202c" text-anchor="middle" font-weight="normal">L = e^2</text>
<text x="775" y="134" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a202c" text-anchor="middle" font-weight="normal">= 1.3098</text>
<text x="775" y="172" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c53030" text-anchor="middle" font-weight="bold">dL/dL = 1.0000</text>
<text x="95" y="200" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c53030" text-anchor="middle" font-weight="normal">dL/dw1 = dL/du * x = 2.9317</text>
<text x="435" y="200" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c53030" text-anchor="middle" font-weight="normal">dL/dw2 = dL/dy * h = 1.2293</text>
<text x="450" y="20" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1a202c" text-anchor="middle" font-weight="bold">Forward values (black, left to right) and gradients of L (red, right to left)</text>
</svg>
