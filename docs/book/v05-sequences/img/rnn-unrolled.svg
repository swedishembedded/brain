<text x="480" y="472.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4a5568" text-anchor="middle">each box contributes d a(t) h(t-1)^T to dW, d a(t) to db and d a(t) to the column u(x(t)); the three terms are added</text>
<text x="480" y="494.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4a5568" text-anchor="middle">forward: black arrows, h(t) from h(t-1) and the token; backward: red arrows, d h(t-1) from d h(t)</text>
