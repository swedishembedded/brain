<text x="340" y="254.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#c53030" text-anchor="middle">dh(t-1) = W^T ((1 - h(t)^2) * dh(t)) at every step</text>
