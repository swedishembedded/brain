<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a202c"/></marker></defs><rect width="1000" height="470" fill="#ffffff"/>
<rect x="10" y="10" width="300" height="450" rx="6" fill="#fbfcfe" stroke="#a0aec0" stroke-width="1"/>
<text x="24" y="32" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a202c">One block, for every token</text>
<ellipse cx="160" cy="85" rx="100" ry="21" fill="#ebf4ff" stroke="#4a5568" stroke-width="1.2"/>
<text x="160" y="89.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">x: 8 Fourier coefficients</text>
<rect x="45" y="142" width="230" height="56" rx="10" fill="#e2e8f0" stroke="#4a5568" stroke-width="1.2"/>
<text x="160" y="166.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">RMSNorm, then causal attention</text>
<text x="160" y="182.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">(reads the other positions)</text>
<ellipse cx="160" cy="255" rx="100" ry="21" fill="#ffffff" stroke="#4a5568" stroke-width="1.2"/>
<text x="160" y="259.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">x + attention</text>
<rect x="45" y="312" width="230" height="56" rx="10" fill="#fefcbf" stroke="#4a5568" stroke-width="1.2"/>
<text x="160" y="336.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">RMSNorm, then spectral mixer</text>
<text x="160" y="352.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">(reads this token only)</text>
<ellipse cx="160" cy="425" rx="100" ry="21" fill="#ebf4ff" stroke="#4a5568" stroke-width="1.2"/>
<text x="160" y="429.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">x + mixer</text>
<line x1="160" y1="109" x2="160" y2="139" stroke="#1a202c" stroke-width="1.4" marker-end="url(#head)"/>
<line x1="160" y1="201" x2="160" y2="231" stroke="#1a202c" stroke-width="1.4" marker-end="url(#head)"/>
<line x1="160" y1="279" x2="160" y2="309" stroke="#1a202c" stroke-width="1.4" marker-end="url(#head)"/>
<line x1="160" y1="371" x2="160" y2="401" stroke="#1a202c" stroke-width="1.4" marker-end="url(#head)"/>
<rect x="325" y="10" width="665" height="450" rx="6" fill="#fbfcfe" stroke="#a0aec0" stroke-width="1"/>
<text x="339" y="32" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a202c">The mixer for one token: the path of one channel, summed over C = 4 channels</text>
<ellipse cx="385" cy="235" rx="40" ry="22" fill="#ebf4ff" stroke="#4a5568" stroke-width="1.2"/>
<text x="385" y="231.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">h</text>
<text x="385" y="247.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">[8]</text>
<rect x="445" y="135" width="110" height="50" rx="10" fill="#e2e8f0" stroke="#4a5568" stroke-width="1.2"/>
<text x="500" y="156.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">G_c * h</text>
<text x="500" y="172.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">[8]</text>
<rect x="445" y="285" width="110" height="50" rx="10" fill="#e2e8f0" stroke="#4a5568" stroke-width="1.2"/>
<text x="500" y="306.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">U_c * h</text>
<text x="500" y="322.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">[8]</text>
<rect x="588" y="135" width="104" height="50" rx="10" fill="#e2e8f0" stroke="#4a5568" stroke-width="1.2"/>
<text x="640" y="156.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">S  (synthesis)</text>
<text x="640" y="172.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">[16]</text>
<rect x="588" y="285" width="104" height="50" rx="10" fill="#e2e8f0" stroke="#4a5568" stroke-width="1.2"/>
<text x="640" y="306.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">S  (synthesis)</text>
<text x="640" y="322.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">[16]</text>
<rect x="719" y="204" width="112" height="62" rx="10" fill="#fefcbf" stroke="#4a5568" stroke-width="1.2"/>
<text x="775" y="231.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">SiLU(a) * b</text>
<text x="775" y="247.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">pointwise [16]</text>
<rect x="855" y="204" width="110" height="62" rx="10" fill="#e2e8f0" stroke="#4a5568" stroke-width="1.2"/>
<text x="910" y="231.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">S^T  (analysis)</text>
<text x="910" y="247.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">[8]</text>
<line x1="425.77" y1="232.1" x2="444.23" y2="162.9" stroke="#1a202c" stroke-width="1.4" marker-end="url(#head)"/>
<line x1="425.77" y1="237.9" x2="444.23" y2="307.1" stroke="#1a202c" stroke-width="1.4" marker-end="url(#head)"/>
<line x1="558" y1="160" x2="585" y2="160" stroke="#1a202c" stroke-width="1.4" marker-end="url(#head)"/>
<line x1="558" y1="310" x2="585" y2="310" stroke="#1a202c" stroke-width="1.4" marker-end="url(#head)"/>
<path d="M692,160 L765,160 Q775,160 775,170 L775,201" fill="none" stroke="#1a202c" stroke-width="1.4" marker-end="url(#head)"/>
<path d="M692,310 L765,310 Q775,310 775,300 L775,269" fill="none" stroke="#1a202c" stroke-width="1.4" marker-end="url(#head)"/>
<text x="715" y="144.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4a5568" text-anchor="middle">a</text>
<text x="715" y="334.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4a5568" text-anchor="middle">b</text>
<line x1="834" y1="235" x2="852" y2="235" stroke="#1a202c" stroke-width="1.4" marker-end="url(#head)"/>
<rect x="855" y="317" width="110" height="56" rx="10" fill="#e2e8f0" stroke="#4a5568" stroke-width="1.2"/>
<text x="910" y="341.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">W_c * t</text>
<text x="910" y="357.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">summed over c</text>
<ellipse cx="910" cy="425" rx="40" ry="18" fill="#ebf4ff" stroke="#4a5568" stroke-width="1.2"/>
<text x="910" y="429.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">y [8]</text>
<line x1="910" y1="269" x2="910" y2="314" stroke="#1a202c" stroke-width="1.4" marker-end="url(#head)"/>
<line x1="910" y1="376" x2="910" y2="404" stroke="#1a202c" stroke-width="1.4" marker-end="url(#head)"/>
<text x="600" y="399.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4a5568" text-anchor="middle">The product is taken sample by sample in the signal domain, where it couples frequencies;</text>
<text x="600" y="418.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4a5568" text-anchor="middle">the filters act mode by mode in the coefficient domain, where they cannot.</text>
<text x="600" y="444.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4a5568" text-anchor="middle">12 transforms per token (two S and one S^T for each of the 4 channels), dense or FFT</text>
</svg>
