<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 402" width="780" height="402"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a202c"/></marker></defs><rect width="780" height="402" fill="#ffffff"/>
<rect x="20" y="16" width="740" height="176" rx="6" fill="#fbfcfe" stroke="#a0aec0" stroke-width="1"/>
<text x="34" y="38" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a202c">Parallel form: all tokens at once</text>
<rect x="37" y="67" width="120" height="62" rx="10" fill="#ebf4ff" stroke="#4a5568" stroke-width="1.2"/>
<text x="97" y="94.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">Q, K</text>
<text x="97" y="110.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">[T, d_k]</text>
<rect x="182" y="67" width="120" height="62" rx="10" fill="#e2e8f0" stroke="#4a5568" stroke-width="1.2"/>
<text x="242" y="94.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">scores Q K^T</text>
<text x="242" y="110.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">[T, T]</text>
<rect x="327" y="67" width="120" height="62" rx="10" fill="#e2e8f0" stroke="#4a5568" stroke-width="1.2"/>
<text x="387" y="94.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">causal mask</text>
<text x="387" y="110.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">no softmax</text>
<rect x="472" y="67" width="120" height="62" rx="10" fill="#e2e8f0" stroke="#4a5568" stroke-width="1.2"/>
<text x="532" y="94.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">times V</text>
<text x="532" y="110.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">[T, d_v]</text>
<rect x="617" y="67" width="120" height="62" rx="10" fill="#fefcbf" stroke="#4a5568" stroke-width="1.2"/>
<text x="677" y="94.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">O</text>
<text x="677" y="110.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">[T, d_v]</text>
<line x1="160" y1="98" x2="179" y2="98" stroke="#1a202c" stroke-width="1.4" marker-end="url(#head)"/>
<line x1="305" y1="98" x2="324" y2="98" stroke="#1a202c" stroke-width="1.4" marker-end="url(#head)"/>
<line x1="450" y1="98" x2="469" y2="98" stroke="#1a202c" stroke-width="1.4" marker-end="url(#head)"/>
<line x1="595" y1="98" x2="614" y2="98" stroke="#1a202c" stroke-width="1.4" marker-end="url(#head)"/>
<text x="390" y="172.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4a5568" text-anchor="middle">T = 64, d_k = d_v = 8: 33,280 multiply-adds; the T x T matrix grows with the square of T</text>
<rect x="20" y="210" width="740" height="176" rx="6" fill="#fbfcfe" stroke="#a0aec0" stroke-width="1"/>
<text x="34" y="232" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a202c">Recurrent form: one token at a time</text>
<ellipse cx="97" cy="292" rx="60" ry="31" fill="#ebf4ff" stroke="#4a5568" stroke-width="1.2"/>
<text x="97" y="288.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">S(t-1)</text>
<text x="97" y="304.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">[d_k, d_v]</text>
<rect x="182" y="261" width="120" height="62" rx="10" fill="#e2e8f0" stroke="#4a5568" stroke-width="1.2"/>
<text x="242" y="288.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">write</text>
<text x="242" y="304.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">+ k(t) v(t)^T</text>
<ellipse cx="387" cy="292" rx="60" ry="31" fill="#ebf4ff" stroke="#4a5568" stroke-width="1.2"/>
<text x="387" y="288.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">S(t)</text>
<text x="387" y="304.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">[d_k, d_v]</text>
<rect x="472" y="261" width="120" height="62" rx="10" fill="#e2e8f0" stroke="#4a5568" stroke-width="1.2"/>
<text x="532" y="288.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">read</text>
<text x="532" y="304.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">S(t)^T q(t)</text>
<ellipse cx="677" cy="292" rx="60" ry="31" fill="#fefcbf" stroke="#4a5568" stroke-width="1.2"/>
<text x="677" y="288.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">o(t)</text>
<text x="677" y="304.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">[d_v]</text>
<line x1="160" y1="292" x2="179" y2="292" stroke="#1a202c" stroke-width="1.4" marker-end="url(#head)"/>
<line x1="305" y1="292" x2="324" y2="292" stroke="#1a202c" stroke-width="1.4" marker-end="url(#head)"/>
<line x1="450" y1="292" x2="469" y2="292" stroke="#1a202c" stroke-width="1.4" marker-end="url(#head)"/>
<line x1="595" y1="292" x2="614" y2="292" stroke="#1a202c" stroke-width="1.4" marker-end="url(#head)"/>
<path d="M387,261 L387,261 Q387,256 382,256 L99,256 Q97,256 97,258 L97,258" fill="none" stroke="#1a202c" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#head)"/>
<text x="242" y="252.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4a5568" text-anchor="middle">S(t) becomes S(t-1) of the next token</text>
<text x="390" y="366.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4a5568" text-anchor="middle">same T and widths: 8,192 multiply-adds; the state does not grow with T</text>
</svg>
