<rect x="35" y="29" width="150" height="66" rx="10" fill="#ffffff" stroke="#4a5568" stroke-width="1.2"/>
<text x="110" y="58.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">batch rows x_i</text>
<text x="110" y="74.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">6 rows, 32 numbers</text>
