<text x="340" y="66.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">round(master)</text>
<text x="340" y="82.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">bf16 or fp8</text>
<rect x="485" y="31" width="170" height="62" rx="10" fill="#e2e8f0" stroke="#4a5568" stroke-width="1.2"/>
<text x="570" y="50.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">forward, backward</text>
<text x="570" y="66.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">on the loss S x L</text>
<text x="570" y="82.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">narrow products</text>
<rect x="715" y="31" width="170" height="62" rx="10" fill="#e2e8f0" stroke="#4a5568" stroke-width="1.2"/>
<text x="800" y="50.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">scaled gradient</text>
<text x="800" y="66.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">S x g</text>
<text x="800" y="82.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">narrow format</text>
<rect x="715" y="169" width="170" height="62" rx="10" fill="#ebf4ff" stroke="#4a5568" stroke-width="1.2"/>
<text x="800" y="188.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">unscale</text>
<text x="800" y="204.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">g = (S x g) / S</text>
<text x="800" y="220.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">fp32, finite?</text>
<rect x="485" y="169" width="170" height="62" rx="10" fill="#e2e8f0" stroke="#4a5568" stroke-width="1.2"/>
<text x="570" y="188.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">clip</text>
<text x="570" y="204.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">by the global norm</text>
<text x="570" y="220.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">fp32</text>
<rect x="255" y="169" width="170" height="62" rx="10" fill="#ebf4ff" stroke="#4a5568" stroke-width="1.2"/>
<text x="340" y="188.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">optimizer rule</text>
<text x="340" y="204.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">on the master</text>
<text x="340" y="220.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">fp32 arithmetic</text>
<ellipse cx="800" cy="316" rx="85" ry="22" fill="#fefcbf" stroke="#4a5568" stroke-width="1.2"/>
<text x="800" y="312.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">not finite: skip the step</text>
<text x="800" y="328.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">S = S / 2</text>
