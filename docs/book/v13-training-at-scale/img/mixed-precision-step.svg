<line x1="712" y1="200" x2="658" y2="200" stroke="#1a202c" stroke-width="1.4" marker-end="url(#head)"/>
<text x="685" y="191.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4a5568" text-anchor="middle">finite</text>
<line x1="482" y1="200" x2="428" y2="200" stroke="#1a202c" stroke-width="1.4" marker-end="url(#head)"/>
<text x="455" y="191.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4a5568" text-anchor="middle">g</text>
<line x1="252" y1="200" x2="198" y2="200" stroke="#1a202c" stroke-width="1.4" marker-end="url(#head)"/>
<line x1="800" y1="234" x2="800" y2="291" stroke="#1a202c" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#head)"/>
<text x="320" y="318.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4a5568" text-anchor="middle">every update lands on the master;</text>
<text x="320" y="334.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4a5568" text-anchor="middle">the working copy is rebuilt from it</text>
</svg>
