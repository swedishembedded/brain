<text x="350" y="232.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4a5568" text-anchor="middle">the gap between the neighbours is 0.0078125; the mean of the result is 1 + 0.128 x 0.0078125 = x,</text>
