<text x="380" y="254.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">f4</text>
<text x="380" y="270.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">c = log(b + 1)</text>
<ellipse cx="630" cy="258" rx="85" ry="29" fill="#fefcbf" stroke="#4a5568" stroke-width="1.2"/>
