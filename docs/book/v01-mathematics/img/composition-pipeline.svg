<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 308" width="760" height="308"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a202c"/></marker></defs><rect width="760" height="308" fill="#ffffff"/>
<ellipse cx="130" cy="50" rx="85" ry="29" fill="#ffffff" stroke="#4a5568" stroke-width="1.2"/>
<text x="130" y="46.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">x</text>
<text x="130" y="62.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">any real</text>
<rect x="295" y="21" width="170" height="58" rx="10" fill="#e2e8f0" stroke="#4a5568" stroke-width="1.2"/>
<text x="380" y="46.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">f1</text>
<text x="380" y="62.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">a = 3x - 2</text>
<ellipse cx="630" cy="50" rx="85" ry="29" fill="#ffffff" stroke="#4a5568" stroke-width="1.2"/>
<text x="630" y="46.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">a</text>
<text x="630" y="62.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">any real</text>
<rect x="545" y="125" width="170" height="58" rx="10" fill="#e2e8f0" stroke="#4a5568" stroke-width="1.2"/>
<text x="630" y="150.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">f2</text>
<text x="630" y="166.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">b = a^2</text>
<ellipse cx="380" cy="154" rx="85" ry="29" fill="#ffffff" stroke="#4a5568" stroke-width="1.2"/>
<text x="380" y="150.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">b</text>
<text x="380" y="166.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">b &gt;= 0</text>
<rect x="45" y="125" width="170" height="58" rx="10" fill="#e2e8f0" stroke="#4a5568" stroke-width="1.2"/>
<text x="130" y="150.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">f3</text>
<text x="130" y="166.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">b + 1</text>
<ellipse cx="130" cy="258" rx="85" ry="29" fill="#ffffff" stroke="#4a5568" stroke-width="1.2"/>
<text x="130" y="254.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">b + 1</text>
<text x="130" y="270.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">b + 1 &gt;= 1</text>
