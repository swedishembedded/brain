<text x="480" y="250.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4a5568" text-anchor="middle">P&lt;k&gt; is projector row k (the encoder numbers the global view first, then the tiles); the small number below a cell is its row of the block.</text>
<text x="480" y="266.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4a5568" text-anchor="middle">Rows 0 to 3 read tile 0 and tile 1 side by side along the first row of the mosaic; the newline ends the mosaic row,</text>
