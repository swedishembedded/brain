<text x="470" y="390.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4a5568" text-anchor="middle">Every frame before 12 also lends an object pointer (12 pointers). Slot 6 is the previous frame, slot 1 six frames back; the prompted frame is always read, as slot 0.</text>
