<text x="480" y="420.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#c53030" text-anchor="middle">gradient of the picture rows returns to the projector and the tower;</text>
<text x="480" y="436.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#c53030" text-anchor="middle">the same rows are zeroed on the way to the embedding table</text>
<text x="480" y="462.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4a5568" text-anchor="middle">The placeholder row of the table is read by the gather and overwritten by the splice,</text>
<text x="480" y="478.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4a5568" text-anchor="middle">so its value never reaches the decoder and its row in the table receives no gradient.</text>
</svg>
