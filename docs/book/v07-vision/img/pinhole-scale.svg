<!-- source-sha256: f736fc7ebef6124f46f0fbdeb8b0b3a3f1aa6a23ef9c1edbafc72d9da2a13936 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a202c"/></marker></defs><rect width="760" height="320" fill="#ffffff"/>
<text x="380" y="30.9" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a202c" text-anchor="middle">Two boxes, one picture</text>
<line x1="70" y1="250" x2="730" y2="250" stroke="#a0aec0" stroke-width="1.5"/>
<text x="730" y="276.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4a5568" text-anchor="end">ground</text>
<line x1="140" y1="120" x2="140" y2="250" stroke="#1a202c" stroke-width="2"/>
<text x="140" y="110.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1a202c" text-anchor="middle">image plane</text>
<circle cx="70" cy="250" r="4" fill="#1a202c"/>
<text x="70" y="278.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1a202c" text-anchor="middle">camera</text>
<line x1="260" y1="250" x2="260" y2="175" stroke="#2b6cb0" stroke-width="5"/>
<text x="260" y="270.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#2b6cb0" text-anchor="middle">Z = 1 m</text>
<text x="260" y="286.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#2b6cb0" text-anchor="middle">0.75 m tall</text>
<line x1="450" y1="250" x2="450" y2="100" stroke="#c05621" stroke-width="5"/>
<text x="450" y="270.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#c05621" text-anchor="middle">Z = 2 m</text>
<text x="450" y="286.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#c05621" text-anchor="middle">1.5 m tall</text>
<line x1="70" y1="250" x2="450" y2="100" stroke="#c53030" stroke-width="1.5" stroke-dasharray="6 4"/>
<circle cx="140" cy="222.37" r="4" fill="#c53030"/>
<text x="130" y="200.57" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#c53030" text-anchor="end">the tops of both</text>
<text x="130" y="216.57" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#c53030" text-anchor="end">boxes land here</text>
<text x="470" y="94.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a202c" text-anchor="start">Pinhole projection, focal length f = 4 pixels:</text>
<text x="470" y="118.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="start">image height = f x height / depth</text>
<text x="470" y="142.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="start">near box:  4 x 0.75 / 1 = 3 pixels</text>
<text x="470" y="166.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="start">far box:   4 x 1.5 / 2 = 3 pixels</text>
<text x="470" y="190.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#4a5568" text-anchor="start">Both tops lie on the dashed ray, so the</text>
<text x="470" y="214.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#4a5568" text-anchor="start">image cannot tell the two worlds apart.</text>
</svg>
