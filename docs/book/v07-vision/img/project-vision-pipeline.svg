<text x="470" y="406.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4a5568" text-anchor="middle">The detector reads the letterboxed view and the segmenter reads the stretched one: the same frame in two coordinate systems,</text>
