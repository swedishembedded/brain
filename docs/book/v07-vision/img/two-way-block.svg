<text x="230" y="124.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">self-attention</text>
<text x="230" y="140.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">tokens read tokens</text>
<rect x="120" y="194" width="220" height="56" rx="10" fill="#e2e8f0" stroke="#4a5568" stroke-width="1.2"/>
<text x="230" y="218.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">token-to-image attention</text>
<text x="230" y="234.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">queries: tokens; keys, values: cells</text>
<rect x="120" y="288" width="220" height="56" rx="10" fill="#e2e8f0" stroke="#4a5568" stroke-width="1.2"/>
<text x="230" y="312.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">MLP</text>
<text x="230" y="328.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">256 -&gt; 2,048 -&gt; 256</text>
<rect x="560" y="288" width="220" height="56" rx="10" fill="#e2e8f0" stroke="#4a5568" stroke-width="1.2"/>
<text x="670" y="312.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">image-to-token attention</text>
<text x="670" y="328.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">queries: cells; keys, values: tokens</text>
<ellipse cx="230" cy="450" rx="95" ry="26" fill="#fefcbf" stroke="#4a5568" stroke-width="1.2"/>
<text x="230" y="446.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">tokens out</text>
<text x="230" y="462.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">8 x 256</text>
<ellipse cx="670" cy="450" rx="95" ry="26" fill="#fefcbf" stroke="#4a5568" stroke-width="1.2"/>
<text x="670" y="446.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">image cells out</text>
<text x="670" y="462.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">4,096 x 256</text>
<line x1="230" y1="73" x2="230" y2="97" stroke="#1a202c" stroke-width="1.4" marker-end="url(#head)"/>
