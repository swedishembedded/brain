<path d="M670,70 L670,214 Q670,222 662,222 L343,222" fill="none" stroke="#1a202c" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#head)"/>
<text x="450" y="212.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4a5568" text-anchor="middle">keys and values</text>
<line x1="670" y1="73" x2="670" y2="285" stroke="#1a202c" stroke-width="1.4" marker-end="url(#head)"/>
<line x1="343" y1="316" x2="557" y2="316" stroke="#1a202c" stroke-width="1.4" marker-end="url(#head)"/>
<text x="450" y="307.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4a5568" text-anchor="middle">keys and values</text>
<line x1="230" y1="347" x2="230" y2="421" stroke="#1a202c" stroke-width="1.4" marker-end="url(#head)"/>
<line x1="670" y1="347" x2="670" y2="421" stroke="#1a202c" stroke-width="1.4" marker-end="url(#head)"/>
<text x="244" y="384.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4a5568" text-anchor="start">LayerNorm after each step,</text>
<text x="244" y="400.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4a5568" text-anchor="start">a residual add around each</text>
<text x="684" y="392.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4a5568" text-anchor="start">the same, on the 4,096 cells</text>
<text x="450" y="492.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4a5568" text-anchor="middle">Two such layers, then one more token-to-image attention; the tokens that leave are the ones that make masks.</text>
</svg>
