<text x="587.5" y="241.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4a5568" text-anchor="middle">tokens</text>
<path d="M375,280 L388.15,323.85 Q390,330 398,330 L682,330 Q690,330 690,322 L690,301" fill="none" stroke="#1a202c" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#head)"/>
<text x="640" y="350.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4a5568" text-anchor="middle">the stored embedding is read again for every prompt</text>
<line x1="773" y1="250" x2="802" y2="250" stroke="#1a202c" stroke-width="1.4" marker-end="url(#head)"/>
<text x="470" y="404.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4a5568" text-anchor="middle">16 MiB of features per image are kept in 32-bit numbers; one click costs 0.20 percent of the encoder&#x27;s FLOPs.</text>
</svg>
