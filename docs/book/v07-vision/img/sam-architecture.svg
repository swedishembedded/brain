<text x="490" y="132.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">points, box, mask</text>
<rect x="415" y="202" width="150" height="96" rx="10" fill="#e2e8f0" stroke="#4a5568" stroke-width="1.2"/>
<text x="490" y="238.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">prompt encoder</text>
<text x="490" y="254.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">Fourier features</text>
<text x="490" y="270.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">+ type embeddings</text>
<rect x="610" y="202" width="160" height="96" rx="10" fill="#e2e8f0" stroke="#4a5568" stroke-width="1.2"/>
<text x="690" y="238.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">mask decoder</text>
