<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 412" width="940" height="412"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a202c"/></marker></defs><rect width="940" height="412" fill="#ffffff"/>
<rect x="14" y="14" width="372" height="372" rx="6" fill="#fbfcfe" stroke="#a0aec0" stroke-width="1"/>
<text x="28" y="36" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a202c">once per image</text>
<rect x="402" y="14" width="524" height="372" rx="6" fill="#fbfcfe" stroke="#a0aec0" stroke-width="1"/>
<text x="416" y="36" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a202c">once per prompt</text>
