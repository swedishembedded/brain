<text x="300" y="238.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">image embedding</text>
<text x="300" y="254.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">256 x 64 x 64</text>
<text x="300" y="270.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">+ 2 finer maps</text>
<ellipse cx="490" cy="120" rx="75" ry="28" fill="#ebf4ff" stroke="#4a5568" stroke-width="1.2"/>
