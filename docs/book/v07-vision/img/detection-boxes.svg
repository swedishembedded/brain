<text x="420" y="104.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#4a5568" text-anchor="start">overlap width  min(10, 11) - max(2, 3) = 7</text>
<text x="420" y="130.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#4a5568" text-anchor="start">overlap height min(11, 12) - max(3, 4) = 7</text>
<text x="420" y="156.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#4a5568" text-anchor="start">intersection   7 x 7 = 49</text>
<text x="420" y="182.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#4a5568" text-anchor="start">area of a      8 x 8 = 64</text>
<text x="420" y="208.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#4a5568" text-anchor="start">area of the prediction  8 x 8 = 64</text>
<text x="420" y="234.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#4a5568" text-anchor="start">union          64 + 64 - 49 = 79</text>
<text x="420" y="260.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a202c" text-anchor="start">IoU            49 / 79 = 0.6203</text>
<text x="420" y="298.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4a5568" text-anchor="start">Shaded: the overlap. Solid outlines: the</text>
<text x="420" y="314.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4a5568" text-anchor="start">ground-truth boxes. Dashed: the prediction.</text>
