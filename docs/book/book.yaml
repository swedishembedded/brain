        introduces: [bernoulli-distribution, categorical-distribution, gaussian-distribution, multivariate-gaussian, law-of-large-numbers, central-limit-theorem, covariance]
        requires: [probability-distribution, expectation, variance, independence, integral, exponential-function, vector, cosine-similarity, matrix, matrix-multiplication, eigenvector, eigenvalue]
