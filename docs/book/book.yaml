        introduces: [determinant, eigenvalue, eigenvector, orthogonal-matrix, rotation-matrix, singular-value-decomposition, low-rank-approximation]
        requires: [matrix-multiplication, transpose, matrix-inverse, rank, norm, orthogonality]
        brain: []
      - id: derivatives
        title: "Derivatives: The Mathematics of Change"
        question: "How do we measure how fast a function's output changes when its input moves a tiny bit?"
        introduces: [limit, derivative, differentiation-rules, chain-rule, critical-point, convexity, newtons-method]
        requires: [function, composition, polynomial, exponential-function]
        brain: []
      - id: multivariable-calculus
        title: "Gradients, Jacobians and Many Variables"
        question: "When a quantity depends on millions of numbers, which way should we move them all to make it smaller?"
        introduces: [partial-derivative, gradient, directional-derivative, jacobian, hessian, taylor-expansion, multivariable-chain-rule, condition-number]
        requires: [derivative, chain-rule, vector, matrix, dot-product, eigenvalue]
        brain: []
      - id: integrals-and-odes
        title: "Integrals and Differential Equations"
        question: "How do we add up infinitely many small pieces, and how do we follow a system that changes continuously?"
        introduces: [integral, fundamental-theorem-of-calculus, ordinary-differential-equation, euler-method, numerical-integration]
        requires: [derivative, limit, summation-notation, gradient]
        brain: []
      - id: probability
        title: "Probability: Reasoning Under Uncertainty"
