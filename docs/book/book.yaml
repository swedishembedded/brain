        introduces: [tensor, shape, row-major-layout, stride, broadcasting, reshape-and-view, batch-dimension]
        requires: [matrix, vector]
        brain: []
      - id: decompositions
        title: "Eigenvalues, Rotations and Low-Rank Structure"
