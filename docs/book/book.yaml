#
# The specification of the book: every volume and chapter in reading order,
# the concepts each chapter introduces, the concepts it relies on, and the
# brain crates it explains. `scripts/book/check.py` holds the book to it:
#
#   - a concept is introduced by exactly one chapter;
#   - a chapter only requires concepts introduced by an earlier chapter (or
#     earlier in its own `introduces` list), so the reading order is a valid
#     topological order of the concept graph;
#   - every crate under crates/ is explained by at least one chapter;
#   - a chapter file, once written, sits at <volume dir>/<NN>-<chapter id>.md.
#
# A chapter listed here but not yet written is planned work; which chapters
# are written is tracked in the book ledger, not here. The book's navigation
# (the PDF and the published docs) contains only the chapters that exist.
#
# Fields:
#   question    the question the chapter answers, in the reader's words
#   introduces  concept ids defined here (kebab-case, unique book-wide)
#   requires    concept ids the chapter builds on
#   brain       crates under crates/ whose implementation the chapter explains

title: "From First Principles to Intelligent Machines"
subtitle: "The mathematics, algorithms and engineering of machine learning, told through the building of brain"
author: "Martin Schröder"
author_email: "martin.schroder@swedishembedded.com"

front:
  - preface.md
  - how-to-read.md
  - notation.md
  - pseudocode.md

back:
  - glossary.md
  - history/chronology.md
  - about-the-author.md

volumes:
  - id: v01
    dir: v01-mathematics
    title: "Thinking in Mathematics"
    chapters:
      - id: numbers
        title: "Numbers, Quantities and Notation"
        question: "What are the numbers a machine learns with, and how do we write about them precisely?"
        introduces: [integer, real-number, exponent, logarithm, summation-notation, product-notation, set, function-notation]
        requires: []
        brain: []
      - id: functions
        title: "Functions and Their Shapes"
        question: "How do we describe a rule that turns inputs into outputs, and what shapes can such rules take?"
        introduces: [function, composition, inverse-function, polynomial, exponential-function, monotonic-function, piecewise-function]
        requires: [real-number, exponent, logarithm, function-notation]
        brain: []
      - id: vectors
        title: "Vectors: Lists of Numbers with Geometry"
        question: "How can a list of numbers have a length and a direction, and how do we measure how alike two lists are?"
        introduces: [vector, vector-addition, scalar-multiplication, dot-product, norm, cosine-similarity, orthogonality, projection]
        requires: [real-number, summation-notation]
        brain: []
      - id: matrices
