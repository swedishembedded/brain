<text x="130" y="388.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1a202c" text-anchor="start">bytes 16..47: low nibbles are weights 0..31 (sub-block 0), high nibbles weights 32..63 (sub-block 1);</text>
<text x="130" y="406.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1a202c" text-anchor="start">bytes 48..143: the same pattern for weights 64..127, 128..191 and 192..255 (sub-blocks 2 to 7);</text>
<text x="130" y="424.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1a202c" text-anchor="start">weight i of sub-block j = i // 32 decodes to d sc_j q - dmin m_j.</text>
