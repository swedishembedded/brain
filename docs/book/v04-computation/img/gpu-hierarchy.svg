<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 484" width="780" height="484"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a202c"/></marker></defs><rect width="780" height="484" fill="#ffffff"/>
<rect x="20" y="14" width="740" height="118" rx="6" fill="#fbfcfe" stroke="#a0aec0" stroke-width="1"/>
<text x="34" y="36" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a202c">Dispatch grid: n = 1000 elements, 16 workgroups of 64 invocations</text>
<rect x="36" y="65" width="118" height="50" rx="10" fill="#e2e8f0" stroke="#4a5568" stroke-width="1.2"/>
<text x="95" y="86.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">workgroup 0</text>
<text x="95" y="102.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">global 0 - 63</text>
<rect x="176" y="65" width="118" height="50" rx="10" fill="#e2e8f0" stroke="#4a5568" stroke-width="1.2"/>
<text x="235" y="86.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">workgroup 1</text>
<text x="235" y="102.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">global 64 - 127</text>
<rect x="316" y="65" width="118" height="50" rx="10" fill="#e2e8f0" stroke="#4a5568" stroke-width="1.2"/>
<text x="375" y="86.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">workgroup 2</text>
<text x="375" y="102.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">global 128 - 191</text>
<text x="515" y="96.3" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="normal" fill="#4a5568" text-anchor="middle">...</text>
<rect x="626" y="65" width="118" height="50" rx="10" fill="#ebf4ff" stroke="#4a5568" stroke-width="1.2"/>
<text x="685" y="86.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">workgroup 15</text>
<text x="685" y="102.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">global 960 - 1023</text>
<rect x="20" y="166" width="740" height="152" rx="6" fill="#fbfcfe" stroke="#a0aec0" stroke-width="1"/>
<text x="34" y="188" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a202c">One workgroup (workgroup 15): 64 invocations on one compute unit</text>
<rect x="70" y="208" width="640" height="32" rx="10" fill="#fefcbf" stroke="#4a5568" stroke-width="1.2"/>
<text x="390" y="228.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">shared memory: every invocation of this workgroup reads and writes it; a barrier orders them</text>
<rect x="75" y="256" width="280" height="40" rx="10" fill="#e2e8f0" stroke="#4a5568" stroke-width="1.2"/>
<text x="215" y="280.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">subgroup 0: invocations 960 - 991</text>
<rect x="425" y="256" width="280" height="40" rx="10" fill="#ebf4ff" stroke="#4a5568" stroke-width="1.2"/>
<text x="565" y="280.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">subgroup 1: invocations 992 - 1023</text>
<line x1="685" y1="118" x2="685" y2="162" stroke="#1a202c" stroke-width="1.4" marker-end="url(#head)"/>
<rect x="20" y="352" width="740" height="118" rx="6" fill="#fbfcfe" stroke="#a0aec0" stroke-width="1"/>
<text x="34" y="374" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a202c">One subgroup (subgroup 1): 32 lanes execute each instruction together</text>
<rect x="36" y="393" width="118" height="50" rx="10" fill="#ffffff" stroke="#4a5568" stroke-width="1.2"/>
<text x="95" y="414.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">lane 0</text>
<text x="95" y="430.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">invocation 992</text>
<rect x="176" y="393" width="118" height="50" rx="10" fill="#ffffff" stroke="#4a5568" stroke-width="1.2"/>
<text x="235" y="414.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">lane 1</text>
<text x="235" y="430.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">invocation 993</text>
<rect x="316" y="393" width="118" height="50" rx="10" fill="#ffffff" stroke="#4a5568" stroke-width="1.2"/>
<text x="375" y="414.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">lane 2</text>
<text x="375" y="430.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">invocation 994</text>
<text x="515" y="424.3" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="normal" fill="#4a5568" text-anchor="middle">...</text>
<rect x="626" y="393" width="118" height="50" rx="10" fill="#ffffff" stroke="#4a5568" stroke-width="1.2"/>
<text x="685" y="414.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">lane 31</text>
<text x="685" y="430.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">invocation 1023</text>
<text x="390" y="461.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4a5568" text-anchor="middle">each invocation has its own registers; in one instruction all lanes do the same operation</text>
<line x1="565" y1="299" x2="565" y2="348" stroke="#1a202c" stroke-width="1.4" marker-end="url(#head)"/>
</svg>
