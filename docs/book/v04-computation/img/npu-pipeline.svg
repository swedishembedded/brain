<!-- source-sha256: e32979a715e5e7d9818490377396230e281ff72c09fac914fbf996edd56d793f -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 244" width="860" height="244"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a202c"/></marker></defs><rect width="860" height="244" fill="#ffffff"/>
<rect x="20" y="14" width="820" height="216" rx="6" fill="#fbfcfe" stroke="#a0aec0" stroke-width="1"/>
<text x="34" y="36" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a202c">One network, five forms</text>
<rect x="30" y="61" width="120" height="78" rx="10" fill="#ffffff" stroke="#4a5568" stroke-width="1.2"/>
<text x="90" y="88.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">model</text>
<text x="90" y="104.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">float weights</text>
<text x="90" y="120.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">and the code</text>
<rect x="200" y="61" width="120" height="78" rx="10" fill="#e2e8f0" stroke="#4a5568" stroke-width="1.2"/>
<text x="260" y="88.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">exported graph</text>
<text x="260" y="104.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">static shapes</text>
<text x="260" y="120.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">172 B of f32</text>
<rect x="370" y="61" width="120" height="78" rx="10" fill="#e2e8f0" stroke="#4a5568" stroke-width="1.2"/>
<text x="430" y="88.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">quantized graph</text>
<text x="430" y="104.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">int8 and int32</text>
<text x="430" y="120.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">85 B + ranges</text>
<rect x="540" y="61" width="120" height="78" rx="10" fill="#ebf4ff" stroke="#4a5568" stroke-width="1.2"/>
<text x="600" y="88.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">command stream</text>
<text x="600" y="104.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">2 tasks of 1,088 B</text>
<text x="600" y="120.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">2,176 B</text>
<rect x="710" y="61" width="120" height="78" rx="10" fill="#fefcbf" stroke="#4a5568" stroke-width="1.2"/>
<text x="770" y="88.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">device</text>
<text x="770" y="104.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">runs the stream</text>
<text x="770" y="120.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">with no host code</text>
<line x1="153" y1="100" x2="197" y2="100" stroke="#1a202c" stroke-width="1.4" marker-end="url(#head)"/>
<text x="175" y="91.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4a5568" text-anchor="middle">export</text>
<line x1="323" y1="100" x2="367" y2="100" stroke="#1a202c" stroke-width="1.4" marker-end="url(#head)"/>
<text x="345" y="91.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4a5568" text-anchor="middle">quantize</text>
<line x1="493" y1="100" x2="537" y2="100" stroke="#1a202c" stroke-width="1.4" marker-end="url(#head)"/>
<text x="515" y="91.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4a5568" text-anchor="middle">compile</text>
<line x1="663" y1="100" x2="707" y2="100" stroke="#1a202c" stroke-width="1.4" marker-end="url(#head)"/>
<text x="685" y="91.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4a5568" text-anchor="middle">submit</text>
<text x="40" y="164.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4a5568" text-anchor="start">decided at this stage:</text>
<text x="90" y="200.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1a202c" text-anchor="middle">nothing yet</text>
<text x="260" y="192.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1a202c" text-anchor="middle">operators,</text>
<text x="260" y="208.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1a202c" text-anchor="middle">order, shapes</text>
<text x="430" y="192.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1a202c" text-anchor="middle">ranges, scales,</text>
<text x="430" y="208.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1a202c" text-anchor="middle">zero points, codes</text>
<text x="600" y="192.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1a202c" text-anchor="middle">fusion, tiles,</text>
<text x="600" y="208.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1a202c" text-anchor="middle">addresses, words</text>
<text x="770" y="192.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1a202c" text-anchor="middle">only the values</text>
<text x="770" y="208.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1a202c" text-anchor="middle">of the input</text>
</svg>
