<!-- source-sha256: 3b86ed6e324567751e141841cbedd448afc1ce3547550b27fd799d978cc3de1c -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a202c"/></marker></defs><rect width="1000" height="330" fill="#ffffff"/>
<rect x="25" y="110" width="170" height="80" rx="10" fill="#ffffff" stroke="#4a5568" stroke-width="1.2"/>
<text x="110" y="138.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">mapped file</text>
<text x="110" y="154.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">bf16 tensor,</text>
<text x="110" y="170.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">16 MiB</text>
<rect x="215" y="26" width="230" height="56" rx="10" fill="#fefcbf" stroke="#4a5568" stroke-width="1.2"/>
<text x="330" y="50.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">budget: one lease for the</text>
<text x="330" y="66.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">whole load, sized for one tile</text>
<rect x="235" y="110" width="190" height="80" rx="10" fill="#ebf4ff" stroke="#4a5568" stroke-width="1.2"/>
<text x="330" y="138.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">read tile k</text>
<text x="330" y="154.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">18,048 elements</text>
<text x="330" y="170.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">of 465 tiles</text>
<rect x="495" y="110" width="170" height="80" rx="10" fill="#e2e8f0" stroke="#4a5568" stroke-width="1.2"/>
<text x="580" y="138.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">convert</text>
<text x="580" y="154.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">decode to f32,</text>
<text x="580" y="170.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">encode to nf4</text>
<rect x="725" y="110" width="170" height="80" rx="10" fill="#ffffff" stroke="#4a5568" stroke-width="1.2"/>
<text x="810" y="138.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">sink</text>
<text x="810" y="154.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">write tile k,</text>
<text x="810" y="170.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">finish or abort</text>
<rect x="715" y="232" width="190" height="56" rx="10" fill="#ffffff" stroke="#4a5568" stroke-width="1.2"/>
<text x="810" y="256.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">release tile k&#x27;s</text>
<text x="810" y="272.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">file pages</text>
<line x1="198" y1="150" x2="232" y2="150" stroke="#1a202c" stroke-width="1.4" marker-end="url(#head)"/>
<line x1="330" y1="85" x2="330" y2="107" stroke="#1a202c" stroke-width="1.4" marker-end="url(#head)"/>
<text x="339" y="100.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4a5568" text-anchor="start">130,848 bytes</text>
<line x1="428" y1="150" x2="492" y2="150" stroke="#1a202c" stroke-width="1.4" marker-end="url(#head)"/>
<line x1="668" y1="150" x2="722" y2="150" stroke="#1a202c" stroke-width="1.4" marker-end="url(#head)"/>
<line x1="810" y1="193" x2="810" y2="229" stroke="#1a202c" stroke-width="1.4" marker-end="url(#head)"/>
<path d="M715,260 L120,260 Q110,260 110,250 L110,193" fill="none" stroke="#1a202c" stroke-width="1.4" marker-end="url(#head)"/>
<text x="470" y="304.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4a5568" text-anchor="middle">tile k + 1 reuses the same buffers; the lease is returned when the load ends, on failure too</text>
</svg>
