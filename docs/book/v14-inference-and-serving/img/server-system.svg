<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a202c"/></marker></defs><rect width="1000" height="330" fill="#ffffff"/>
<rect x="20" y="77" width="150" height="66" rx="10" fill="#ffffff" stroke="#4a5568" stroke-width="1.2"/>
<text x="95" y="106.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">message from</text>
<text x="95" y="122.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">a client</text>
<rect x="205" y="77" width="170" height="66" rx="10" fill="#e2e8f0" stroke="#4a5568" stroke-width="1.2"/>
