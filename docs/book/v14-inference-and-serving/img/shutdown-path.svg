<!-- source-sha256: 4564489e2f575b1806a8f07c8879d3121e133b2f36aa6e9b946107e8a06cd265 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a202c"/></marker><marker id="head-c53030" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c53030"/></marker></defs><rect width="1000" height="380" fill="#ffffff"/>
<rect x="20" y="107" width="130" height="66" rx="10" fill="#ffffff" stroke="#4a5568" stroke-width="1.2"/>
<text x="85" y="136.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">SIGINT or</text>
<text x="85" y="152.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">SIGTERM</text>
<rect x="175" y="107" width="160" height="66" rx="10" fill="#ebf4ff" stroke="#4a5568" stroke-width="1.2"/>
<text x="255" y="128.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">signal thread:</text>
<text x="255" y="144.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">fire the latch,</text>
<text x="255" y="160.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">then log</text>
<rect x="365" y="107" width="160" height="66" rx="10" fill="#fefcbf" stroke="#4a5568" stroke-width="1.2"/>
<text x="445" y="128.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">shutdown latch</text>
<text x="445" y="144.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">(every clone</text>
<text x="445" y="160.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">sees it once)</text>
<rect x="560" y="27" width="200" height="66" rx="10" fill="#e2e8f0" stroke="#4a5568" stroke-width="1.2"/>
<text x="660" y="48.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">HTTP surface: stop</text>
<text x="660" y="64.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">accepting, cancel</text>
<text x="660" y="80.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">every job, drain</text>
<rect x="560" y="187" width="200" height="66" rx="10" fill="#e2e8f0" stroke="#4a5568" stroke-width="1.2"/>
<text x="660" y="208.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">D-Bus surface: stop</text>
<text x="660" y="224.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">the stats stream,</text>
<text x="660" y="240.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">then close the bus</text>
<rect x="805" y="107" width="170" height="66" rx="10" fill="#fefcbf" stroke="#4a5568" stroke-width="1.2"/>
<text x="890" y="128.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">exit without</text>
<text x="890" y="144.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">running library</text>
<text x="890" y="160.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">finalizers</text>
<rect x="175" y="257" width="160" height="66" rx="10" fill="#ebf4ff" stroke="#4a5568" stroke-width="1.2"/>
<text x="255" y="278.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">second signal:</text>
<text x="255" y="294.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">exit at once</text>
<text x="255" y="310.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1a202c" text-anchor="middle">(status 130)</text>
<line x1="153" y1="140" x2="172" y2="140" stroke="#1a202c" stroke-width="1.4" marker-end="url(#head)"/>
<line x1="338" y1="140" x2="362" y2="140" stroke="#1a202c" stroke-width="1.4" marker-end="url(#head)"/>
<path d="M525,125 L535,125 Q545,125 545,115 L545,70 Q545,60 555,60 L557,60" fill="none" stroke="#1a202c" stroke-width="1.4" marker-end="url(#head)"/>
<path d="M525,155 L535,155 Q545,155 545,165 L545,210 Q545,220 555,220 L557,220" fill="none" stroke="#1a202c" stroke-width="1.4" marker-end="url(#head)"/>
<path d="M760,60 L775,60 Q785,60 785,70 L785,115 Q785,125 795,125 L802,125" fill="none" stroke="#1a202c" stroke-width="1.4" marker-end="url(#head)"/>
<path d="M760,220 L775,220 Q785,220 785,210 L785,165 Q785,155 795,155 L802,155" fill="none" stroke="#1a202c" stroke-width="1.4" marker-end="url(#head)"/>
<line x1="255" y1="176" x2="255" y2="254" stroke="#c53030" stroke-width="1.4" marker-end="url(#head-c53030)"/>
<text x="660" y="318.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4a5568" text-anchor="middle">bounds in the code: 3 seconds for open HTTP requests,</text>
<text x="660" y="334.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4a5568" text-anchor="middle">5 seconds to join the D-Bus thread, 30 seconds for</text>
<text x="660" y="350.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4a5568" text-anchor="middle">the whole drain, after which the process ends anyway</text>
</svg>
