[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-py"
version = "0.1.0"
description = "Event-driven Python driver for the `brain` edge-AI executable: send an image, get detected boxes back."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pillow>=10"]

# The D-Bus client (brain_py.dbus) needs jeepney; install with `pip install brain-py[dbus]`.
[project.optional-dependencies]
dbus = ["jeepney>=0.8"]

[project.scripts]
brain-detect-image = "brain_py.examples.detect_image:main"

[tool.setuptools]
packages = ["brain_py", "brain_py.examples"]
