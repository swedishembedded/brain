# Third-party. fp32-only, core-compute-only GPU stack - see crates/kernels.
# wgpu/pollster: ONE workspace pin for the native GPU stack - the version was
# previously copied into 6+ crate manifests, where one crate bumping alone
# would split the workspace across two wgpu majors. The wasm-target wgpu
# entries ([target.'cfg(target_arch = "wasm32")'.dependencies]) stay explicit
# in their crates: they need `default-features = false`, which a member cannot
# apply on top of a defaulted workspace entry.
# The published 29 carries a Vulkan staging-memory defect that costs this
# project real VRAM on every upload; the fix and how to consume it are in the
# `[patch]` note at the very bottom of this file.
wgpu = "29"
pollster = "0.4"
# Image codecs, default-features off; each consumer adds exactly the codec
# features it needs (`features = [...]` on top of a workspace dep is additive).
image = { version = "0.25", default-features = false }
ureq = { version = "2", default-features = false, features = ["tls"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
sha2 = "0.10"
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Jinja2 execution of a checkpoint's OWN `tokenizer_config.json` chat_template
# string - the generic path for chat rendering, so a new model family needs no
# hand-ported template code (see crates/data/src/chat_template.rs). Its own
# `preserve_order` feature keeps a rendered `tojson` byte-identical to the
# source JSON's key order; deliberately does NOT touch serde_json's own
# (workspace-wide) `preserve_order` feature -- transcode straight into
# minijinja::Value instead of through serde_json::Value, so this stays
# isolated and does not change key order anywhere else in the workspace.
minijinja = { version = "2", features = ["loop_controls", "json", "preserve_order"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }
# Safetensors read/write (HF's official pure-Rust container) + half for
# f16/bf16<->f32. Both are wasm-compatible.
safetensors = "0.8"
half = "2"
clap = { version = "4", default-features = false, features = ["std", "help", "error-context", "string"] }
ash = { version = "0.38" }
naga = { version = "29", features = ["wgsl-in", "spv-out"] }
# ONNX export (pure-Rust serializer); only `prost` runtime is needed at build.
prost = "0.14"
# Intel NPU runtime (OpenVINO). Default dependency of brain-npu on x86_64
# linux/windows. `runtime-linking` => the OpenVINO shared library is loaded at
# run time (not linked at build), so the build stays green without OpenVINO
# installed; `--device npu` works with no special rebuild.
openvino = { version = "0.11", default-features = false, features = ["runtime-linking"] }

# HTTP provider-API surface (crates/apiserve): axum/tower/tokio stack. Confined to
# that crate - the core compute graph never links these.
axum = { version = "0.7" }
tower = { version = "0.5", features = ["limit", "load-shed", "timeout", "util"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tokio-stream = "0.1"
futures = "0.3"
async-stream = "0.3"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
subtle = "2"
bytes = "1"
anyhow = "1"
jsonschema = "0.49"

# Structured tracing. `tracing` is the FACADE every library crate emits
# through (zero cost with no subscriber installed); `tracing-subscriber` is
# the consumer and belongs only to crates/trace, which owns the single global
# subscriber install. env-filter builds the per-target level filter from the
# crates/trace family registry; json is the --trace-format json renderer.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# braintop TUI (crates/braintop): a standalone btop-like monitor that renders the
# StatsSnapshot over D-Bus. Confined to that bin - no engine/model crate links it.
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }

# crates/atif (ATIF trajectory model, mirrored from applications/sven/crates/atif):
# versions matched to sven's own workspace so the mirror stays a straight diff.
# Unrelated to crates/trace above, which is the tracing/observability crate.
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
tempfile = "3"
# libc was previously only a literal per-crate dep (crates/gpu-core,
# crates/shutdown, both pinned "0.2"); promoted to a workspace entry here so
# crates/atif (and any future consumer) can inherit it instead of repeating
# the literal a third time.
libc = "0.2"

[profile.release]
opt-level = 3
# Thin, not fat: `cargo test --release` links a separate binary per test
# crate (100+ of them), and fat LTO re-optimizes each one's whole dependency
# closure from scratch at link time - one previously took 2m45s to relink
# alone with deps already built. Thin LTO still does cross-crate inlining
# (the WGSL kernel dispatch this profile exists for is unaffected either way:
# the GPU shaders are compiled by the driver at runtime, not by rustc/LLVM)
# at a fraction of the link cost. Revisit only with a measured regression on
# a real perf-gate baseline, not by assumption.
lto = "thin"

# ---------------------------------------------------------------------------
# Dependency overrides
# ---------------------------------------------------------------------------
#
# wgpu 29 as published carries a Vulkan defect that costs this project real
# VRAM. `wgpu-hal`'s `create_buffer` asks `gpu-allocator` for
# `MemoryLocation::CpuToGpu` for every `MAP_WRITE` buffer, whose preferred
# memory-property bits include `DEVICE_LOCAL`. On a card whose driver exposes a
# host-visible memory type drawn from the whole VRAM heap - NVIDIA does, over
# all 24 GiB on this project's P40s - every staging buffer
# `Queue::write_buffer` allocates therefore lands in video memory, and
# `gpu-allocator` pools freed blocks rather than returning them to the driver.
# Uploading N bytes of weights costs N bytes of VRAM for the destination plus N
# more: an exact, reproducible 2.00x, measured through `nvidia-smi` deltas.
# With the fix, 1.00x - equal to a hand-written Vulkan backend on the same
# card. The gate is `crates/gpu-core/tests/vram_overhead.rs`; the full
# root-cause ledger is `.agents/roadmap/backend-vulkan.md`.
#
# Steering staging into host memory made uploads slower at first, badly enough
# that the fix shipped opt-in with the cost written down next to it. That is
# resolved: host memory is expensive to ALLOCATE (the driver pins the pages, at
# ~0.5 GB/s on a P40, against ~100x cheaper and size-independent for
# device-local memory), so a fresh allocation per `write_buffer` made pinning
# the whole cost of uploading. The fork now recycles upload staging buffers, so
# the pages are pinned once. Measured on a P40, 1 GiB in the 4 MiB chunks real
# weight upload uses: 1.16 GB/s before any of this, 0.43 GB/s with host staging
# alone, 4.84 GB/s with the reuse. Half the VRAM and roughly four times the
# upload throughput, so this is no longer a trade to be weighed per workload.
#
# The fix lives on a fork branch cut from the v29.0.4 tag - the exact version
# resolved by the pin above - so consuming it needs no API migration in
# `crates/backend-wgpu`.

# [patch.crates-io]
# wgpu = { git = "https://github.com/swedishembedded/wgpu", branch = "main" }
#
# Patching `wgpu` alone is enough: its `wgpu-core`/`wgpu-hal`/`wgpu-types`/
# `naga` dependencies are path deps inside that repo, so the whole tree comes
# from the fork - verified, `Cargo.lock` picks up all five.
#
# `main` is this fork's own default branch, distinct from `trunk` (the mirrored
# upstream default) - it will carry this fix and whatever else the fork owner
# curates onto it. Kept commented out for one concrete, tested reason, not a
# style choice: Cargo resolves a `[patch]` git source by fetching it up front,
# BEFORE `.cargo/config.toml`'s `paths` override gets a chance to substitute
# anything - confirmed by uncommenting this exact line locally, which failed
# every build here with "cannot locate remote-tracking branch 'origin/main'"
# even with the local override in place and correct. The `paths` override does
# not shield a `[patch]` pointed at a branch that does not exist yet on the
# remote. As of this commit `main` exists only as a local branch in the fork
# checkout (cut from `v29-staging-host-memory`, same two commits) - uncomment
# once the fork owner pushes it, and not before, or every build here and in CI
# breaks at dependency resolution rather than compile time. Until then, local
# development is consumed through `.cargo/config.toml`'s `paths` override (see
# `.cargo/config.toml.example`), which is how every number quoted above was
# measured and requires no change to this file at all.
#
# To work on the dependency itself rather than consume a pinned rev, override
# it with a local checkout instead: copy `.cargo/config.toml.example` to
# `.cargo/config.toml` (gitignored) and point its `paths` entry at the
# checkout. That is a build-time source substitution - it takes precedence over
# the `[patch]` above, touches neither this manifest nor `Cargo.lock`, and
# picks up the working tree on every rebuild.
