[workspace.package]
version = "1.0.0"
edition = "2021"
# Apache-2.0, matching the SPDX identifier in every source file, the LICENSE
# file's own text, and README.md. This said `MIT` while all 1914 of those
# disagreed - all 110 member crates inherit it, so the wrong value was the
# license every crate published.
license = "Apache-2.0"
repository = "https://github.com/swedishembedded/brain"
# brain is built by Swedish Embedded AB. Every member crate inherits these,
# so the authorship and the homepage travel with the package metadata into
# `cargo doc`, docs.rs, and anything else that reads a manifest - rather than
# living only in a copyright header nobody's tooling looks at.
authors = ["Martin Schröder <info@swedishembedded.com>"]
homepage = "https://swedishembedded.com"

