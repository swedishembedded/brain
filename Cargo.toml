[workspace]
resolver = "2"
members = ["crates/*"]
# The Vulkan cooperative-matrix path pulls in ash + naga and is an *optional*
# acceleration backend. Keep the default `cargo build` pure-wgpu (the core
# invariant) by excluding it from the default set; build it explicitly with
# `cargo build -p brain-vulkan` or via the cli's `vulkan-coopmat` feature.
#
# `crates/vulkan` is the ONLY deliberate exclusion. This list is
# hand-maintained, and a crate silently missing from it is built as a
# DEPENDENCY but its own tests never run under a bare `cargo test` - which is
# how omni's actively-developed int8 dual-GPU work went untested by default
# (audit F37). When adding a crate under crates/, add it here too unless you
# are excluding it on purpose WITH a comment saying why.
default-members = [
    "crates/backend-api",
    "crates/backend-wgpu",
    "crates/backend-cpu",
    "crates/backend-vulkan",
    "crates/wgsl-cpu",
    "crates/gpu-core",
    "crates/kernels",
    "crates/arch",
    "crates/checkpoint",
    "crates/gguf",
    "crates/paramstore",
    "crates/optim",
    "crates/autodiff",
    "crates/data",
    "crates/audio",
    "crates/model",
    "crates/toymoe",
    "crates/gpt2",
    "crates/qwen3",
    "crates/qwen35moe",
    "crates/lfm2",
    "crates/qwen3vl",
    "crates/qwen3asr",
    "crates/qwen3omnimoe",
    "crates/nemotronasr",
    "crates/fastvlm",
    "crates/moondream3",
    "crates/glmdsa",
    "crates/deepseek2",
