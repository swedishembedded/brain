[workspace]
resolver = "2"
members = ["crates/*"]
# The Vulkan cooperative-matrix path pulls in ash + naga and is an *optional*
# acceleration backend. Keep the default `cargo build` pure-wgpu (the core
# invariant) by excluding it from the default set; build it explicitly with
# `cargo build -p brain-vulkan` or via the cli's `vulkan-coopmat` feature.
default-members = [
    "crates/backend-api",
    "crates/backend-wgpu",
    "crates/backend-cpu",
    "crates/backend-vulkan",
    "crates/gpu-core",
    "crates/kernels",
    "crates/checkpoint",
    "crates/paramstore",
    "crates/optim",
    "crates/autodiff",
    "crates/data",
    "crates/audio",
    "crates/model",
    "crates/moe",
    "crates/gpt",
    "crates/qwen",
    "crates/lfm",
    "crates/qwenvl",
    "crates/qwen-asr",
    "crates/nemotron",
    "crates/fastvlm",
    "crates/moondream",
    "crates/glm",
    "crates/seq2seq",
    "crates/autoencoder",
    "crates/diffusion",
    "crates/vae",
    "crates/dit",
    "crates/zimage",
    "crates/flux2",
    "crates/forecast",
    "crates/fcbench",
    "crates/chronos2",
    "crates/kronos",
    "crates/fincast",
    "crates/timeseries",
    "crates/codec",
    "crates/speaker",
    "crates/tts",
    "crates/pid",
    "crates/federated",
    "crates/eval",
    "crates/bench",
    "crates/perf",
    "crates/gradcheck",
    "crates/testutil",
    "crates/modelref",
    "crates/modelstore",
    "crates/capability",
    "crates/events",
    "crates/hfsm",
    "crates/wm-core",
    "crates/wm-display",
    "crates/wm-diamond",
    "crates/wm-genie",
    "crates/vision",
    "crates/imaging",
    "crates/sam2",
    "crates/facenet",
    "crates/vqgan",
    "crates/clip",
    "crates/t5",
    "crates/flux1",
    "crates/restore",
    "crates/unet",
    "crates/controlnet",
    "crates/pulid",
    "crates/depth",
    "crates/splat",
    "crates/mirror",
    "crates/capture",
    "crates/yolo",
    "crates/onnx",
