# Third-party. fp32-only, core-compute-only GPU stack — see crates/kernels.
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Safetensors read/write (HF's official pure-Rust container) + half for
# f16/bf16<->f32. Both are wasm-compatible.
safetensors = "0.8"
half = "2"
clap = { version = "4", default-features = false, features = ["std", "help", "error-context", "string"] }
ash = { version = "0.38" }
naga = { version = "29", features = ["wgsl-in", "spv-out"] }
# ONNX export (pure-Rust serializer); only `prost` runtime is needed at build.
prost = "0.14"
# Intel NPU runtime (OpenVINO). Default dependency of brain-npu on x86_64
# linux/windows. `runtime-linking` => the OpenVINO shared library is loaded at
# run time (not linked at build), so the build stays green without OpenVINO
# installed; `--device npu` works with no special rebuild.
openvino = { version = "0.11", default-features = false, features = ["runtime-linking"] }

# HTTP provider-API surface (crates/apiserve): axum/tower/tokio stack. Confined to
# that crate — the core compute graph never links these.
axum = { version = "0.7" }
tower = { version = "0.5", features = ["limit", "load-shed", "timeout", "util"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tokio-stream = "0.1"
futures = "0.3"
async-stream = "0.3"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
subtle = "2"
bytes = "1"
anyhow = "1"
jsonschema = "0.49"

# braintop TUI (crates/braintop): a standalone btop-like monitor that renders the
# StatsSnapshot over D-Bus. Confined to that bin — no engine/model crate links it.
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }

[profile.release]
opt-level = 3
lto = true
