[workspace]
resolver = "2"
members = ["crates/*"]
# The Vulkan cooperative-matrix path pulls in ash + naga and is an *optional*
# acceleration backend. Keep the default `cargo build` pure-wgpu (the core
# invariant) by excluding it from the default set; build it explicitly with
# `cargo build -p brain-vulkan` or via the cli's `vulkan-coopmat` feature.
default-members = [
    "crates/backend-api",
    "crates/backend-wgpu",
    "crates/backend-cpu",
    "crates/backend-vulkan",
    "crates/gpu-core",
    "crates/kernels",
    "crates/checkpoint",
    "crates/paramstore",
    "crates/optim",
    "crates/autodiff",
    "crates/data",
    "crates/audio",
    "crates/model",
    "crates/moe",
    "crates/gpt",
    "crates/qwen",
    "crates/lfm",
    "crates/qwenvl",
    "crates/qwen-asr",
    "crates/nemotron",
    "crates/fastvlm",
    "crates/moondream",
    "crates/glm",
    "crates/seq2seq",
    "crates/autoencoder",
    "crates/diffusion",
    "crates/vae",
    "crates/dit",
    "crates/zimage",
    "crates/forecast",
    "crates/fcbench",
    "crates/chronos2",
    "crates/kronos",
    "crates/fincast",
    "crates/timeseries",
    "crates/codec",
    "crates/speaker",
    "crates/tts",
    "crates/pid",
    "crates/federated",
    "crates/eval",
    "crates/bench",
    "crates/perf",
    "crates/gradcheck",
    "crates/capability",
    "crates/events",
    "crates/hfsm",
    "crates/wm-core",
    "crates/wm-display",
    "crates/wm-diamond",
    "crates/wm-genie",
    "crates/vision",
    "crates/depth",
    "crates/splat",
    "crates/mirror",
    "crates/capture",
    "crates/yolo",
    "crates/onnx",
    "crates/npu",
    "crates/runtime",
    "crates/server",
    "crates/cli",
    "crates/dbus",
    "crates/residency",
    "crates/web",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/swedishembedded/brain"

[workspace.dependencies]
# Internal crates (path deps; short lib names used in `use` statements).
brain-backend-api = { path = "crates/backend-api" }
brain-backend-wgpu = { path = "crates/backend-wgpu" }
brain-backend-cpu = { path = "crates/backend-cpu" }
brain-backend-vulkan = { path = "crates/backend-vulkan" }
brain-gpu-core = { path = "crates/gpu-core" }
brain-kernels = { path = "crates/kernels" }
brain-checkpoint = { path = "crates/checkpoint" }
brain-paramstore = { path = "crates/paramstore" }
brain-optim = { path = "crates/optim" }
brain-autodiff = { path = "crates/autodiff" }
brain-data = { path = "crates/data" }
brain-audio = { path = "crates/audio" }
brain-model = { path = "crates/model" }
brain-moe = { path = "crates/moe" }
brain-gpt = { path = "crates/gpt" }
brain-qwen = { path = "crates/qwen" }
brain-lfm = { path = "crates/lfm" }
brain-nemotron = { path = "crates/nemotron" }
brain-qwen-asr = { path = "crates/qwen-asr" }
brain-fastvlm = { path = "crates/fastvlm" }
brain-glm = { path = "crates/glm" }
brain-seq2seq = { path = "crates/seq2seq" }
brain-autoencoder = { path = "crates/autoencoder" }
brain-diffusion = { path = "crates/diffusion" }
brain-vae = { path = "crates/vae" }
brain-dit = { path = "crates/dit" }
brain-zimage = { path = "crates/zimage" }
brain-timeseries = { path = "crates/timeseries" }
brain-codec = { path = "crates/codec" }
brain-speaker = { path = "crates/speaker" }
brain-tts = { path = "crates/tts" }
brain-pid = { path = "crates/pid" }
brain-federated = { path = "crates/federated" }
brain-eval = { path = "crates/eval" }
brain-bench = { path = "crates/bench" }
brain-perf = { path = "crates/perf" }
brain-gradcheck = { path = "crates/gradcheck" }
brain-capability = { path = "crates/capability" }
brain-residency = { path = "crates/residency" }
brain-dbus = { path = "crates/dbus" }
brain-events = { path = "crates/events" }
brain-hfsm = { path = "crates/hfsm" }
brain-wm-core = { path = "crates/wm-core" }
brain-wm-display = { path = "crates/wm-display" }
brain-wm-diamond = { path = "crates/wm-diamond" }
brain-wm-genie = { path = "crates/wm-genie" }
brain-vision = { path = "crates/vision" }
brain-depth = { path = "crates/depth" }
brain-splat = { path = "crates/splat" }
brain-mirror = { path = "crates/mirror" }
brain-capture = { path = "crates/capture" }
brain-yolo = { path = "crates/yolo" }
brain-onnx = { path = "crates/onnx" }
brain-npu = { path = "crates/npu" }
brain-forecast = { path = "crates/forecast" }
brain-fcbench = { path = "crates/fcbench" }
brain-chronos2 = { path = "crates/chronos2" }
brain-kronos = { path = "crates/kronos" }
brain-fincast = { path = "crates/fincast" }
brain-runtime = { path = "crates/runtime" }
brain-server = { path = "crates/server" }
brain-vulkan = { path = "crates/vulkan" }
brain-wgsl-cpu = { path = "crates/wgsl-cpu" }

# Third-party. fp32-only, core-compute-only GPU stack — see crates/kernels.
bytemuck = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", default-features = false, features = ["std", "help", "error-context", "string"] }
ash = { version = "0.38" }
naga = { version = "29", features = ["wgsl-in", "spv-out"] }
# ONNX export (pure-Rust serializer); only `prost` runtime is needed at build.
prost = "0.14"
# Intel NPU runtime (OpenVINO). Default dependency of brain-npu on x86_64
# linux/windows. `runtime-linking` => the OpenVINO shared library is loaded at
# run time (not linked at build), so the build stays green without OpenVINO
# installed; `--device npu` works with no special rebuild.
openvino = { version = "0.11", default-features = false, features = ["runtime-linking"] }

[profile.release]
opt-level = 3
lto = true
